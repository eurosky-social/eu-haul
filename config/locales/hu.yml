  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Költöztesse át fiókját"
    title: "Költöztesse át fiókját Európába"
    title_named: "Költöztesse át fiókját a(z) %{name} szolgáltatásba"
    lead: "Vigye át bejegyzéseit, követéseit és identitását egy európai szerverre. A handle-jét is megtarthatja, és a követői semmit sem fognak észrevenni."
    start: "Migráció indítása"
    how_it_works: "Hogyan működik"
    steps_label: "Az átköltözés lépései"
    steps:
      sign_in:
        label: "Bejelentkezés"
        text: "Jelentkezzen be jelenlegi handle-jével és jelszavával. A jelszót csak egyszer használjuk, és soha nem tároljuk."
      server:
        label: "Szerver kiválasztása"
        text: "Válassza az Eurosky-t vagy bármely más szervert, majd válassza ki új handle-jét."
      confirm:
        label: "Megerősítés e-mailben"
        text: "Átvisszük az adatait, és az utolsó lépést e-mailben kérjük megerősíteni. Körülbelül 20–30 percet vesz igénybe."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Hogyan működik"
    title: "Hogyan működik a fiók átköltöztetése"
    lead: "Fiókja körülbelül fél óra alatt átköltözik egy másik szerverre. Bejegyzései, követései és identitása Önnel tart, a követői pedig továbbra is követni fogják."
    before:
      title: "Mielőtt elkezdi"
      credentials: "A jelenlegi handle-je és a fiókja jelszava. Az alkalmazásjelszavak nem működnek. Ha kétfaktoros hitelesítést használ, a bejelentkezési kódra is szüksége lesz, amelyet elkérünk."
      email: "Hozzáférés a fiókja e-mail-címéhez. Oda küldünk egy kódot, később pedig a jelenlegi szervere is küld egyet."
      time: "Körülbelül fél óra, amíg nem használja a fiókját."
      invite: "Egyes szerverekhez meghívókód. A varázsló jelzi, ha a választott szerver ezt kéri."
    moves:
      title: "Mi költözik Önnel"
      everything: "A fiókja teljes tartalma: bejegyzései és válaszai, kedvelései és megosztásai, követései, listái és tiltásai, profilja, képei és videói, valamint az alkalmazásbeállításai, például a mentett hírfolyamok és a némított szavak. Az identitása is költözik, így a követői továbbra is követni fogják."
      handle: "A handle-je is jöhet, ha saját domainen van. A jelenlegi szervere domainjén lévő handle, például valaki.bsky.social, ott marad: az új szerveren újat választ."
    steps:
      title: "Lépésről lépésre"
      sign_in:
        title: "Bejelentkezés"
        text: "Jelentkezzen be a jelenlegi handle-jével és jelszavával. Ezeket a költözés elindításához használjuk, a jelszavát soha nem tároljuk."
      choose:
        title: "Válassza ki, hová költözik"
        text: "Válasszon szervert, fogadja el a feltételeit, ha vannak, és válassza ki ott a handle-jét. A teljes fiókjáról biztonsági mentést is kérhet."
      verify:
        title: "Erősítse meg e-mail-címét"
        text: "E-mailben küldünk egy kódot. A költözés akkor indul, amikor megadja azt a migráció állapotoldalán."
      copy:
        title: "Átmásoljuk a fiókját"
        text: "Létrehozzuk a fiókját az új szerveren, és mindent átmásolunk oda; az állapotoldal mutatja az előrehaladást. Közben ne posztoljon, ne kedveljen és ne kövessen senkit: ezek a változások nem kerülnének át."
      confirm:
        title: "Erősítse meg a költözést"
        text: "A jelenlegi szervere e-mailben küld egy megerősítő kódot. Adja meg az állapotoldalon egy órán belül, vagy kérjen újat. Ez a lépés irányítja az identitását az új szerverre."
      done:
        title: "Kész"
        text: "Az új szerveren lévő fiókja bekapcsol, a régi pedig deaktiválódik. E-mailben elküldjük, hogyan jelentkezhet be, az új fiókja jelszavával együtt."
    know:
      title: "Jó tudni"
      duration: "A legtöbb költözés 20–30 percig tart. A sok képet és videót tartalmazó fiókoknál tovább tart."
      cancel: "Amíg az 5. lépésben meg nem adja a megerősítő kódot, megszakíthatja a költözést, és a fiókja ott marad, ahol van."
      recovery: "Az identitás új szerverre irányítása itt nem vonható vissza. Kap egy helyreállítási kulcsot, amellyel visszavonható, ezért tartsa biztonságos helyen."
      old_account: "A régi fiókja deaktiválódik, nem törlődik. Ezzel az eszközzel később visszaköltözhet a szerverére."
      backup: "Ha biztonsági mentést kért, 24 óráig töltheti le."
      deletion: "A költözés befejezése után 2 nappal töröljük a költözés bejegyzését és mindent, amit hozzá megőriztünk."
      sign_in: "A későbbi bejelentkezéshez használja az új handle-jét, és az alkalmazásában válassza az új szervert tárhelyszolgáltatóként."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Fiók átköltöztetésének indítása"
      errors_heading: "Kérem, javítsa ki a következő hibákat:"
      card_label: "Fiók átköltöztetésének indítása"
      step_of: "%{current}/%{total}. lépés"
      steps_label: "A migráció lépései"

      # Progress bar labels
      progress:
        account: "Fiók"
        email: "E-mail"
        destination: "Célszerver"
        handle: "Handle"
        review: "Áttekintés"

      # Step 1: Account Credentials
      step1:
        title: "Fiókazonosító adatok"
        subtitle: "Jelentkezzen be az átköltöztetni kívánt fiókba. A jelszavát soha nem tároljuk."
        handle_label: "Az Ön handle-je"
        handle_placeholder: "felhasznalonev.bsky.social"
        handle_help: "Adja meg jelenlegi AT Protocol handlejét"
        password_label: "Fiók jelszava"
        password_help: "Jelenlegi fiókjelszava (az alkalmazásjelszavak nem működnek)"
        two_factor_title: "Kétfaktoros hitelesítés"
        two_factor_help: "Bejelentkezési kódot küldtünk az e-mail címére. Adja meg alább."
        two_factor_placeholder: "Adja meg a bejelentkezési kódot"
        legal_consent_html: 'Elolvastam és elfogadom a <a href="%{tos_url}" target="_blank" rel="noopener">Szolgáltatási feltételeket</a> és tudomásul veszem az <a href="%{privacy_url}" target="_blank" rel="noopener">Adatvédelmi irányelveket</a>'
        continue: "Tovább"

      # Step 2: Email
      step2:
        title: "E-mail-cím"
        subtitle: "Erre a címre küldjük a migrációs állapotfrissítéseket."
        email_label: "E-mail-cím"
        email_help: "Erre a címre küldjük a migrációs állapotfrissítéseket"
        email_readonly_help: "A fiókjából lekért e-mail cím"
        email_manual_help: "Nem sikerült lekérni az e-mail címet. Kérem, adja meg kézzel."
        confirm_access: "Hozzáférek ehhez az e-mail címhez, és le tudom kérni a rá küldött megerősítő kódot."
        one_account_per_email: "Ez a cím lesz a fiókja e-mail-címe az új szerveren is, és egy szerveren címenként csak egy fiók lehet. Ha már regisztrált ott ezzel a címmel, előbb törölje azt a fiókot, vagy módosítsa az e-mail-címét — különben a migráció leáll."
        back: "Vissza"
        continue: "Tovább"

      # Step 3: Destination Server
      step3:
        title: "Célszerver"
        subtitle: "Válassza ki, hová szeretné átköltöztetni a fiókját."
        server_label: "Célszerver"
        server_placeholder: "Válasszon szervert…"
        server_custom: "Egyéni szerver…"
        server_help: "Válassza ki, hova szeretne átköltöztetni a fiókját"
        custom_url_label: "Egyéni szerver URL-je"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Adja meg az egyéni szerver teljes URL-jét"
        invite_code_label: "Meghívókód"
        invite_code_placeholder: "Adja meg a meghívókódot"
        invite_code_help: "Ez a szerver meghívókódot igényel"
        existing_account_title: "Létező fiók található"
        existing_account_help: "Az Ön fiókja már létezik a célszerveren. Kérem, erősítse meg jelszavát a migráció folytatásához."
        target_password_label: "Jelszava a célszerveren"
        target_password_placeholder: "Adja meg a létező fiók jelszavát"
        target_2fa_label: "Bejelentkezési kód (2FA)"
        target_2fa_help: "Ellenőrizze e-mailjeit a kétfaktoros hitelesítési kódért"
        deactivated_notice: "Ez a fiók deaktiváltnak tűnik"
        deactivated_reason: "(valószínűleg egy korábbi migrációs kísérlettől)."
        deactivated_help: "Ha nem emlékszik a jelszavára, próbálkozhat a következőkkel:"
        deactivated_reset: "Jelszó visszaállítása:"
        deactivated_contact: "Forduljon a PDS rendszergazdájához a(z) %{email} címen az inaktív fiók eltávolítás és a migráció újraindítása érdekében. Mellékelje a DID-jét:"
        pds_consent_title: "A célszerver jogi feltételei"
        back: "Vissza"
        continue: "Tovább"

      # Step 4: New Handle
      step4:
        title: "Új handle"
        custom_domain_title: "Egyéni domain észlelve"
        custom_domain_help: "Az Ön handleje (%{handle}) egyéni domain. Továbbra is használhatja az új szerveren."
        keep_handle: "Jelenlegi handle megtartása"
        new_handle_label: "Az Ön új handle-je"
        new_handle_placeholder: "felhasznalonev"
        domain_label: "Handle-domain"
        new_handle_help: "Válassza ki új handle-jét (lehet a régi is) a célszerveren."
        back: "Vissza"
        continue: "Tovább"

      # Step 5: Review & Confirm
      step5:
        title: "Áttekintés és megerősítés"
        subtitle: "Ellenőrizze az alábbi adatokat, mielőtt elküldjük a megerősítő e-mailt."
        current_handle: "Jelenlegi handle"
        email: "E-mail"
        destination_server: "Célszerver"
        new_handle: "Új handle"
        invite_code: "Meghívókód"
        create_backup: "Biztonsági mentés létrehozása migráció előtt"
        backup_help: "Letölti a fiókadatok teljes másolatát. 24 óráig elérhető."
        confirm_email_html: "Amikor a <strong>Tovább</strong> gombra kattint, megerősítő e-mailt küldünk a(z) <strong>%{email}</strong> címre. A migráció csak az e-mailben történő megerősítés után indul el."
        no_usage_title: "Ne használja fiókját a migráció során"
        no_usage_help: "A migráció elindítása után zárja be az összes alkalmazást és böngészőlapot a fiókjával. A migráció során létrehozott bejegyzések, kedvelések és követések nem kerülnek átvitelre. E-mailt kap, amikor befejeződött (~20-30 perc)."
        acknowledge: "Megértem, hogy nem szabad használnom a fiókomat a migráció során"
        back: "Vissza"
        continue: "Tovább"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Kilép a migrációból?"
        body: "A megadott adatok elvesznek. A fiókján még semmi sem változott."
        stay: "Maradok"
        leave: "Kilépés"

