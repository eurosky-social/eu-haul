  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Μεταφέρετε τον λογαριασμό σας"
    title: "Μεταφέρετε τον λογαριασμό σας στην Ευρώπη"
    title_named: "Μεταφέρετε τον λογαριασμό σας στο %{name}"
    lead: "Πάρτε μαζί σας τις αναρτήσεις, τις ακολουθήσεις και την ταυτότητά σας σε έναν ευρωπαϊκό διακομιστή. Το handle σας μπορεί να έρθει μαζί σας και οι ακόλουθοί σας δεν θα καταλάβουν τίποτα."
    start: "Έναρξη μετεγκατάστασης"
    how_it_works: "Πώς λειτουργεί"
    steps_label: "Πώς γίνεται η μεταφορά"
    steps:
      sign_in:
        label: "Σύνδεση"
        text: "Συνδεθείτε με το τρέχον handle και τον κωδικό πρόσβασής σας. Τον χρησιμοποιούμε μία φορά και δεν τον αποθηκεύουμε ποτέ."
      server:
        label: "Επιλογή διακομιστή"
        text: "Επιλέξτε το Eurosky ή οποιονδήποτε άλλο διακομιστή και επιλέξτε το νέο σας handle."
      confirm:
        label: "Επιβεβαίωση μέσω e-mail"
        text: "Μεταφέρουμε τα δεδομένα σας και σας ζητάμε να επιβεβαιώσετε το τελευταίο βήμα μέσω e-mail. Διαρκεί περίπου 20–30 λεπτά."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Πώς λειτουργεί"
    title: "Πώς γίνεται η μεταφορά του λογαριασμού σας"
    lead: "Ο λογαριασμός σας μεταφέρεται σε άλλον διακομιστή σε περίπου μισή ώρα. Οι αναρτήσεις, οι ακολουθήσεις και η ταυτότητά σας έρχονται μαζί σας, και όσοι σας ακολουθούν συνεχίζουν να σας ακολουθούν."
    before:
      title: "Πριν ξεκινήσετε"
      credentials: "Το τρέχον handle σας και ο κωδικός πρόσβασης του λογαριασμού σας. Οι κωδικοί εφαρμογών δεν λειτουργούν. Αν χρησιμοποιείτε αυθεντικοποίηση δύο παραγόντων, θα χρειαστείτε επίσης τον κωδικό σύνδεσης που θα σας ζητήσουμε."
      email: "Πρόσβαση στη διεύθυνση e-mail του λογαριασμού σας. Σας στέλνουμε εκεί έναν κωδικό, και αργότερα σας στέλνει έναν και ο τρέχων διακομιστής σας."
      time: "Περίπου μισή ώρα κατά την οποία δεν χρησιμοποιείτε τον λογαριασμό σας."
      invite: "Για ορισμένους διακομιστές, ένας κωδικός πρόσκλησης. Ο οδηγός σάς ενημερώνει αν ο διακομιστής που επιλέγετε χρειάζεται κωδικό."
    moves:
      title: "Τι μεταφέρεται μαζί σας"
      everything: "Όλα όσα υπάρχουν στον λογαριασμό σας: οι αναρτήσεις και οι απαντήσεις σας, τα likes και οι αναδημοσιεύσεις, οι ακολουθήσεις, οι λίστες και οι αποκλεισμοί, το προφίλ σας, οι εικόνες και τα βίντεό σας, καθώς και οι ρυθμίσεις της εφαρμογής, όπως οι αποθηκευμένες ροές και οι λέξεις σε σίγαση. Μεταφέρεται και η ταυτότητά σας, οπότε όσοι σας ακολουθούν συνεχίζουν να σας ακολουθούν."
      handle: "Το handle σας μπορεί να έρθει μαζί σας αν βρίσκεται στο δικό σας domain. Ένα handle στο domain του τρέχοντος διακομιστή σας, όπως name.bsky.social, μένει πίσω: επιλέγετε νέο στον νέο διακομιστή."
    steps:
      title: "Βήμα προς βήμα"
      sign_in:
        title: "Σύνδεση"
        text: "Συνδεθείτε με το τρέχον handle και τον κωδικό πρόσβασής σας. Τα χρησιμοποιούμε για να ξεκινήσουμε τη μεταφορά και δεν αποθηκεύουμε ποτέ τον κωδικό πρόσβασής σας."
      choose:
        title: "Επιλέξτε προορισμό"
        text: "Επιλέξτε διακομιστή, αποδεχτείτε τους όρους του αν έχει, και επιλέξτε εκεί το handle σας. Μπορείτε επίσης να ζητήσετε αντίγραφο ασφαλείας ολόκληρου του λογαριασμού σας."
      verify:
        title: "Επιβεβαιώστε το e-mail σας"
        text: "Σας στέλνουμε έναν κωδικό μέσω e-mail. Η μεταφορά ξεκινά μόλις τον εισαγάγετε στη σελίδα κατάστασης της μετεγκατάστασής σας."
      copy:
        title: "Αντιγράφουμε τον λογαριασμό σας"
        text: "Δημιουργούμε τον λογαριασμό σας στον νέο διακομιστή και αντιγράφουμε εκεί τα πάντα· η σελίδα κατάστασης δείχνει την πρόοδο. Στο μεταξύ μη δημοσιεύετε, μην κάνετε like και μην ακολουθείτε κανέναν: αυτές οι αλλαγές δεν θα μεταφερθούν."
      confirm:
        title: "Επιβεβαιώστε τη μεταφορά"
        text: "Λαμβάνετε από τον τρέχοντα διακομιστή σας ένα e-mail με κωδικό επιβεβαίωσης. Εισαγάγετέ τον στη σελίδα κατάστασης μέσα σε μία ώρα ή ζητήστε νέο. Με αυτό το βήμα η ταυτότητά σας κατευθύνεται στον νέο διακομιστή."
      done:
        title: "Ολοκληρώθηκε"
        text: "Ο λογαριασμός σας στον νέο διακομιστή ενεργοποιείται και ο παλιός απενεργοποιείται. Σας στέλνουμε μέσω e-mail οδηγίες σύνδεσης μαζί με τον κωδικό πρόσβασης του νέου σας λογαριασμού."
    know:
      title: "Καλό να γνωρίζετε"
      duration: "Οι περισσότερες μεταφορές διαρκούν 20–30 λεπτά. Οι λογαριασμοί με πολλές εικόνες και βίντεο χρειάζονται περισσότερο χρόνο."
      cancel: "Μέχρι να εισαγάγετε τον κωδικό επιβεβαίωσης στο βήμα 5, μπορείτε να ακυρώσετε τη μεταφορά και ο λογαριασμός σας μένει εκεί που είναι."
      recovery: "Η ανακατεύθυνση της ταυτότητάς σας στον νέο διακομιστή δεν μπορεί να αναιρεθεί από εδώ. Σας δίνουμε ένα κλειδί ανάκτησης που μπορεί να την αναιρέσει, οπότε φυλάξτε το σε ασφαλές μέρος."
      old_account: "Ο παλιός σας λογαριασμός απενεργοποιείται, δεν διαγράφεται. Μπορείτε αργότερα να επιστρέψετε στον διακομιστή του με αυτό το εργαλείο."
      backup: "Αν ζητήσατε αντίγραφο ασφαλείας, μπορείτε να το κατεβάσετε για 24 ώρες."
      deletion: "Διαγράφουμε την εγγραφή της μεταφοράς σας, και ό,τι κρατήσαμε γι' αυτήν, 2 ημέρες μετά την ολοκλήρωσή της."
      sign_in: "Για να συνδεθείτε στη συνέχεια, χρησιμοποιήστε το νέο σας handle και επιλέξτε τον νέο σας διακομιστή ως πάροχο φιλοξενίας στην εφαρμογή σας."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Έναρξη μετεγκατάστασης λογαριασμού"
      errors_heading: "Παρακαλώ διορθώστε τα ακόλουθα σφάλματα:"
      card_label: "Έναρξη μετεγκατάστασης λογαριασμού"
      step_of: "Βήμα %{current} από %{total}"
      steps_label: "Βήματα μετεγκατάστασης"

      # Progress bar labels
      progress:
        account: "Λογαριασμός"
        email: "E-mail"
        destination: "Προορισμός"
        handle: "Handle"
        review: "Επισκόπηση"

      # Step 1: Account Credentials
      step1:
        title: "Στοιχεία λογαριασμού"
        subtitle: "Συνδεθείτε στον λογαριασμό που θέλετε να μεταφέρετε. Δεν αποθηκεύουμε ποτέ τον κωδικό πρόσβασής σας."
        handle_label: "Το handle σας"
        handle_placeholder: "tohandle.bsky.social"
        handle_help: "Εισαγάγετε το τρέχον AT Protocol handle σας"
        password_label: "Κωδικός πρόσβασης λογαριασμού"
        password_help: "Ο τρέχων κωδικός του λογαριασμού σας (οι κωδικοί εφαρμογών δεν λειτουργούν)"
        two_factor_title: "Αυθεντικοποίηση δύο παραγόντων"
        two_factor_help: "Ένας κωδικός σύνδεσης στάλθηκε στο e-mail σας. Εισαγάγετέ τον παρακάτω."
        two_factor_placeholder: "Εισαγάγετε τον κωδικό σύνδεσης"
        legal_consent_html: 'Έχω διαβάσει και συμφωνώ με τους <a href="%{tos_url}" target="_blank" rel="noopener">Όρους Χρήσης</a> και αναγνωρίζω την <a href="%{privacy_url}" target="_blank" rel="noopener">Πολιτική Απορρήτου</a>'
        continue: "Συνέχεια"

      # Step 2: Email
      step2:
        title: "Διεύθυνση e-mail"
        subtitle: "Θα στείλουμε ενημερώσεις κατάστασης μετεγκατάστασης σε αυτό το e-mail."
        email_label: "Διεύθυνση e-mail"
        email_help: "Θα στείλουμε ενημερώσεις κατάστασης μετεγκατάστασης σε αυτό το e-mail"
        email_readonly_help: "Το e-mail ανακτήθηκε από τον λογαριασμό σας"
        email_manual_help: "Δεν καταφέραμε να ανακτήσουμε το e-mail σας. Παρακαλώ εισαγάγετέ το χειροκίνητα."
        confirm_access: "Έχω πρόσβαση σε αυτή τη διεύθυνση e-mail και μπορώ να λάβω έναν κωδικό επιβεβαίωσης που θα σταλεί σε αυτήν."
        back: "Πίσω"
        continue: "Συνέχεια"

      # Step 3: Destination Server
      step3:
        title: "Διακομιστής προορισμού"
        subtitle: "Επιλέξτε πού θέλετε να μετεγκαταστήσετε τον λογαριασμό σας."
        server_label: "Διακομιστής προορισμού"
        server_placeholder: "Επιλέξτε διακομιστή…"
        server_custom: "Προσαρμοσμένος διακομιστής…"
        server_help: "Επιλέξτε πού θέλετε να μετεγκαταστήσετε τον λογαριασμό σας"
        custom_url_label: "URL προσαρμοσμένου διακομιστή"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Εισαγάγετε το πλήρες URL του προσαρμοσμένου διακομιστή σας"
        invite_code_label: "Κωδικός πρόσκλησης"
        invite_code_placeholder: "Εισαγάγετε τον κωδικό πρόσκλησης"
        invite_code_help: "Αυτός ο διακομιστής απαιτεί κωδικό πρόσκλησης"
        existing_account_title: "Βρέθηκε υπάρχων λογαριασμός"
        existing_account_help: "Ο λογαριασμός σας υπάρχει ήδη στον διακομιστή προορισμού. Παρακαλώ επιβεβαιώστε τον κωδικό πρόσβασής σας για να συνεχίσετε τη μετεγκατάσταση."
        target_password_label: "Ο κωδικός πρόσβασής σας στον διακομιστή προορισμού"
        target_password_placeholder: "Εισαγάγετε τον κωδικό πρόσβασης για τον υπάρχοντα λογαριασμό"
        target_2fa_label: "Κωδικός σύνδεσης (2FA)"
        target_2fa_help: "Ελέγξτε το e-mail σας για τον κωδικό αυθεντικοποίησης δύο παραγόντων"
        deactivated_notice: "Αυτός ο λογαριασμός φαίνεται να είναι απενεργοποιημένος"
        deactivated_reason: "(πιθανόν από προηγούμενη προσπάθεια μετεγκατάστασης)."
        deactivated_help: "Εάν δεν θυμάστε τον κωδικό πρόσβασής σας, μπορείτε να δοκιμάσετε:"
        deactivated_reset: "Επαναφορά κωδικού πρόσβασης:"
        deactivated_contact: "Επικοινωνήστε με τον διαχειριστή PDS στο %{email} για να αφαιρέσει αυτόν τον ανενεργό λογαριασμό και να ξεκινήσετε ξανά τη μετεγκατάσταση. Συμπεριλάβετε το DID σας:"
        pds_consent_title: "Νομικοί όροι διακομιστή προορισμού"
        back: "Πίσω"
        continue: "Συνέχεια"

      # Step 4: New Handle
      step4:
        title: "Νέο handle"
        custom_domain_title: "Εντοπίστηκε προσαρμοσμένο domain"
        custom_domain_help: "Το handle σας %{handle} είναι προσαρμοσμένο domain. Μπορείτε να συνεχίσετε να το χρησιμοποιείτε στον νέο διακομιστή."
        keep_handle: "Διατήρηση του τρέχοντος handle"
        new_handle_label: "Το νέο handle σας"
        new_handle_placeholder: "όνομαχρήστη"
        domain_label: "Τομέας του handle"
        new_handle_help: "Επιλέξτε το νέο σας handle (μπορεί να είναι το παλιό) στον διακομιστή προορισμού."
        back: "Πίσω"
        continue: "Συνέχεια"

      # Step 5: Review & Confirm
      step5:
        title: "Επισκόπηση και επιβεβαίωση"
        subtitle: "Ελέγξτε τα παρακάτω στοιχεία πριν στείλουμε το e-mail επιβεβαίωσης."
        current_handle: "Τρέχον handle"
        email: "E-mail"
        destination_server: "Διακομιστής προορισμού"
        new_handle: "Νέο handle"
        invite_code: "Κωδικός πρόσκλησης"
        create_backup: "Δημιουργία αντιγράφου ασφαλείας πριν τη μετεγκατάσταση"
        backup_help: "Κατεβάζει ένα πλήρες αντίγραφο των δεδομένων του λογαριασμού σας. Διαθέσιμο για 24 ώρες."
        confirm_email_html: "Όταν κάνετε κλικ στο <strong>Συνέχεια</strong>, θα στείλουμε ένα e-mail επιβεβαίωσης στο <strong>%{email}</strong>. Η μετεγκατάσταση θα ξεκινήσει μόνο αφού επιβεβαιώσετε μέσω αυτού του e-mail."
        no_usage_title: "Μη χρησιμοποιείτε τον λογαριασμό σας κατά τη μετεγκατάσταση"
        no_usage_help: "Μόλις ξεκινήσει η μετεγκατάσταση, κλείστε όλες τις εφαρμογές και τις καρτέλες του προγράμματος περιήγησης με τον λογαριασμό σας. Αναρτήσεις, likes ή ακολουθήσεις κατά τη μετεγκατάσταση δεν θα μεταφερθούν. Θα λάβετε e-mail όταν ολοκληρωθεί (~20-30 λεπτά)."
        acknowledge: "Κατανοώ ότι δεν πρέπει να χρησιμοποιώ τον λογαριασμό μου κατά τη μετεγκατάσταση"
        back: "Πίσω"
        continue: "Συνέχεια"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Έξοδος από τη μετεγκατάσταση;"
        body: "Τα στοιχεία που εισαγάγατε θα χαθούν. Δεν έχει αλλάξει ακόμη τίποτα στον λογαριασμό σας."
        stay: "Παραμονή εδώ"
        leave: "Έξοδος"

    # ──────────────────────────────────────────
    # JavaScript strings for the wizard
    # ──────────────────────────────────────────
    js:
      # Step 1
      typeahead_searching: "Αναζήτηση..."
      enter_handle: "Παρακαλώ εισαγάγετε ένα handle"
      enter_password: "Παρακαλώ εισαγάγετε τον κωδικό πρόσβασής σας"
      handle_needs_domain: "Το handle πρέπει να περιλαμβάνει domain (π.χ. user.bsky.social)"
      authenticating: "Αυθεντικοποίηση..."
      authenticating_details: "Αυθεντικοποίηση και ανάκτηση των στοιχείων του λογαριασμού σας..."
      two_factor_sent: "Ένας κωδικός σύνδεσης στάλθηκε στο e-mail σας. Εισαγάγετέ τον παραπάνω και κάντε ξανά κλικ στο Συνέχεια."
      auth_success: "Επιτυχής αυθεντικοποίηση."
      network_error: "Σφάλμα δικτύου. Παρακαλώ δοκιμάστε ξανά."
      continue: "Συνέχεια"
      step_of: "Βήμα {current} από {total}"
      # Step 2
      email_readonly_help: "Το e-mail ανακτήθηκε από τον λογαριασμό σας"
      email_manual_help: "Δεν καταφέραμε να ανακτήσουμε το e-mail σας. Παρακαλώ εισαγάγετέ το χειροκίνητα."
      enter_email: "Παρακαλώ εισαγάγετε τη διεύθυνση e-mail σας"
      invalid_email: "Παρακαλώ εισαγάγετε μια έγκυρη διεύθυνση e-mail"
      confirm_email_access: "Παρακαλώ επιβεβαιώστε ότι έχετε πρόσβαση σε αυτή τη διεύθυνση e-mail."
      # Step 3
      select_server: "Παρακαλώ επιλέξτε έναν διακομιστή ή εισαγάγετε ένα URL προσαρμοσμένου διακομιστή"
      captcha_unsupported: "Αυτός ο διακομιστής απαιτεί επαλήθευση μέσω τηλεφώνου ή captcha για νέους λογαριασμούς, κάτι που δεν μπορεί να ολοκληρωθεί από εδώ. Δημιουργήστε πρώτα τον λογαριασμό σε αυτόν τον διακομιστή, έπειτα επιστρέψτε και επιλέξτε τον ξανά — ο οδηγός θα εντοπίσει τον υπάρχοντα λογαριασμό."
      checking_server: "Έλεγχος διακομιστή..."
      checking_requirements: "Έλεγχος απαιτήσεων διακομιστή..."
      server_verified: "Ο διακομιστής επαληθεύτηκε."
      failed_verify_pds: "Αποτυχία επαλήθευσης PDS. Παρακαλώ ελέγξτε το URL."
      invite_code_required: "Αυτός ο διακομιστής απαιτεί κωδικό πρόσκλησης. Παρακαλώ εισαγάγετέ τον παρακάτω και κάντε κλικ στο Συνέχεια."
      enter_invite_code: "Παρακαλώ εισαγάγετε έναν κωδικό πρόσκλησης για να συνεχίσετε."
      checking_existing: "Έλεγχος για υπάρχοντα λογαριασμό..."
      verifying_credentials: "Επαλήθευση στοιχείων..."
      authenticating_existing: "Αυθεντικοποίηση με τον υπάρχοντα λογαριασμό σας..."
      credentials_verified: "Τα στοιχεία επαληθεύτηκαν."
      enter_target_password: "Παρακαλώ εισαγάγετε τον κωδικό πρόσβασής σας για αυτόν τον διακομιστή"
      pds_consent_description: "Ο διακομιστής {pds} έχει δημοσιεύσει τα παρακάτω νομικά έγγραφα. Παρακαλώ διαβάστε τα πριν συνεχίσετε."
      pds_consent_tos: "Όροι χρήσης"
      pds_consent_privacy: "Πολιτική απορρήτου"
