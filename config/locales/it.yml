  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Sposta il tuo account"
    title: "Sposta il tuo account in Europa"
    title_named: "Sposta il tuo account su %{name}"
    lead: "Porta i tuoi post, gli account che segui e la tua identità su un server europeo. Il tuo handle può venire con te e i tuoi follower non noteranno nulla."
    start: "Avvia la migrazione"
    how_it_works: "Come funziona"
    steps_label: "Come funziona il trasferimento"
    steps:
      sign_in:
        label: "Accedi"
        text: "Accedi con il tuo handle e la tua password attuali. La usiamo una sola volta e non la salviamo mai."
      server:
        label: "Scegli un server"
        text: "Scegli Eurosky o qualsiasi altro server, poi il tuo nuovo handle."
      confirm:
        label: "Conferma via e-mail"
        text: "Trasferiamo i tuoi dati e ti chiediamo di confermare l'ultimo passaggio via e-mail. Ci vogliono circa 20–30 minuti."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Come funziona"
    title: "Come funziona il trasferimento del tuo account"
    lead: "Il tuo account si sposta su un altro server in circa mezz'ora. I tuoi post, gli account che segui e la tua identità vengono con te, e chi ti segue continua a seguirti."
    before:
      title: "Prima di iniziare"
      credentials: "Il tuo handle attuale e la password del tuo account. Le password delle app non funzionano. Se usi l'autenticazione a due fattori, ti servirà anche il codice di accesso che ti chiediamo."
      email: "L'accesso all'indirizzo e-mail del tuo account. Ti inviamo lì un codice, e più tardi anche il tuo server attuale te ne invia uno."
      time: "Circa mezz'ora in cui non usi il tuo account."
      invite: "Per alcuni server, un codice di invito. La procedura guidata ti dice se il server che scegli ne richiede uno."
    moves:
      title: "Cosa si sposta con te"
      everything: "Tutto ciò che c'è nel tuo account: i tuoi post e le risposte, i Mi piace e i repost, gli account che segui, le liste e i blocchi, il tuo profilo, le tue immagini e i tuoi video e le impostazioni delle app, come i feed salvati e le parole silenziate. Si sposta anche la tua identità, quindi chi ti segue continua a seguirti."
      handle: "Il tuo handle può venire con te se è sul tuo dominio. Un handle sul dominio del tuo server attuale, come nome.bsky.social, resta lì: sul nuovo server ne scegli uno nuovo."
    steps:
      title: "Passo dopo passo"
      sign_in:
        title: "Accedi"
        text: "Accedi con il tuo handle e la tua password attuali. Li usiamo per avviare il trasferimento e non salviamo mai la tua password."
      choose:
        title: "Scegli dove andare"
        text: "Scegli un server, accettane i termini se ne ha e scegli lì il tuo handle. Puoi anche chiedere un backup dell'intero account."
      verify:
        title: "Conferma la tua e-mail"
        text: "Ti inviamo un codice via e-mail. Il trasferimento inizia quando lo inserisci nella pagina di stato della tua migrazione."
      copy:
        title: "Copiamo il tuo account"
        text: "Creiamo il tuo account sul nuovo server e vi copiamo tutto; la pagina di stato mostra l'avanzamento. Nel frattempo non pubblicare, non mettere Mi piace e non seguire nessuno: queste modifiche non verrebbero trasferite."
      confirm:
        title: "Conferma il trasferimento"
        text: "Il tuo server attuale ti invia via e-mail un codice di conferma. Inseriscilo nella pagina di stato entro un'ora, oppure richiedine uno nuovo. Questo passaggio fa puntare la tua identità al nuovo server."
      done:
        title: "Fatto"
        text: "Il tuo account sul nuovo server viene attivato e quello vecchio disattivato. Ti inviamo via e-mail le istruzioni per accedere, insieme alla password del nuovo account."
    know:
      title: "Buono a sapersi"
      duration: "La maggior parte dei trasferimenti richiede 20–30 minuti. Gli account con molte immagini e video richiedono più tempo."
      cancel: "Finché non inserisci il codice di conferma al passaggio 5, puoi annullare il trasferimento e il tuo account resta dov'è."
      recovery: "Far puntare la tua identità al nuovo server non si può annullare da qui. Ti diamo una chiave di recupero che permette di annullarlo, quindi conservala in un posto sicuro."
      old_account: "Il tuo vecchio account viene disattivato, non eliminato. Più avanti puoi tornare sul suo server con questo strumento."
      backup: "Se hai chiesto un backup, puoi scaricarlo per 24 ore."
      deletion: "Eliminiamo il record del tuo trasferimento, e tutto ciò che abbiamo conservato per esso, 2 giorni dopo il completamento del trasferimento."
      sign_in: "Per accedere in seguito, usa il tuo nuovo handle e scegli il nuovo server come provider di hosting nella tua app."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Avvia migrazione account"
      errors_heading: "Correggi i seguenti errori:"
      card_label: "Avvia migrazione account"
      step_of: "Passaggio %{current} di %{total}"
      steps_label: "Passaggi della migrazione"

      # Progress bar labels
      progress:
        account: "Account"
        email: "E-mail"
        destination: "Destinazione"
        handle: "Handle"
        review: "Riepilogo"

      # Step 1: Account Credentials
      step1:
        title: "Credenziali account"
        subtitle: "Accedi all'account che vuoi spostare. Non salviamo mai la tua password."
        handle_label: "Il tuo handle"
        handle_placeholder: "tuohandle.bsky.social"
        handle_help: "Inserisci il tuo handle AT Protocol attuale"
        password_label: "Password dell'account"
        password_help: "La password attuale del tuo account (le password delle app non funzioneranno)"
        two_factor_title: "Autenticazione a due fattori"
        two_factor_help: "Un codice di accesso è stato inviato alla tua e-mail. Inseriscilo qui sotto."
        two_factor_placeholder: "Inserisci il codice di accesso"
        legal_consent_html: "Ho letto e accetto i <a href=\"%{tos_url}\" target=\"_blank\" rel=\"noopener\">Termini di Servizio</a> e prendo atto dell'<a href=\"%{privacy_url}\" target=\"_blank\" rel=\"noopener\">Informativa sulla Privacy</a>"
        continue: "Continua"

      # Step 2: Email
      step2:
        title: "Indirizzo e-mail"
        subtitle: "Invieremo aggiornamenti sullo stato della migrazione a questa e-mail."
        email_label: "Indirizzo e-mail"
        email_help: "Invieremo aggiornamenti sullo stato della migrazione a questa e-mail"
        email_readonly_help: "E-mail recuperata dal tuo account"
        email_manual_help: "Non siamo riusciti a recuperare la tua e-mail. Inseriscila manualmente."
        confirm_access: "Ho accesso a questo indirizzo e-mail e posso recuperare un codice di conferma inviato ad esso."
        one_account_per_email: "Questo indirizzo diventerà anche l'e-mail del tuo account sul nuovo server, e un server consente un solo account per indirizzo. Se hai già un account lì con questo indirizzo, eliminalo o cambiane prima l'e-mail — altrimenti la migrazione si interromperà."
        back: "Indietro"
        continue: "Continua"

      # Step 3: Destination Server
      step3:
        title: "Server di destinazione"
        subtitle: "Scegli dove vuoi migrare il tuo account."
        server_label: "Server di destinazione"
        server_placeholder: "Seleziona un server…"
        server_custom: "Server personalizzato…"
        server_help: "Scegli dove vuoi migrare il tuo account"
        custom_url_label: "URL del server personalizzato"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Inserisci l'URL completo del tuo server personalizzato"
        invite_code_label: "Codice di invito"
        invite_code_placeholder: "Inserisci il codice di invito"
        invite_code_help: "Questo server richiede un codice di invito"
        existing_account_title: "Account esistente trovato"
        existing_account_help: "Il tuo account esiste già sul server di destinazione. Verifica la tua password per proseguire con la migrazione."
        target_password_label: "La tua password sul server di destinazione"
        target_password_placeholder: "Inserisci la password dell'account esistente"
        target_2fa_label: "Codice di accesso (2FA)"
        target_2fa_help: "Controlla la tua e-mail per il codice di autenticazione a due fattori"
        deactivated_notice: "Questo account risulta disattivato"
        deactivated_reason: "(probabilmente a causa di un tentativo di migrazione precedente)."
        deactivated_help: "Se non ricordi la password, puoi provare:"
        deactivated_reset: "Reimposta la password:"
        deactivated_contact: "Contatta l'amministratore del PDS all'indirizzo %{email} per rimuovere questo account inattivo e riavviare la migrazione. Includi il tuo DID:"
        pds_consent_title: "Termini legali del server di destinazione"
        back: "Indietro"
        continue: "Continua"

      # Step 4: New Handle
      step4:
        title: "Nuovo handle"
        custom_domain_title: "Dominio personalizzato rilevato"
        custom_domain_help: "Il tuo handle %{handle} è un dominio personalizzato. Puoi continuare a utilizzarlo sul nuovo server."
        keep_handle: "Mantieni il mio handle attuale"
        new_handle_label: "Il tuo nuovo handle"
        new_handle_placeholder: "nomeutente"
        domain_label: "Dominio dell'handle"
        new_handle_help: "Scegli il tuo nuovo handle (può essere quello vecchio) sul server di destinazione."
        back: "Indietro"
        continue: "Continua"

      # Step 5: Review & Confirm
      step5:
        title: "Riepilogo e conferma"
        subtitle: "Controlla i dati qui sotto prima che inviamo l'e-mail di conferma."
        current_handle: "Handle attuale"
        email: "E-mail"
        destination_server: "Server di destinazione"
        new_handle: "Nuovo handle"
        invite_code: "Codice di invito"
        create_backup: "Crea un backup prima della migrazione"
        backup_help: "Scarica una copia completa dei dati del tuo account. Disponibile per 24 ore."
        confirm_email_html: "Quando fai clic su <strong>Continua</strong>, invieremo un'e-mail di conferma a <strong>%{email}</strong>. La migrazione inizierà solo dopo la conferma tramite quell'e-mail."
        no_usage_title: "Non utilizzare il tuo account durante la migrazione"
        no_usage_help: "Una volta avviata la migrazione, chiudi tutte le app e le schede del browser con il tuo account. Post, like e follow effettuati durante la migrazione non verranno trasferiti. Riceverai un'e-mail al completamento (~20-30 minuti)."
        acknowledge: "Comprendo che non devo utilizzare il mio account durante la migrazione"
        back: "Indietro"
        continue: "Continua"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Uscire dalla migrazione?"
        body: "I dati inseriti andranno persi. Sul tuo account non è stato ancora modificato nulla."
        stay: "Resta qui"
        leave: "Esci"

