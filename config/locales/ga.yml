        deactivated_reason: "(b'fhéidir de bharr iarracht imirce roimhe seo)."
        deactivated_help: "Mura cuimhin leat do phasfhocal, is féidir leat triail a bhaint as:"
        deactivated_reset: "Athshocraigh do phasfhocal:"
