        invite_code_placeholder: "Cuir isteach do chód cuiridh"
        invite_code_help: "Teastaíonn cód cuiridh ón bhfreastalaí seo"
        existing_account_title: "Aimsíodh cuntas atá ann cheana"
        existing_account_help: "Tá do chuntas ann cheana ar an bhfreastalaí ceann scríbe. Deimhnigh do phasfhocal le do thoil chun leanúint leis an imirce."
