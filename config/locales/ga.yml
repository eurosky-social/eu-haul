  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Conas a oibríonn sé"
    title: "Conas a oibríonn bogadh do chuntais"
    lead: "Bogtar do chuntas chuig freastalaí eile i gceann thart ar leathuair an chloig. Tagann do phostálacha, na cuntais a leanann tú agus d'aitheantas leat, agus leanann na daoine a leanann thú ag leanúint ort."
    before:
      title: "Sula dtosaíonn tú"
      credentials: "Do handle reatha agus pasfhocal do chuntais. Ní oibríonn pasfhocail aipe. Má úsáideann tú fíordheimhniú dhá fhachtóir, beidh an cód logála isteach a iarraimid ag teastáil uait freisin."
      email: "Rochtain ar sheoladh ríomhphoist do chuntais. Seolaimid cód chugat ansin, agus níos déanaí seolann do fhreastalaí reatha ceann chugat freisin."
      time: "Thart ar leathuair an chloig nach n-úsáideann tú do chuntas ann."
      invite: "I gcás roinnt freastalaithe, cód cuiridh. Inseoidh an treoraí duit an bhfuil ceann ag teastáil ón bhfreastalaí a roghnaíonn tú."
    moves:
      title: "Cad a bhogann leat"
      everything: "Gach rud i do chuntas: do phostálacha agus d'fhreagraí, na rudaí a thaitin leat agus d'athphostálacha, na cuntais a leanann tú, liostaí agus bacanna, do phróifíl, d'íomhánna agus d'fhíseáin, agus socruithe d'aipeanna, mar shampla fothaí sábháilte agus focail bhalbhaithe. Bogann d'aitheantas freisin, mar sin leanann na daoine a leanann thú ag leanúint ort."
      handle: "Is féidir le do handle teacht leat má tá sé ar d'fhearann féin. Fanann handle ar fhearann do fhreastalaí reatha, mar shampla ainm.bsky.social, i do dhiaidh: roghnaíonn tú ceann nua ar an bhfreastalaí nua."
    steps:
      title: "Céim ar chéim"
      sign_in:
        title: "Logáil isteach"
        text: "Logáil isteach le do handle agus do phasfhocal reatha. Úsáidimid iad chun an bogadh a thosú agus ní stórálaimid do phasfhocal riamh."
      choose:
        title: "Roghnaigh cá rachaidh tú"
        text: "Roghnaigh freastalaí, glac lena théarmaí má tá téarmaí aige, agus roghnaigh do handle ansin. Is féidir leat cóip chúltaca de do chuntas ar fad a iarraidh freisin."
      verify:
        title: "Deimhnigh do ríomhphost"
        text: "Seolaimid cód chugat i ríomhphost. Tosaíonn an bogadh nuair a chuireann tú isteach é ar leathanach stádais d'imirce."
      copy:
        title: "Cóipeálaimid do chuntas"
        text: "Cruthaímid do chuntas ar an bhfreastalaí nua agus cóipeálaimid gach rud chuige; taispeánann an leathanach stádais an dul chun cinn. Ná postáil, ná taitin agus ná lean aon rud idir an dá linn: ní thiocfadh na hathruithe sin leat."
      confirm:
        title: "Deimhnigh an bogadh"
        text: "Seolann do fhreastalaí reatha cód deimhnithe chugat i ríomhphost. Cuir isteach é ar an leathanach stádais laistigh d'uair an chloig, nó iarr ceann nua. Díríonn an chéim seo d'aitheantas ar an bhfreastalaí nua."
      done:
        title: "Críochnaithe"
        text: "Cuirtear do chuntas ar an bhfreastalaí nua ar siúl agus díghníomhachtaítear an seancheann. Seolaimid ríomhphost chugat faoi conas logáil isteach, mar aon le pasfhocal do chuntais nua."
    know:
      title: "Eolas úsáideach"
      duration: "Tógann formhór na mbogadh 20–30 nóiméad. Tógann cuntais a bhfuil go leor íomhánna agus físeán iontu níos faide."
      cancel: "Go dtí go gcuireann tú an cód deimhnithe isteach i gcéim 5, is féidir leat an bogadh a chealú, agus fanann do chuntas mar a bhfuil sé."
      recovery: "Ní féidir díriú d'aitheantais ar an bhfreastalaí nua a chealú anseo. Tugaimid eochair aisghabhála duit atá in ann é a chealú, mar sin coinnigh in áit shábháilte í."
      old_account: "Díghníomhachtaítear do sheanchuntas, ní scriostar é. Is féidir leat bogadh ar ais chuig a fhreastalaí níos déanaí leis an uirlis seo."
      backup: "Má d'iarr tú cóip chúltaca, is féidir leat í a íoslódáil ar feadh 24 uair an chloig."
      deletion: "Scriosaimid taifead do bhogtha, agus gach rud a choinníomar dó, 2 lá tar éis don bhogadh a bheith críochnaithe."
      sign_in: "Chun logáil isteach ina dhiaidh sin, úsáid do handle nua agus roghnaigh do fhreastalaí nua mar sholáthraí óstála i d'aip."


