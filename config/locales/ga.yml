    title_named: "Bog do chuntas chuig %{name}"
    lead: "Tabhair do phostálacha, na cuntais a leanann tú agus d'aitheantas chuig freastalaí Eorpach. Is féidir le do handle teacht leat, agus ní thabharfaidh do leantóirí aon rud faoi deara."
    start: "Tosaigh an imirce"
    how_it_works: "Conas a oibríonn sé"
