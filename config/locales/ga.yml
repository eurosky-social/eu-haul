        pds_consent_title: "Téarmaí dlíthiúla an fhreastalaí ceann scríbe"
        back: "Siar"
        continue: "Lean ar aghaidh"

      # Step 4: New Handle
      step4:
        title: "Handle nua"
        custom_domain_title: "Braitheadh fearann saincheaptha"
        custom_domain_help: "Is fearann saincheaptha é do handle %{handle}. Is féidir leat leanúint á úsáid ar an bhfreastalaí nua."
