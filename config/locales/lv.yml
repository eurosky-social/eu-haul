      steps_label: "Migrācijas soļi"

      # Progress bar labels
      progress:
        account: "Konts"
        email: "E-pasts"
        destination: "Galamērķis"
        handle: "Handle"
        review: "Pārskats"

      # Step 1: Account Credentials
      step1:
        title: "Konta pieteikšanās dati"
        subtitle: "Piesakieties kontā, kuru vēlaties pārcelt. Mēs nekad neglabājam jūsu paroli."
        handle_label: "Jūsu handle"
        handle_placeholder: "jusuhandle.bsky.social"
        handle_help: "Ievadiet savu pašreizējo AT Protocol handle"
        password_label: "Konta parole"
        password_help: "Jūsu pašreizējā konta parole (lietotņu paroles nedarbosies)"
        two_factor_title: "Divfaktoru autentifikācija"
        two_factor_help: "Pieteikšanās kods ir nosūtīts uz jūsu e-pastu. Ievadiet to zemāk."
        two_factor_placeholder: "Ievadiet pieteikšanās kodu"
        legal_consent_html: 'Esmu izlasījis/usi un piekrītu <a href="%{tos_url}" target="_blank" rel="noopener">Pakalpojuma noteikumiem</a> un atzīstu <a href="%{privacy_url}" target="_blank" rel="noopener">Privātuma politiku</a>'
        continue: "Turpināt"

      # Step 2: Email
