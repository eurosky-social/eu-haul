  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Pārceliet savu kontu"
    title: "Pārceliet savu kontu uz Eiropu"
    title_named: "Pārceliet savu kontu uz %{name}"
    lead: "Pārnesiet savus ierakstus, sekojumus un identitāti uz Eiropas serveri. Jūsu handle var doties līdzi, un jūsu sekotāji neko nepamanīs."
    start: "Sākt migrāciju"
    how_it_works: "Kā tas darbojas"
    steps_label: "Kā notiek pārcelšana"
    steps:
      sign_in:
        label: "Piesakieties"
        text: "Piesakieties ar savu pašreizējo handle un paroli. Paroli izmantojam vienreiz un nekad to neglabājam."
      server:
        label: "Izvēlieties serveri"
        text: "Izvēlieties Eurosky vai jebkuru citu serveri un savu jauno handle."
      confirm:
        label: "Apstipriniet pa e-pastu"
        text: "Mēs pārsūtām jūsu datus un lūdzam apstiprināt pēdējo soli pa e-pastu. Tas aizņem aptuveni 20–30 minūtes."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Kā tas darbojas"
    title: "Kā notiek konta pārcelšana"
    lead: "Jūsu konts tiek pārcelts uz citu serveri aptuveni pusstundas laikā. Jūsu ieraksti, sekojumi un identitāte pārceļas līdz ar jums, un cilvēki, kas jums seko, turpina jums sekot."
    before:
      title: "Pirms sākat"
      credentials: "Jūsu pašreizējais handle un konta parole. Lietotņu paroles nedarbojas. Ja izmantojat divfaktoru autentifikāciju, jums būs nepieciešams arī pieteikšanās kods, ko mēs pieprasīsim."
      email: "Piekļuve jūsu konta e-pasta adresei. Mēs tur nosūtām kodu, un vēlāk arī jūsu pašreizējais serveris nosūta vienu."
      time: "Aptuveni pusstunda, kuras laikā neizmantojat savu kontu."
      invite: "Dažiem serveriem — ielūguma kods. Vednis jums pateiks, vai izvēlētajam serverim tāds ir nepieciešams."
    moves:
      title: "Kas pārceļas līdz ar jums"
      everything: "Viss jūsu kontā: jūsu ieraksti un atbildes, atzīmes „patīk“ un atkārtotās publikācijas, sekojumi, saraksti un bloķējumi, profils, attēli un video, kā arī lietotņu iestatījumi, piemēram, saglabātās plūsmas un apklusinātie vārdi. Pārceļas arī jūsu identitāte, tāpēc cilvēki, kas jums seko, turpina jums sekot."
      handle: "Jūsu handle var pārcelties līdzi, ja tas ir jūsu paša domēnā. Handle jūsu pašreizējā servera domēnā, piemēram, vards.bsky.social, paliek tur: jaunajā serverī jūs izvēlaties jaunu."
    steps:
      title: "Soli pa solim"
      sign_in:
        title: "Piesakieties"
        text: "Piesakieties ar savu pašreizējo handle un paroli. Mēs tos izmantojam pārcelšanas sākšanai un nekad neglabājam jūsu paroli."
      choose:
        title: "Izvēlieties galamērķi"
        text: "Izvēlieties serveri, pieņemiet tā noteikumus, ja tādi ir, un izvēlieties tur savu handle. Varat arī pieprasīt visa konta rezerves kopiju."
      verify:
        title: "Apstipriniet e-pastu"
        text: "Mēs nosūtām jums kodu pa e-pastu. Pārcelšana sākas, tiklīdz to ievadāt migrācijas statusa lapā."
      copy:
        title: "Mēs kopējam jūsu kontu"
        text: "Mēs izveidojam jūsu kontu jaunajā serverī un nokopējam uz to visu; statusa lapā redzams progress. Pa to laiku nepublicējiet, neatzīmējiet „patīk“ un nesekojiet nevienam: šīs izmaiņas netiktu pārnestas."
      confirm:
        title: "Apstipriniet pārcelšanu"
        text: "Jūsu pašreizējais serveris nosūta jums apstiprinājuma kodu pa e-pastu. Ievadiet to statusa lapā stundas laikā vai pieprasiet jaunu. Šis solis novirza jūsu identitāti uz jauno serveri."
      done:
        title: "Gatavs"
        text: "Jūsu konts jaunajā serverī tiek ieslēgts, un vecais tiek deaktivizēts. Mēs pa e-pastu nosūtām norādes, kā pieteikties, kopā ar jaunā konta paroli."
    know:
      title: "Noderīgi zināt"
      duration: "Lielākā daļa pārcelšanu ilgst 20–30 minūtes. Konti ar daudz attēliem un video aizņem ilgāku laiku."
      cancel: "Kamēr neesat ievadījis apstiprinājuma kodu 5. solī, varat atcelt pārcelšanu, un jūsu konts paliek, kur bija."
      recovery: "Identitātes novirzīšanu uz jauno serveri šeit nevar atsaukt. Mēs jums iedodam atjaunošanas atslēgu, ar kuru to var atsaukt, tāpēc glabājiet to drošā vietā."
      old_account: "Jūsu vecais konts tiek deaktivizēts, nevis dzēsts. Vēlāk ar šo rīku varat pārcelties atpakaļ uz tā serveri."
      backup: "Ja pieprasījāt rezerves kopiju, varat to lejupielādēt 24 stundu laikā."
      deletion: "Jūsu pārcelšanas ierakstu un visu, ko tam glabājām, mēs dzēšam 2 dienas pēc pārcelšanas pabeigšanas."
      sign_in: "Lai vēlāk pieteiktos, izmantojiet jauno handle un savā lietotnē kā hostinga nodrošinātāju izvēlieties jauno serveri."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Konta migrācijas uzsākšana"
