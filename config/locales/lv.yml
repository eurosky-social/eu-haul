        continue: "Turpināt"

      # Step 3: Destination Server
      step3:
        title: "Galamērķa serveris"
        subtitle: "Izvēlieties, uz kurieni vēlaties migrēt savu kontu."
        server_label: "Galamērķa serveris"
        server_placeholder: "Izvēlieties serveri…"
        server_custom: "Pielāgots serveris…"
        server_help: "Izvēlieties, uz kurieni vēlaties migrēt savu kontu"
