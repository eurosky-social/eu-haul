        target_password_label: "Jūsu parole galamērķa serverī"
        target_password_placeholder: "Ievadiet esošā konta paroli"
        target_2fa_label: "Pieteikšanās kods (2FA)"
        target_2fa_help: "Pārbaudiet e-pastu, lai iegūtu divfaktoru autentifikācijas kodu"
        deactivated_notice: "Šis konts šķiet deaktivizēts"
        deactivated_reason: "(iespējams, iepriekšēja migrācijas mēģinājuma dēļ)."
        deactivated_help: "Ja neatceraties paroli, varat mēģināt:"
        deactivated_reset: "Paroles atiestatīšana:"
