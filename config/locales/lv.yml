        pds_consent_title: "Galamērķa servera juridiskie noteikumi"
        back: "Atpakaļ"
        continue: "Turpināt"

      # Step 4: New Handle
      step4:
        title: "Jauns handle"
        custom_domain_title: "Konstatēts pielāgots domēns"
        custom_domain_help: "Jūsu handle %{handle} ir pielāgots domēns. Varat turpināt to izmantot jaunajā serverī."
        keep_handle: "Paturēt pašreizējo handle"
        new_handle_label: "Jūsu jaunais handle"
        new_handle_placeholder: "lietotājvārds"
        domain_label: "Handle domēns"
        new_handle_help: "Izvēlieties jauno handle (var būt arī vecais) galamērķa serverī."
        back: "Atpakaļ"
        continue: "Turpināt"

      # Step 5: Review & Confirm
      step5:
        title: "Pārskats un apstiprināšana"
        subtitle: "Pārbaudiet tālāk norādīto informāciju, pirms mēs nosūtām apstiprinājuma e-pastu."
        current_handle: "Pašreizējais handle"
        email: "E-pasts"
        destination_server: "Galamērķa serveris"
        new_handle: "Jaunais handle"
        invite_code: "Ielūguma kods"
        create_backup: "Izveidot rezerves kopiju pirms migrācijas"
        backup_help: "Lejupielādē pilnu jūsu konta datu kopiju. Pieejama 24 stundas."
        confirm_email_html: "Kad noklikšķināsiet <strong>Turpināt</strong>, mēs nosūtīsim apstiprinājuma e-pastu uz <strong>%{email}</strong>. Migrācija sāksies tikai pēc apstiprināšanas ar šo e-pastu."
        no_usage_title: "Neizmantojiet kontu migrācijas laikā"
        no_usage_help: "Pēc migrācijas uzsākšanas aizveriet visas lietotnes un pārlūkprogrammas cilnes ar jūsu kontu. Migrācijas laikā veiktie ieraksti, atzīmes un sekošanas netiks pārnesti. Jūs saņemsiet e-pastu, kad process būs pabeigts (~20-30 minūtes)."
        acknowledge: "Es saprotu, ka migrācijas laikā nedrīkstu izmantot savu kontu"
        back: "Atpakaļ"
        continue: "Turpināt"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Pamest migrāciju?"
        body: "Ievadītie dati tiks zaudēti. Jūsu kontā vēl nekas nav mainīts."
        stay: "Palikt šeit"
        leave: "Pamest"

