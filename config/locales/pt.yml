  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Mova a sua conta"
    title: "Mova a sua conta para a Europa"
    title_named: "Mova a sua conta para %{name}"
    lead: "Leve as suas publicações, seguimentos e identidade para um servidor europeu. O seu handle pode vir consigo e os seus seguidores não vão notar nada."
    start: "Iniciar migração"
    how_it_works: "Como funciona"
    steps_label: "Como funciona a mudança"
    steps:
      sign_in:
        label: "Iniciar sessão"
        text: "Inicie sessão com o seu handle e palavra-passe atuais. Usamo-los uma única vez e nunca os guardamos."
      server:
        label: "Escolher um servidor"
        text: "Escolha o Eurosky ou qualquer outro servidor e defina o seu novo handle."
      confirm:
        label: "Confirmar por e-mail"
        text: "Transferimos os seus dados e pedimos-lhe que confirme o último passo por e-mail. Demora cerca de 20–30 minutos."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Como funciona"
    title: "Como funciona a mudança da sua conta"
    lead: "A sua conta muda para outro servidor em cerca de meia hora. As suas publicações, seguimentos e identidade vêm consigo, e as pessoas que o seguem continuam a segui-lo."
    before:
      title: "Antes de começar"
      credentials: "O seu handle atual e a palavra-passe da sua conta. As palavras-passe de aplicação não funcionam. Se utiliza autenticação de dois fatores, também vai precisar do código de início de sessão que lhe pedimos."
      email: "Acesso ao endereço de e-mail da sua conta. Enviamos-lhe um código para lá e, mais tarde, o seu servidor atual também lhe envia um."
      time: "Cerca de meia hora durante a qual não utiliza a sua conta."
      invite: "Para alguns servidores, um código de convite. O assistente indica-lhe se o servidor que escolher precisa de um."
    moves:
      title: "O que muda consigo"
      everything: "Tudo o que está na sua conta: as suas publicações e respostas, gostos e partilhas, seguimentos, listas e bloqueios, o seu perfil, as suas imagens e vídeos, e as definições da aplicação, como feeds guardados e palavras silenciadas. A sua identidade também muda, por isso as pessoas que o seguem continuam a segui-lo."
      handle: "O seu handle pode vir consigo se estiver no seu próprio domínio. Um handle no domínio do seu servidor atual, como nome.bsky.social, fica para trás: escolhe um novo no novo servidor."
    steps:
      title: "Passo a passo"
      sign_in:
        title: "Iniciar sessão"
        text: "Inicie sessão com o seu handle e palavra-passe atuais. Usamo-los para iniciar a mudança e nunca guardamos a sua palavra-passe."
      choose:
        title: "Escolher o destino"
        text: "Escolha um servidor, aceite os respetivos termos, se existirem, e escolha lá o seu handle. Também pode pedir uma cópia de segurança de toda a sua conta."
      verify:
        title: "Confirmar o seu e-mail"
        text: "Enviamos-lhe um código por e-mail. A mudança começa assim que o introduzir na página de estado da sua migração."
      copy:
        title: "Copiamos a sua conta"
        text: "Criamos a sua conta no novo servidor e copiamos tudo para lá; a página de estado mostra o progresso. Entretanto, não publique, não dê gostos nem siga ninguém: essas alterações não seriam transferidas."
      confirm:
        title: "Confirmar a mudança"
        text: "O seu servidor atual envia-lhe um código de confirmação por e-mail. Introduza-o na página de estado no prazo de uma hora ou peça um novo. Este passo faz a sua identidade apontar para o novo servidor."
      done:
        title: "Concluído"
        text: "A sua conta no novo servidor é ativada e a antiga é desativada. Enviamos-lhe por e-mail as instruções para iniciar sessão, juntamente com a palavra-passe da sua nova conta."
    know:
      title: "É bom saber"
      duration: "A maioria das mudanças demora 20–30 minutos. Contas com muitas imagens e vídeos demoram mais."
      cancel: "Até introduzir o código de confirmação no passo 5, pode cancelar a mudança e a sua conta fica onde está."
      recovery: "Apontar a sua identidade para o novo servidor não pode ser anulado aqui. Damos-lhe uma chave de recuperação que permite anulá-lo, por isso guarde-a num local seguro."
      old_account: "A sua conta antiga é desativada, não eliminada. Mais tarde, pode voltar para o servidor dela com esta ferramenta."
      backup: "Se pediu uma cópia de segurança, pode transferi-la durante 24 horas."
      deletion: "Eliminamos o registo da sua mudança, e tudo o que guardámos para ela, 2 dias após a conclusão da mudança."
      sign_in: "Para iniciar sessão depois, use o seu novo handle e escolha o seu novo servidor como fornecedor de alojamento na sua aplicação."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
