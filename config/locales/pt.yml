        email: "E-mail"
        destination: "Destino"
        handle: "Handle"
        review: "Revisão"

      # Step 1: Account Credentials
      step1:
        title: "Credenciais da conta"
        subtitle: "Inicie sessão na conta que pretende mover. Nunca guardamos a sua palavra-passe."
        handle_label: "O seu handle"
        handle_placeholder: "seuhandle.bsky.social"
        handle_help: "Introduza o seu handle atual do AT Protocol"
        password_label: "Palavra-passe da conta"
        password_help: "Sua senha atual da conta (senhas de aplicativo não funcionarão)"
        two_factor_title: "Autenticação de dois fatores"
        two_factor_help: "Um código de início de sessão foi enviado para o seu e-mail. Introduza-o abaixo."
        two_factor_placeholder: "Introduza o seu código de início de sessão"
        legal_consent_html: 'Li e concordo com os <a href="%{tos_url}" target="_blank" rel="noopener">Termos de Serviço</a> e reconheço a <a href="%{privacy_url}" target="_blank" rel="noopener">Política de Privacidade</a>'
        continue: "Continuar"

      # Step 2: Email
      step2:
        title: "Endereço de e-mail"
        subtitle: "Enviaremos atualizações sobre o estado da migração para este e-mail."
        email_label: "Endereço de e-mail"
        email_help: "Enviaremos atualizações sobre o estado da migração para este e-mail"
        email_readonly_help: "E-mail obtido da sua conta"
        email_manual_help: "Não foi possível obter o seu e-mail. Por favor, introduza-o manualmente."
        confirm_access: "Tenho acesso a este endereço de e-mail e posso obter um código de confirmação enviado para o mesmo."
        back: "Voltar"
        continue: "Continuar"

      # Step 3: Destination Server
      step3:
        title: "Servidor de destino"
        subtitle: "Escolha para onde pretende migrar a sua conta."
        server_label: "Servidor de destino"
        server_placeholder: "Selecione um servidor…"
        server_custom: "Servidor personalizado…"
        server_help: "Escolha para onde pretende migrar a sua conta"
        custom_url_label: "URL do servidor personalizado"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Introduza o URL completo do seu servidor personalizado"
        invite_code_label: "Código de convite"
        invite_code_placeholder: "Introduza o seu código de convite"
        invite_code_help: "Este servidor requer um código de convite"
        existing_account_title: "Conta existente encontrada"
        existing_account_help: "A sua conta já existe no servidor de destino. Por favor, verifique a sua palavra-passe para continuar com a migração."
        target_password_label: "A sua palavra-passe no servidor de destino"
        target_password_placeholder: "Introduza a sua palavra-passe para a conta existente"
        target_2fa_label: "Código de início de sessão (2FA)"
        target_2fa_help: "Verifique o seu e-mail para o código de autenticação de dois fatores"
        deactivated_notice: "Esta conta parece estar desativada"
        deactivated_reason: "(possivelmente de uma tentativa de migração anterior)."
        deactivated_help: "Se não se lembra da sua palavra-passe, pode tentar:"
        deactivated_reset: "Redefinir a sua palavra-passe:"
        deactivated_contact: "Contactar o administrador do PDS em %{email} para remover esta conta inativa e reiniciar a migração. Inclua o seu DID:"
        pds_consent_title: "Termos legais do servidor de destino"
        back: "Voltar"
        continue: "Continuar"

      # Step 4: New Handle
      step4:
        title: "Novo handle"
        custom_domain_title: "Domínio personalizado detetado"
        custom_domain_help: "O seu handle %{handle} é um domínio personalizado. Pode continuar a utilizá-lo no novo servidor."
        keep_handle: "Manter o meu handle atual"
        new_handle_label: "O seu novo handle"
        new_handle_placeholder: "nomedeutilizador"
        domain_label: "Domínio do handle"
        new_handle_help: "Escolha o seu novo handle (pode ser o antigo) no servidor de destino."
        back: "Voltar"
        continue: "Continuar"

      # Step 5: Review & Confirm
      step5:
        title: "Revisão e confirmação"
        subtitle: "Verifique os dados abaixo antes de enviarmos o e-mail de confirmação."
        current_handle: "Handle atual"
        email: "E-mail"
        destination_server: "Servidor de destino"
        new_handle: "Novo handle"
        invite_code: "Código de convite"
        create_backup: "Criar uma cópia de segurança antes da migração"
        backup_help: "Transfere uma cópia completa dos dados da sua conta. Disponível durante 24 horas."
        confirm_email_html: "Ao clicar em <strong>Continuar</strong>, enviaremos um e-mail de confirmação para <strong>%{email}</strong>. A migração só será iniciada depois de confirmar através desse e-mail."
        no_usage_title: "Não utilize a sua conta durante a migração"
        no_usage_help: "Assim que a migração começar, feche todas as aplicações e separadores do navegador com a sua conta. Quaisquer publicações, gostos ou seguimentos feitos durante a migração não serão transferidos. Receberá um e-mail quando estiver concluída (~20-30 minutos)."
        acknowledge: "Compreendo que não devo utilizar a minha conta durante a migração"
        back: "Voltar"
        continue: "Continuar"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Sair da migração?"
        body: "Os dados que introduziu serão perdidos. Ainda nada foi alterado na sua conta."
        stay: "Ficar aqui"
        leave: "Sair"

