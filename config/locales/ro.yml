  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Mutați-vă contul"
    title: "Mutați-vă contul în Europa"
    title_named: "Mutați-vă contul la %{name}"
    lead: "Aduceți postările, urmăririle și identitatea dumneavoastră pe un server european. Handle-ul vă poate însoți, iar urmăritorii dumneavoastră nu vor observa nimic."
    start: "Pornire migrare"
    how_it_works: "Cum funcționează"
    steps_label: "Cum decurge mutarea"
    steps:
      sign_in:
        label: "Autentificare"
        text: "Autentificați-vă cu handle-ul și parola actuale. Le folosim o singură dată și nu le stocăm niciodată."
      server:
        label: "Alegere server"
        text: "Alegeți Eurosky sau orice alt server și stabiliți noul handle."
      confirm:
        label: "Confirmare prin email"
        text: "Transferăm datele dumneavoastră și vă rugăm să confirmați ultimul pas prin email. Durează aproximativ 20–30 de minute."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Cum funcționează"
    title: "Cum funcționează mutarea contului"
    lead: "Contul dumneavoastră se mută pe alt server în aproximativ o jumătate de oră. Postările, urmăririle și identitatea vin cu dumneavoastră, iar persoanele care vă urmăresc continuă să vă urmărească."
    before:
      title: "Înainte să începeți"
      credentials: "Handle-ul actual și parola contului. Parolele de aplicație nu funcționează. Dacă folosiți autentificarea cu doi factori, veți avea nevoie și de codul de autentificare pe care vi-l cerem."
      email: "Acces la adresa de email a contului. Vă trimitem acolo un cod, iar mai târziu serverul actual vă trimite și el unul."
      time: "Aproximativ o jumătate de oră în care nu folosiți contul."
      invite: "Pentru unele servere, un cod de invitație. Asistentul vă spune dacă serverul ales are nevoie de unul."
    moves:
      title: "Ce se mută cu dumneavoastră"
      everything: "Tot ce se află în cont: postările și răspunsurile, aprecierile și redistribuirile, urmăririle, listele și blocările, profilul, imaginile și videoclipurile, precum și setările aplicației, cum ar fi fluxurile salvate și cuvintele ignorate. Se mută și identitatea dumneavoastră, astfel că persoanele care vă urmăresc continuă să vă urmărească."
      handle: "Handle-ul vă poate însoți dacă se află pe propriul dumneavoastră domeniu. Un handle pe domeniul serverului actual, cum ar fi nume.bsky.social, rămâne în urmă: alegeți unul nou pe noul server."
    steps:
      title: "Pas cu pas"
      sign_in:
        title: "Autentificare"
        text: "Autentificați-vă cu handle-ul și parola actuale. Le folosim pentru a porni mutarea și nu vă stocăm niciodată parola."
      choose:
        title: "Alegerea destinației"
        text: "Alegeți un server, acceptați termenii acestuia, dacă există, și alegeți-vă handle-ul acolo. Puteți cere și o copie de siguranță a întregului cont."
      verify:
        title: "Confirmarea emailului"
        text: "Vă trimitem un cod prin email. Mutarea începe după ce îl introduceți pe pagina de stare a migrării."
      copy:
        title: "Copiem contul"
        text: "Creăm contul pe noul server și copiem totul acolo; pagina de stare arată progresul. Între timp, nu publicați, nu apreciați și nu urmăriți pe nimeni: aceste modificări nu ar fi transferate."
      confirm:
        title: "Confirmarea mutării"
        text: "Serverul actual vă trimite un cod de confirmare prin email. Introduceți-l pe pagina de stare în decurs de o oră sau solicitați unul nou. Acest pas face ca identitatea dumneavoastră să indice către noul server."
      done:
        title: "Gata"
        text: "Contul de pe noul server este activat, iar cel vechi este dezactivat. Vă trimitem prin email instrucțiunile de autentificare, împreună cu parola noului cont."
    know:
      title: "Bine de știut"
      duration: "Majoritatea mutărilor durează 20–30 de minute. Conturile cu multe imagini și videoclipuri durează mai mult."
      cancel: "Până când introduceți codul de confirmare la pasul 5, puteți anula mutarea, iar contul rămâne unde este."
      recovery: "Redirecționarea identității către noul server nu poate fi anulată de aici. Vă oferim o cheie de recuperare care o poate anula, așa că păstrați-o într-un loc sigur."
      old_account: "Contul vechi este dezactivat, nu șters. Mai târziu vă puteți muta înapoi pe serverul acestuia cu acest instrument."
      backup: "Dacă ați cerut o copie de siguranță, o puteți descărca timp de 24 de ore."
      deletion: "Ștergem înregistrarea mutării și tot ce am păstrat pentru ea la 2 zile după finalizarea mutării."
      sign_in: "Pentru a vă autentifica ulterior, folosiți noul handle și alegeți noul server ca furnizor de găzduire în aplicație."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Pornire migrare cont"
      errors_heading: "Vă rugăm să corectați următoarele erori:"
      card_label: "Pornire migrare cont"
      step_of: "Pasul %{current} din %{total}"
      steps_label: "Pașii migrării"

      # Progress bar labels
      progress:
        account: "Cont"
        email: "Email"
        destination: "Destinație"
        handle: "Handle"
        review: "Verificare"

      # Step 1: Account Credentials
      step1:
        title: "Credențiale cont"
        subtitle: "Autentificați-vă în contul pe care doriți să-l mutați. Nu vă stocăm niciodată parola."
        handle_label: "Handle-ul dumneavoastră"
        handle_placeholder: "handle-ul_dvs.bsky.social"
        handle_help: "Introduceți handle-ul AT Protocol actual"
        password_label: "Parola contului"
        password_help: "Parola actuală a contului dvs. (parolele de aplicație nu vor funcționa)"
        two_factor_title: "Autentificare cu doi factori"
        two_factor_help: "Un cod de autentificare a fost trimis pe email. Introduceți-l mai jos."
        two_factor_placeholder: "Introduceți codul de autentificare"
        legal_consent_html: 'Am citit și sunt de acord cu <a href="%{tos_url}" target="_blank" rel="noopener">Termenii Serviciului</a> și iau la cunoștință <a href="%{privacy_url}" target="_blank" rel="noopener">Politica de Confidențialitate</a>'
        continue: "Continuare"

      # Step 2: Email
      step2:
        title: "Adresă de email"
        subtitle: "Vom trimite actualizări despre starea migrării la acest email."
        email_label: "Adresă de email"
        email_help: "Vom trimite actualizări despre starea migrării la acest email"
        email_readonly_help: "Email preluat din contul dumneavoastră"
        email_manual_help: "Nu am putut prelua adresa de email. Vă rugăm să o introduceți manual."
        confirm_access: "Am acces la această adresă de email și pot primi un cod de confirmare trimis la aceasta."
        one_account_per_email: "Această adresă va deveni și adresa de email a contului dumneavoastră pe noul server, iar un server permite un singur cont pentru fiecare adresă. Dacă v-ați înregistrat deja acolo cu ea, ștergeți acel cont sau schimbați-i mai întâi adresa de email — altfel migrarea se va opri."
        back: "Înapoi"
        continue: "Continuare"

      # Step 3: Destination Server
      step3:
        title: "Server de destinație"
        subtitle: "Alegeți unde doriți să migrați contul."
        server_label: "Server de destinație"
        server_placeholder: "Selectați un server…"
        server_custom: "Server personalizat…"
        server_help: "Alegeți unde doriți să migrați contul"
        custom_url_label: "URL server personalizat"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Introduceți URL-ul complet al serverului personalizat"
        invite_code_label: "Cod de invitație"
        invite_code_placeholder: "Introduceți codul de invitație"
        invite_code_help: "Acest server necesită un cod de invitație"
        existing_account_title: "Cont existent găsit"
        existing_account_help: "Contul dumneavoastră există deja pe serverul de destinație. Vă rugăm să verificați parola pentru a continua migrarea."
        target_password_label: "Parola dumneavoastră pe serverul de destinație"
        target_password_placeholder: "Introduceți parola pentru contul existent"
        target_2fa_label: "Cod de autentificare (2FA)"
        target_2fa_help: "Verificați emailul pentru codul de autentificare cu doi factori"
        deactivated_notice: "Acest cont pare să fie dezactivat"
        deactivated_reason: "(posibil din cauza unei încercări anterioare de migrare)."
        deactivated_help: "Dacă nu vă amintiți parola, puteți încerca:"
        deactivated_reset: "Resetați parola:"
        deactivated_contact: "Contactați administratorul PDS la %{email} pentru a elimina acest cont inactiv și a reporni migrarea. Includeți DID-ul dumneavoastră:"
        pds_consent_title: "Termenii legali ai serverului de destinație"
        back: "Înapoi"
        continue: "Continuare"

      # Step 4: New Handle
      step4:
        title: "Handle nou"
        custom_domain_title: "Domeniu personalizat detectat"
        custom_domain_help: "Handle-ul dumneavoastră %{handle} este un domeniu personalizat. Puteți continua să-l folosiți pe noul server."
        keep_handle: "Păstrează handle-ul actual"
        new_handle_label: "Noul dumneavoastră handle"
        new_handle_placeholder: "utilizator"
        domain_label: "Domeniul handle-ului"
        new_handle_help: "Alegeți noul handle (poate fi cel vechi) pe serverul de destinație."
        back: "Înapoi"
        continue: "Continuare"

      # Step 5: Review & Confirm
      step5:
        title: "Verificare și confirmare"
        subtitle: "Verificați detaliile de mai jos înainte să trimitem emailul de confirmare."
        current_handle: "Handle actual"
        email: "Email"
        destination_server: "Server de destinație"
        new_handle: "Handle nou"
        invite_code: "Cod de invitație"
        create_backup: "Creează o copie de siguranță înainte de migrare"
        backup_help: "Descarcă o copie completă a datelor contului. Disponibilă 24 de ore."
        confirm_email_html: "Când faceți clic pe <strong>Continuare</strong>, vom trimite un email de confirmare la <strong>%{email}</strong>. Migrarea va începe doar după confirmarea prin acel email."
        no_usage_title: "Nu utilizați contul în timpul migrării"
        no_usage_help: "Odată ce migrarea începe, închideți toate aplicațiile și filele de browser cu contul dumneavoastră. Orice postări, aprecieri sau urmăriri efectuate în timpul migrării nu vor fi transferate. Veți primi un email la finalizare (~20-30 minute)."
        acknowledge: "Înțeleg că nu trebuie să-mi folosesc contul în timpul migrării"
        back: "Înapoi"
        continue: "Continuare"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Părăsiți migrarea?"
        body: "Datele introduse se vor pierde. Încă nu s-a modificat nimic în contul dumneavoastră."
        stay: "Rămâneți aici"
        leave: "Părăsiți"

