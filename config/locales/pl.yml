  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Przenieś swoje konto"
    title: "Przenieś swoje konto do Europy"
    title_named: "Przenieś swoje konto do %{name}"
    lead: "Przenieś swoje posty, obserwacje i tożsamość na europejski serwer. Twój handle może przejść razem z Tobą, a Twoi obserwujący niczego nie zauważą."
    start: "Rozpocznij migrację"
    how_it_works: "Jak to działa"
    steps_label: "Jak przebiega przeniesienie"
    steps:
      sign_in:
        label: "Zaloguj się"
        text: "Zaloguj się swoim obecnym handle i hasłem. Używamy ich tylko raz i nigdy ich nie przechowujemy."
      server:
        label: "Wybierz serwer"
        text: "Wybierz Eurosky lub dowolny inny serwer i ustal swój nowy handle."
      confirm:
        label: "Potwierdź e-mailem"
        text: "Przenosimy Twoje dane i prosimy o potwierdzenie ostatniego kroku e-mailem. Trwa to około 20–30 minut."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Jak to działa"
    title: "Jak działa przeniesienie konta"
    lead: "Twoje konto przenosi się na inny serwer w około pół godziny. Twoje posty, obserwacje i tożsamość przechodzą razem z Tobą, a osoby, które Cię obserwują, nadal będą Cię obserwować."
    before:
      title: "Zanim zaczniesz"
      credentials: "Twój obecny handle i hasło do konta. Hasła aplikacji nie zadziałają. Jeśli używasz uwierzytelniania dwuskładnikowego, potrzebny będzie też kod logowania, o który poprosimy."
      email: "Dostęp do adresu e-mail Twojego konta. Wyślemy tam kod, a później Twój obecny serwer również wyśle Ci kod."
      time: "Około pół godziny, podczas której nie korzystasz ze swojego konta."
      invite: "W przypadku niektórych serwerów kod zaproszenia. Kreator poinformuje Cię, czy wybrany serwer go wymaga."
    moves:
      title: "Co zostanie przeniesione"
      everything: "Wszystko, co jest na Twoim koncie: posty i odpowiedzi, polubienia i podania dalej, obserwacje, listy i blokady, profil, obrazy i filmy oraz ustawienia aplikacji, takie jak zapisane kanały i wyciszone słowa. Przenosi się też Twoja tożsamość, więc osoby, które Cię obserwują, nadal będą Cię obserwować."
      handle: "Twój handle może przejść razem z Tobą, jeśli jest w Twojej własnej domenie. Handle w domenie Twojego obecnego serwera, np. nazwa.bsky.social, zostaje na miejscu: na nowym serwerze wybierasz nowy."
    steps:
      title: "Krok po kroku"
      sign_in:
        title: "Zaloguj się"
        text: "Zaloguj się swoim obecnym handle i hasłem. Używamy ich do rozpoczęcia przeniesienia i nigdy nie przechowujemy Twojego hasła."
      choose:
        title: "Wybierz, dokąd się przenosisz"
        text: "Wybierz serwer, zaakceptuj jego warunki, jeśli je ma, i wybierz tam swój handle. Możesz też poprosić o kopię zapasową całego konta."
      verify:
        title: "Potwierdź swój e-mail"
        text: "Wysyłamy Ci e-mailem kod. Przeniesienie rozpocznie się, gdy wpiszesz go na stronie statusu migracji."
      copy:
        title: "Kopiujemy Twoje konto"
        text: "Tworzymy Twoje konto na nowym serwerze i kopiujemy na nie wszystko; postęp widać na stronie statusu. W tym czasie nie publikuj postów, nie polub ani nie obserwuj niczego: te zmiany nie zostałyby przeniesione."
      confirm:
        title: "Potwierdź przeniesienie"
        text: "Twój obecny serwer wyśle Ci e-mailem kod potwierdzający. Wpisz go na stronie statusu w ciągu godziny albo zamów nowy. Ten krok kieruje Twoją tożsamość na nowy serwer."
      done:
        title: "Gotowe"
        text: "Twoje konto na nowym serwerze zostaje włączone, a stare zostaje dezaktywowane. Wyślemy Ci e-mailem instrukcję logowania wraz z hasłem do nowego konta."
    know:
      title: "Warto wiedzieć"
      duration: "Większość przeniesień trwa 20–30 minut. Konta z dużą liczbą obrazów i filmów potrzebują więcej czasu."
      cancel: "Dopóki nie wpiszesz kodu potwierdzającego w kroku 5, możesz anulować przeniesienie, a Twoje konto zostanie tam, gdzie jest."
      recovery: "Skierowania tożsamości na nowy serwer nie można tutaj cofnąć. Dajemy Ci klucz odzyskiwania, który może to cofnąć, więc przechowuj go w bezpiecznym miejscu."
      old_account: "Twoje stare konto zostaje dezaktywowane, a nie usunięte. Później możesz wrócić na jego serwer za pomocą tego narzędzia."
      backup: "Jeśli poprosiłeś/aś o kopię zapasową, możesz ją pobrać przez 24 godziny."
      deletion: "Rekord Twojego przeniesienia i wszystko, co na jego potrzeby przechowujemy, usuwamy 2 dni po zakończeniu przeniesienia."
      sign_in: "Aby się potem zalogować, użyj nowego handle i wybierz w aplikacji swój nowy serwer jako dostawcę hostingu."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Rozpocznij migrację konta"
      errors_heading: "Proszę poprawić następujące błędy:"
      card_label: "Rozpocznij migrację konta"
      step_of: "Krok %{current} z %{total}"
      steps_label: "Kroki migracji"

      # Progress bar labels
      progress:
        account: "Konto"
        email: "E-mail"
        destination: "Cel"
        handle: "Handle"
        review: "Przegląd"

      # Step 1: Account Credentials
      step1:
        title: "Dane logowania"
        subtitle: "Zaloguj się na konto, które chcesz przenieść. Nigdy nie przechowujemy Twojego hasła."
        handle_label: "Twój handle"
        handle_placeholder: "twojhandle.bsky.social"
        handle_help: "Wpisz swój aktualny handle AT Protocol"
        password_label: "Hasło konta"
        password_help: "Twoje obecne hasło konta (hasła aplikacji nie będą działać)"
        two_factor_title: "Uwierzytelnianie dwuskładnikowe"
        two_factor_help: "Kod logowania został wysłany na Twój adres e-mail. Wpisz go poniżej."
        two_factor_placeholder: "Wpisz swój kod logowania"
        legal_consent_html: 'Przeczytałem/am i akceptuję <a href="%{tos_url}" target="_blank" rel="noopener">Warunki korzystania z usługi</a> oraz przyjmuję do wiadomości <a href="%{privacy_url}" target="_blank" rel="noopener">Politykę prywatności</a>'
        continue: "Kontynuuj"

      # Step 2: Email
      step2:
        title: "Adres e-mail"
        subtitle: "Na ten adres będziemy wysyłać aktualizacje statusu migracji."
        email_label: "Adres e-mail"
        email_help: "Na ten adres będziemy wysyłać aktualizacje statusu migracji"
        email_readonly_help: "Adres e-mail pobrany z Twojego konta"
        email_manual_help: "Nie udało się pobrać Twojego adresu e-mail. Proszę wpisać go ręcznie."
        confirm_access: "Mam dostęp do tego adresu e-mail i mogę odebrać wysłany na niego kod potwierdzający."
        one_account_per_email: "Ten adres stanie się też adresem e-mail Twojego konta na nowym serwerze, a serwer pozwala na tylko jedno konto na adres. Jeśli masz już tam konto z tym adresem, najpierw je usuń lub zmień jego adres e-mail — w przeciwnym razie migracja zostanie przerwana."
        back: "Wstecz"
        continue: "Kontynuuj"

      # Step 3: Destination Server
      step3:
        title: "Serwer docelowy"
        subtitle: "Wybierz, dokąd chcesz przenieść swoje konto."
        server_label: "Serwer docelowy"
        server_placeholder: "Wybierz serwer…"
        server_custom: "Serwer niestandardowy…"
        server_help: "Wybierz, dokąd chcesz przenieść swoje konto"
        custom_url_label: "URL serwera niestandardowego"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Wpisz pełny adres URL serwera niestandardowego"
        invite_code_label: "Kod zaproszenia"
        invite_code_placeholder: "Wpisz swój kod zaproszenia"
        invite_code_help: "Ten serwer wymaga kodu zaproszenia"
        existing_account_title: "Znaleziono istniejące konto"
        existing_account_help: "Twoje konto już istnieje na serwerze docelowym. Proszę zweryfikować swoje hasło, aby kontynuować migrację."
        target_password_label: "Twoje hasło na serwerze docelowym"
        target_password_placeholder: "Wpisz hasło do istniejącego konta"
        target_2fa_label: "Kod logowania (2FA)"
        target_2fa_help: "Sprawdź swoją pocztę e-mail w poszukiwaniu kodu uwierzytelniania dwuskładnikowego"
        deactivated_notice: "To konto wygląda na dezaktywowane"
        deactivated_reason: "(prawdopodobnie z powodu wcześniejszej próby migracji)."
        deactivated_help: "Jeśli nie pamiętasz hasła, możesz spróbować:"
        deactivated_reset: "Zresetować hasło:"
        deactivated_contact: "Skontaktować się z administratorem PDS pod adresem %{email}, aby usunąć to nieaktywne konto i ponownie rozpocząć migrację. Podaj swój DID:"
        pds_consent_title: "Warunki prawne serwera docelowego"
        back: "Wstecz"
        continue: "Kontynuuj"

      # Step 4: New Handle
      step4:
        title: "Nowy handle"
        custom_domain_title: "Wykryto domenę niestandardową"
        custom_domain_help: "Twój handle %{handle} jest domeną niestandardową. Możesz nadal go używać na nowym serwerze."
        keep_handle: "Zachowaj mój aktualny handle"
        new_handle_label: "Twój nowy handle"
        new_handle_placeholder: "nazwauzytkownika"
        domain_label: "Domena handle"
        new_handle_help: "Wybierz nowy handle (może być taki sam jak stary) na serwerze docelowym."
        back: "Wstecz"
        continue: "Kontynuuj"

      # Step 5: Review & Confirm
      step5:
        title: "Przegląd i potwierdzenie"
        subtitle: "Sprawdź poniższe dane, zanim wyślemy e-mail z potwierdzeniem."
        current_handle: "Aktualny handle"
        email: "E-mail"
        destination_server: "Serwer docelowy"
        new_handle: "Nowy handle"
        invite_code: "Kod zaproszenia"
        create_backup: "Utwórz kopię zapasową przed migracją"
        backup_help: "Pobiera pełną kopię danych Twojego konta. Dostępna przez 24 godziny."
        confirm_email_html: "Po kliknięciu <strong>Kontynuuj</strong> wyślemy e-mail z potwierdzeniem na adres <strong>%{email}</strong>. Migracja rozpocznie się dopiero po potwierdzeniu za pośrednictwem tego e-maila."
        no_usage_title: "Nie korzystaj ze swojego konta podczas migracji"
        no_usage_help: "Po rozpoczęciu migracji zamknij wszystkie aplikacje i karty przeglądarki z Twoim kontem. Posty, polubienia i obserwacje wykonane podczas migracji nie zostaną przeniesione. Otrzymasz e-mail po zakończeniu (~20-30 minut)."
        acknowledge: "Rozumiem, że nie powinienem/powinnam korzystać ze swojego konta podczas migracji"
        back: "Wstecz"
        continue: "Kontynuuj"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Opuścić migrację?"
        body: "Wprowadzone dane zostaną utracone. Na Twoim koncie nic jeszcze nie zostało zmienione."
        stay: "Zostań tutaj"
        leave: "Opuść"

