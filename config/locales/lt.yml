        destination: "Paskirtis"
        handle: "Handle"
        review: "Peržiūra"

      # Step 1: Account Credentials
      step1:
        title: "Paskyros prisijungimo duomenys"
        subtitle: "Prisijunkite prie paskyros, kurią norite perkelti. Jūsų slaptažodžio niekada nesaugome."
        handle_label: "Jūsų handle"
        handle_placeholder: "jusuhandle.bsky.social"
        handle_help: "Įveskite dabartinį AT Protocol handle"
