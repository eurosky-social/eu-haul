  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Perkelkite savo paskyrą"
    title: "Perkelkite savo paskyrą į Europą"
    title_named: "Perkelkite savo paskyrą į %{name}"
    lead: "Perkelkite savo įrašus, sekamas paskyras ir tapatybę į Europos serverį. Jūsų handle gali keliauti kartu su jumis, o jūsų sekėjai nieko nepastebės."
    start: "Pradėti perkėlimą"
    how_it_works: "Kaip tai veikia"
    steps_label: "Kaip vyksta perkėlimas"
    steps:
      sign_in:
        label: "Prisijunkite"
        text: "Prisijunkite su dabartiniu handle ir slaptažodžiu. Slaptažodį panaudojame vieną kartą ir niekada jo nesaugome."
      server:
        label: "Pasirinkite serverį"
        text: "Pasirinkite Eurosky ar bet kurį kitą serverį ir savo naują handle."
      confirm:
        label: "Patvirtinkite el. paštu"
        text: "Perkeliame jūsų duomenis ir paprašome paskutinį žingsnį patvirtinti el. paštu. Tai užtrunka apie 20–30 minučių."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Kaip tai veikia"
    title: "Kaip vyksta paskyros perkėlimas"
    lead: "Jūsų paskyra į kitą serverį perkeliama maždaug per pusvalandį. Jūsų įrašai, sekamos paskyros ir tapatybė keliauja kartu su jumis, o jus sekantys žmonės ir toliau jus seka."
    before:
      title: "Prieš pradėdami"
      credentials: "Dabartinis jūsų handle ir paskyros slaptažodis. Programėlių slaptažodžiai neveikia. Jei naudojate dviejų veiksnių autentifikaciją, jums taip pat reikės prisijungimo kodo, kurio paprašysime."
      email: "Prieiga prie paskyros el. pašto adreso. Ten atsiųsime kodą, o vėliau kodą atsiųs ir jūsų dabartinis serveris."
      time: "Maždaug pusvalandis, kai nenaudosite savo paskyros."
      invite: "Kai kuriems serveriams – kvietimo kodas. Vedlys jums pasakys, ar pasirinktam serveriui jo reikia."
    moves:
      title: "Kas perkeliama kartu su jumis"
      everything: "Viskas, kas yra jūsų paskyroje: jūsų įrašai ir atsakymai, patiktukai ir pakartojimai, sekamos paskyros, sąrašai ir blokavimai, profilis, nuotraukos ir vaizdo įrašai bei programėlių nustatymai, pavyzdžiui, išsaugoti srautai ir nutildyti žodžiai. Perkeliama ir jūsų tapatybė, todėl jus sekantys žmonės ir toliau jus seka."
      handle: "Jūsų handle gali keliauti kartu, jei jis yra jūsų nuosavame domene. Handle dabartinio serverio domene, pavyzdžiui, vardas.bsky.social, lieka: naujame serveryje pasirinksite naują."
    steps:
      title: "Žingsnis po žingsnio"
      sign_in:
        title: "Prisijunkite"
        text: "Prisijunkite su dabartiniu handle ir slaptažodžiu. Juos naudojame perkėlimui pradėti, o jūsų slaptažodžio niekada nesaugome."
      choose:
        title: "Pasirinkite, kur keliauti"
        text: "Pasirinkite serverį, sutikite su jo sąlygomis, jei jų yra, ir pasirinkite savo handle tame serveryje. Taip pat galite paprašyti visos paskyros atsarginės kopijos."
      verify:
        title: "Patvirtinkite el. paštą"
        text: "Atsiunčiame jums kodą el. paštu. Perkėlimas prasideda, kai jį įvedate perkėlimo būsenos puslapyje."
      copy:
        title: "Nukopijuojame jūsų paskyrą"
        text: "Sukuriame jūsų paskyrą naujame serveryje ir nukopijuojame į ją viską; būsenos puslapyje matyti eiga. Tuo metu nieko neskelbkite, nieko nepažymėkite kaip patinkančio ir nieko nesekite: šie pakeitimai nebūtų perkelti."
      confirm:
        title: "Patvirtinkite perkėlimą"
        text: "Jūsų dabartinis serveris atsiunčia jums patvirtinimo kodą el. paštu. Įveskite jį būsenos puslapyje per valandą arba paprašykite naujo. Šis žingsnis nukreipia jūsų tapatybę į naująjį serverį."
      done:
        title: "Atlikta"
        text: "Jūsų paskyra naujame serveryje įjungiama, o senoji išjungiama. El. paštu atsiunčiame, kaip prisijungti, kartu su naujosios paskyros slaptažodžiu."
    know:
      title: "Naudinga žinoti"
      duration: "Dauguma perkėlimų trunka 20–30 minučių. Paskyros su daug nuotraukų ir vaizdo įrašų perkeliamos ilgiau."
      cancel: "Kol neįvedėte patvirtinimo kodo 5 žingsnyje, galite atšaukti perkėlimą, ir jūsų paskyra liks ten, kur yra."
      recovery: "Tapatybės nukreipimo į naująjį serverį čia atšaukti negalima. Duodame jums atkūrimo raktą, kuriuo tai galima atšaukti, todėl laikykite jį saugioje vietoje."
      old_account: "Senoji jūsų paskyra išjungiama, o ne ištrinama. Vėliau šiuo įrankiu galite grįžti į jos serverį."
      backup: "Jei paprašėte atsarginės kopijos, galite ją atsisiųsti per 24 valandas."
      deletion: "Jūsų perkėlimo įrašą ir viską, ką jam saugojome, ištriname praėjus 2 dienoms po perkėlimo pabaigos."
      sign_in: "Norėdami vėliau prisijungti, naudokite naująjį handle ir programėlėje kaip prieglobos teikėją pasirinkite naująjį serverį."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
