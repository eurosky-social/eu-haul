        target_password_placeholder: "Įveskite esamos paskyros slaptažodį"
        target_2fa_label: "Prisijungimo kodas (2FA)"
        target_2fa_help: "Patikrinkite el. paštą dėl dviejų veiksnių autentifikacijos kodo"
