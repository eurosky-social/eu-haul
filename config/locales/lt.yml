        new_handle_label: "Jūsų naujas handle"
        new_handle_placeholder: "vartotojas"
        domain_label: "Handle domenas"
        new_handle_help: "Pasirinkite naują handle (gali būti senas) paskirties serveryje."
        back: "Atgal"
        continue: "Tęsti"

      # Step 5: Review & Confirm
      step5:
        title: "Peržiūra ir patvirtinimas"
        subtitle: "Patikrinkite toliau pateiktus duomenis, prieš mums išsiunčiant patvirtinimo el. laišką."
