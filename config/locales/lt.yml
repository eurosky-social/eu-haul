        pds_consent_title: "Paskirties serverio teisinės sąlygos"
        back: "Atgal"
        continue: "Tęsti"

      # Step 4: New Handle
      step4:
        title: "Naujas handle"
        custom_domain_title: "Aptiktas pasirinktinis domenas"
        custom_domain_help: "Jūsų handle %{handle} yra pasirinktinis domenas. Galite toliau jį naudoti naujame serveryje."
