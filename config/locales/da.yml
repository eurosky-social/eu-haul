        no_usage_help: "Når migreringen starter, skal du lukke alle apps og browserfaner med din konto. Opslag, likes eller følgninger foretaget under migreringen bliver ikke overført. Du modtager en e-mail, når det er færdigt (~20-30 minutter)."
        acknowledge: "Jeg forstår, at jeg ikke bør bruge min konto under migreringen"
        back: "Tilbage"
        continue: "Fortsæt"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Forlad migreringen?"
        body: "Dine indtastninger går tabt. Der er endnu ikke ændret noget på din konto."
        stay: "Bliv her"
        leave: "Forlad"

