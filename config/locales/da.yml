        email_help: "Vi sender statusopdateringer om migreringen til denne e-mail"
        email_readonly_help: "E-mail hentet fra din konto"
        email_manual_help: "Vi kunne ikke hente din e-mail. Indtast den venligst manuelt."
        confirm_access: "Jeg har adgang til denne e-mailadresse og kan modtage en bekræftelseskode sendt til den."
        one_account_per_email: "Denne adresse bliver også e-mailadressen for din konto på den nye server, og en server tillader kun én konto pr. adresse. Hvis du allerede har oprettet dig dér med den, så slet den konto eller skift først dens e-mailadresse — ellers stopper migreringen."
        back: "Tilbage"
        continue: "Fortsæt"

      # Step 3: Destination Server
      step3:
        title: "Destinationsserver"
        subtitle: "Vælg hvor du vil migrere din konto hen."
        server_label: "Destinationsserver"
        server_placeholder: "Vælg en server…"
        server_custom: "Brugerdefineret server…"
        server_help: "Vælg hvor du vil migrere din konto hen"
        custom_url_label: "URL til brugerdefineret server"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Indtast den fulde URL til din brugerdefinerede server"
        invite_code_label: "Invitationskode"
        invite_code_placeholder: "Indtast din invitationskode"
        invite_code_help: "Denne server kræver en invitationskode"
        existing_account_title: "Eksisterende konto fundet"
        existing_account_help: "Din konto findes allerede på destinationsserveren. Bekræft venligst din adgangskode for at fortsætte med migreringen."
        target_password_label: "Din adgangskode på destinationsserveren"
        target_password_placeholder: "Indtast din adgangskode til den eksisterende konto"
        target_2fa_label: "Loginkode (2FA)"
        target_2fa_help: "Tjek din e-mail for tofaktorgodkendelseskoden"
        deactivated_notice: "Denne konto ser ud til at være deaktiveret"
        deactivated_reason: "(muligvis fra et tidligere migreringsforsøg)."
        deactivated_help: "Hvis du ikke husker din adgangskode, kan du prøve:"
        deactivated_reset: "Nulstil din adgangskode:"
        deactivated_contact: "Kontakt PDS-administratoren på %{email} for at fjerne denne inaktive konto og genstarte migreringen. Inkluder dit DID:"
        pds_consent_title: "Destinationsserverens juridiske vilkår"
        back: "Tilbage"
        continue: "Fortsæt"

      # Step 4: New Handle
      step4:
        title: "Nyt handle"
        custom_domain_title: "Brugerdefineret domæne registreret"
        custom_domain_help: "Dit handle %{handle} er et brugerdefineret domæne. Du kan fortsætte med at bruge det på den nye server."
        keep_handle: "Behold mit nuværende handle"
        new_handle_label: "Dit nye handle"
        new_handle_placeholder: "brugernavn"
        domain_label: "Handle-domæne"
        new_handle_help: "Vælg dit nye handle (kan være dit gamle) på destinationsserveren."
        back: "Tilbage"
        continue: "Fortsæt"

      # Step 5: Review & Confirm
      step5:
        title: "Gennemgang og bekræftelse"
        subtitle: "Tjek oplysningerne nedenfor, inden vi sender bekræftelsesmailen."
        current_handle: "Nuværende handle"
        email: "E-mail"
        destination_server: "Destinationsserver"
        new_handle: "Nyt handle"
        invite_code: "Invitationskode"
        create_backup: "Opret en sikkerhedskopi før migreringen"
        backup_help: "Downloader en komplet kopi af dine kontodata. Tilgængelig i 24 timer."
        confirm_email_html: "Når du klikker på <strong>Fortsæt</strong>, sender vi en bekræftelses-e-mail til <strong>%{email}</strong>. Migreringen starter først, når du bekræfter via den e-mail."
