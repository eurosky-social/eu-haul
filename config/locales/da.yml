        handle_placeholder: "dithandle.bsky.social"
        handle_help: "Indtast dit nuværende AT Protocol handle"
        password_label: "Kontoadgangskode"
        password_help: "Din nuværende kontoadgangskode (app-adgangskoder virker ikke)"
        two_factor_title: "Tofaktorgodkendelse"
        two_factor_help: "En loginkode er sendt til din e-mail. Indtast den nedenfor."
        two_factor_placeholder: "Indtast din loginkode"
        legal_consent_html: 'Jeg har læst og accepterer <a href="%{tos_url}" target="_blank" rel="noopener">Servicevilkårene</a> og anerkender <a href="%{privacy_url}" target="_blank" rel="noopener">Privatlivspolitikken</a>'
        continue: "Fortsæt"

      # Step 2: Email
      step2:
        title: "E-mailadresse"
        subtitle: "Vi sender statusopdateringer om migreringen til denne e-mail."
