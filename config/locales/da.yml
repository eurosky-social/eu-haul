  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Flyt din konto"
    title: "Flyt din konto til Europa"
    title_named: "Flyt din konto til %{name}"
    lead: "Tag dine opslag, følgninger og din identitet med til en europæisk server. Dit handle kan komme med, og dine følgere vil ikke mærke noget."
    start: "Start migrering"
    how_it_works: "Sådan fungerer det"
    steps_label: "Sådan foregår flytningen"
    steps:
      sign_in:
        label: "Log ind"
        text: "Log ind med dit nuværende handle og din adgangskode. Vi bruger den én gang og gemmer den aldrig."
      server:
        label: "Vælg en server"
        text: "Vælg Eurosky eller en anden server, og vælg dit nye handle."
      confirm:
        label: "Bekræft via e-mail"
        text: "Vi overfører dine data og beder dig bekræfte det sidste trin via e-mail. Det tager omkring 20–30 minutter."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Sådan fungerer det"
    title: "Sådan foregår flytningen af din konto"
    lead: "Din konto flytter til en anden server på cirka en halv time. Dine opslag, følgninger og din identitet kommer med, og de, der følger dig, bliver ved med at følge dig."
    before:
      title: "Før du starter"
      credentials: "Dit nuværende handle og adgangskoden til din konto. App-adgangskoder virker ikke. Hvis du bruger tofaktorgodkendelse, skal du også bruge den loginkode, vi beder om."
      email: "Adgang til din kontos e-mailadresse. Vi sender dig en kode dertil, og senere sender din nuværende server dig også en."
      time: "Cirka en halv time, hvor du ikke bruger din konto."
      invite: "Til nogle servere en invitationskode. Guiden fortæller dig, hvis den server, du vælger, kræver en."
    moves:
      title: "Det kommer med"
      everything: "Alt på din konto: dine opslag og svar, likes og reposts, følgninger, lister og blokeringer, din profil, dine billeder og videoer samt dine appindstillinger, såsom gemte feeds og skjulte ord. Din identitet flytter også med, så de, der følger dig, bliver ved med at følge dig."
      handle: "Dit handle kan komme med, hvis det ligger på dit eget domæne. Et handle på din nuværende servers domæne, såsom navn.bsky.social, bliver tilbage: du vælger et nyt på den nye server."
    steps:
      title: "Trin for trin"
      sign_in:
        title: "Log ind"
        text: "Log ind med dit nuværende handle og din adgangskode. Vi bruger dem til at starte flytningen og gemmer aldrig din adgangskode."
      choose:
        title: "Vælg, hvor du vil hen"
        text: "Vælg en server, accepter dens vilkår, hvis den har nogen, og vælg dit handle dér. Du kan også bede om en sikkerhedskopi af hele din konto."
      verify:
        title: "Bekræft din e-mail"
        text: "Vi sender dig en kode via e-mail. Flytningen starter, så snart du indtaster den på statussiden for din migrering."
      copy:
        title: "Vi kopierer din konto"
        text: "Vi opretter din konto på den nye server og kopierer alt dertil; statussiden viser, hvor langt vi er. Lad være med at lave opslag, like eller følge nogen imens: de ændringer kommer ikke med."
      confirm:
        title: "Bekræft flytningen"
        text: "Din nuværende server sender dig en bekræftelseskode via e-mail. Indtast den på statussiden inden for en time, eller anmod om en ny. Dette trin får din identitet til at pege på den nye server."
      done:
        title: "Færdig"
        text: "Din konto på den nye server bliver aktiveret, og den gamle bliver deaktiveret. Vi sender dig en e-mail om, hvordan du logger ind, sammen med adgangskoden til din nye konto."
    know:
      title: "Godt at vide"
      duration: "De fleste flytninger tager 20–30 minutter. Konti med mange billeder og videoer tager længere tid."
      cancel: "Indtil du indtaster bekræftelseskoden i trin 5, kan du annullere flytningen, og din konto bliver, hvor den er."
      recovery: "Når din identitet peger på den nye server, kan det ikke fortrydes her. Vi giver dig en gendannelsesnøgle, som kan fortryde det, så gem den et sikkert sted."
      old_account: "Din gamle konto bliver deaktiveret, ikke slettet. Du kan senere flytte tilbage til dens server med dette værktøj."
      backup: "Hvis du bad om en sikkerhedskopi, kan du downloade den i 24 timer."
      deletion: "Vi sletter registreringen af din flytning og alt, hvad vi har gemt i forbindelse med den, 2 dage efter, at flytningen er gennemført."
      sign_in: "Når du skal logge ind bagefter, bruger du dit nye handle og vælger din nye server som hostingudbyder i din app."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
