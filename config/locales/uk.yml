  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Перенесіть свій обліковий запис"
    title: "Перенесіть свій обліковий запис до Європи"
    title_named: "Перенесіть свій обліковий запис до %{name}"
    lead: "Перенесіть свої пости, підписки та ідентичність на європейський сервер. Ваш handle може залишитися з вами, а ваші підписники нічого не помітять."
    start: "Розпочати міграцію"
    how_it_works: "Як це працює"
    steps_label: "Як відбувається перенесення"
    steps:
      sign_in:
        label: "Вхід"
        text: "Увійдіть за допомогою поточного handle і пароля. Ми використовуємо їх лише один раз і ніколи не зберігаємо."
      server:
        label: "Вибір сервера"
        text: "Оберіть Eurosky або будь-який інший сервер і визначте свій новий handle."
      confirm:
        label: "Підтвердження електронною поштою"
        text: "Ми переносимо ваші дані й просимо підтвердити останній крок електронною поштою. Це займає приблизно 20–30 хвилин."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Як це працює"
    title: "Як відбувається перенесення облікового запису"
    lead: "Ваш обліковий запис переїжджає на інший сервер приблизно за пів години. Ваші пости, підписки та ідентичність переходять разом із вами, а люди, які на вас підписані, і далі залишаються вашими підписниками."
    before:
      title: "Перш ніж почати"
      credentials: "Ваш поточний handle і пароль облікового запису. Паролі застосунків не підходять. Якщо ви використовуєте двофакторну автентифікацію, вам також знадобиться код входу, який ми попросимо."
      email: "Доступ до адреси електронної пошти вашого облікового запису. Ми надішлемо туди код, а пізніше ваш поточний сервер теж надішле вам код."
      time: "Приблизно пів години, протягом яких ви не користуєтеся обліковим записом."
      invite: "Для деяких серверів — код запрошення. Майстер підкаже, чи потрібен він вибраному серверу."
    moves:
      title: "Що переноситься разом із вами"
      everything: "Усе, що є у вашому обліковому записі: ваші пости й відповіді, вподобання й репости, підписки, списки й блокування, ваш профіль, зображення й відео, а також налаштування застосунку, як-от збережені стрічки та приховані слова. Ваша ідентичність теж переноситься, тож люди, які на вас підписані, і далі залишаються вашими підписниками."
      handle: "Ваш handle може перейти разом із вами, якщо він на вашому власному домені. Handle на домені вашого поточного сервера, наприклад name.bsky.social, залишається на місці: на новому сервері ви оберете новий."
    steps:
      title: "Крок за кроком"
      sign_in:
        title: "Вхід"
        text: "Увійдіть за допомогою поточного handle і пароля. Ми використовуємо їх, щоб розпочати перенесення, і ніколи не зберігаємо ваш пароль."
      choose:
        title: "Вибір сервера"
        text: "Оберіть сервер, прийміть його умови, якщо вони є, і виберіть там свій handle. Ви також можете замовити резервну копію всього облікового запису."
      verify:
        title: "Підтвердження електронної пошти"
        text: "Ми надішлемо вам код електронною поштою. Перенесення почнеться, щойно ви введете його на сторінці стану міграції."
      copy:
        title: "Ми копіюємо ваш обліковий запис"
        text: "Ми створюємо ваш обліковий запис на новому сервері й копіюємо туди все; сторінка стану показує перебіг. Тим часом не публікуйте, не вподобайте й ні на кого не підписуйтеся: ці зміни не перенесуться."
      confirm:
        title: "Підтвердження перенесення"
        text: "Ваш поточний сервер надішле вам код підтвердження електронною поштою. Введіть його на сторінці стану протягом години або запитайте новий. Цей крок спрямовує вашу ідентичність на новий сервер."
      done:
        title: "Готово"
        text: "Ваш обліковий запис на новому сервері вмикається, а старий деактивується. Ми надішлемо вам електронною поштою інструкції для входу разом із паролем нового облікового запису."
    know:
      title: "Варто знати"
      duration: "Більшість перенесень триває 20–30 хвилин. Облікові записи з великою кількістю зображень і відео переносяться довше."
      cancel: "Доки ви не введете код підтвердження на кроці 5, перенесення можна скасувати, і ваш обліковий запис залишиться там, де він є."
      recovery: "Спрямування ідентичності на новий сервер тут скасувати не можна. Ми даємо вам ключ відновлення, яким це можна скасувати, тож зберігайте його в надійному місці."
      old_account: "Ваш старий обліковий запис деактивується, а не видаляється. Пізніше ви можете повернутися на його сервер за допомогою цього інструмента."
      backup: "Якщо ви замовили резервну копію, її можна завантажити протягом 24 годин."
      deletion: "Запис про ваше перенесення та все, що ми для нього зберігали, ми видаляємо через 2 дні після завершення перенесення."
      sign_in: "Щоб потім увійти, використовуйте новий handle і виберіть у своєму застосунку новий сервер як провайдера хостингу."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Розпочати міграцію облікового запису"
      errors_heading: "Будь ласка, виправте наступні помилки:"
      card_label: "Розпочати міграцію облікового запису"
      step_of: "Крок %{current} з %{total}"
      steps_label: "Кроки міграції"

      # Progress bar labels
      progress:
        account: "Обліковий запис"
        email: "Електронна пошта"
        destination: "Призначення"
        handle: "Handle"
        review: "Перегляд"

      # Step 1: Account Credentials
      step1:
        title: "Облікові дані"
        subtitle: "Увійдіть в обліковий запис, який хочете перенести. Ми ніколи не зберігаємо ваш пароль."
        handle_label: "Ваш handle"
        handle_placeholder: "vashhandle.bsky.social"
        handle_help: "Введіть ваш поточний handle AT Protocol"
        password_label: "Пароль облікового запису"
        password_help: "Ваш поточний пароль облікового запису (паролі додатків не працюватимуть)"
        two_factor_title: "Двофакторна автентифікація"
        two_factor_help: "Код входу було надіслано на вашу електронну пошту. Введіть його нижче."
        two_factor_placeholder: "Введіть код входу"
        legal_consent_html: 'Я прочитав/ла та погоджуюся з <a href="%{tos_url}" target="_blank" rel="noopener">Умовами використання</a> та підтверджую ознайомлення з <a href="%{privacy_url}" target="_blank" rel="noopener">Політикою конфіденційності</a>'
        continue: "Продовжити"

      # Step 2: Email
      step2:
        title: "Адреса електронної пошти"
        subtitle: "Ми надсилатимемо оновлення стану міграції на цю електронну пошту."
        email_label: "Адреса електронної пошти"
        email_help: "Ми надсилатимемо оновлення стану міграції на цю електронну пошту"
        email_readonly_help: "Електронну пошту отримано з вашого облікового запису"
        email_manual_help: "Нам не вдалося отримати вашу електронну пошту. Будь ласка, введіть її вручну."
        confirm_access: "Я маю доступ до цієї електронної адреси та можу отримати код підтвердження, надісланий на неї."
        one_account_per_email: "Ця адреса також стане адресою електронної пошти вашого облікового запису на новому сервері, а сервер дозволяє лише один обліковий запис на адресу. Якщо ви вже зареєструвалися там з нею, спершу видаліть той обліковий запис або змініть його адресу — інакше міграція зупиниться."
        back: "Назад"
        continue: "Продовжити"

      # Step 3: Destination Server
      step3:
        title: "Сервер призначення"
        subtitle: "Оберіть, куди ви хочете перенести свій обліковий запис."
        server_label: "Сервер призначення"
        server_placeholder: "Оберіть сервер…"
        server_custom: "Власний сервер…"
        server_help: "Оберіть, куди ви хочете перенести свій обліковий запис"
        custom_url_label: "URL власного сервера"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Введіть повну URL-адресу вашого власного сервера"
        invite_code_label: "Код запрошення"
        invite_code_placeholder: "Введіть код запрошення"
        invite_code_help: "Цей сервер вимагає код запрошення"
        existing_account_title: "Знайдено існуючий обліковий запис"
        existing_account_help: "Ваш обліковий запис вже існує на сервері призначення. Будь ласка, підтвердьте свій пароль для продовження міграції."
        target_password_label: "Ваш пароль на сервері призначення"
        target_password_placeholder: "Введіть пароль для існуючого облікового запису"
        target_2fa_label: "Код входу (2FA)"
        target_2fa_help: "Перевірте електронну пошту на код двофакторної автентифікації"
        deactivated_notice: "Цей обліковий запис, схоже, деактивований"
        deactivated_reason: "(ймовірно, через попередню спробу міграції)."
        deactivated_help: "Якщо ви не пам'ятаєте пароль, ви можете спробувати:"
        deactivated_reset: "Скинути пароль:"
        deactivated_contact: "Зв'яжіться з адміністратором PDS за адресою %{email}, щоб видалити цей неактивний обліковий запис та перезапустити міграцію. Вкажіть свій DID:"
        pds_consent_title: "Юридичні умови сервера призначення"
        back: "Назад"
        continue: "Продовжити"

      # Step 4: New Handle
      step4:
        title: "Новий handle"
        custom_domain_title: "Виявлено власний домен"
        custom_domain_help: "Ваш handle %{handle} є власним доменом. Ви можете продовжувати використовувати його на новому сервері."
        keep_handle: "Залишити поточний handle"
        new_handle_label: "Ваш новий handle"
        new_handle_placeholder: "користувач"
        domain_label: "Домен handle"
        new_handle_help: "Оберіть новий handle (може бути старий) на сервері призначення."
        back: "Назад"
        continue: "Продовжити"

      # Step 5: Review & Confirm
      step5:
        title: "Перевірка та підтвердження"
        subtitle: "Перевірте дані нижче, перш ніж ми надішлемо лист із підтвердженням."
        current_handle: "Поточний handle"
        email: "Електронна пошта"
        destination_server: "Сервер призначення"
        new_handle: "Новий handle"
        invite_code: "Код запрошення"
        create_backup: "Створити резервну копію перед міграцією"
        backup_help: "Завантажує повну копію даних вашого облікового запису. Доступна протягом 24 годин."
        confirm_email_html: "Коли ви натиснете <strong>Продовжити</strong>, ми надішлемо лист підтвердження на <strong>%{email}</strong>. Міграція розпочнеться лише після підтвердження через цей лист."
        no_usage_title: "Не використовуйте обліковий запис під час міграції"
        no_usage_help: "Після початку міграції закрийте всі додатки та вкладки браузера з вашим обліковим записом. Будь-які пости, вподобання чи підписки, зроблені під час міграції, не будуть перенесені. Ви отримаєте листа після завершення (~20-30 хвилин)."
        acknowledge: "Я розумію, що не повинен/повинна використовувати свій обліковий запис під час міграції"
        back: "Назад"
        continue: "Продовжити"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Вийти з міграції?"
        body: "Введені дані буде втрачено. У вашому обліковому записі ще нічого не змінено."
        stay: "Залишитися"
        leave: "Вийти"

