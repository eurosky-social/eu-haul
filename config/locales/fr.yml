  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Transférer votre compte"
    title: "Transférez votre compte en Europe"
    title_named: "Transférez votre compte vers %{name}"
    lead: "Emportez vos publications, vos abonnements et votre identité sur un serveur européen. Votre handle peut vous suivre, et vos abonnés ne remarqueront rien."
    start: "Démarrer la migration"
    how_it_works: "Comment ça marche"
    steps_label: "Les étapes du transfert"
    steps:
      sign_in:
        label: "Se connecter"
        text: "Connectez-vous avec votre handle et votre mot de passe actuels. Nous ne l'utilisons qu'une fois et ne le conservons jamais."
      server:
        label: "Choisir un serveur"
        text: "Choisissez Eurosky ou tout autre serveur, puis votre nouveau handle."
      confirm:
        label: "Confirmer par e-mail"
        text: "Nous transférons vos données et vous demandons de confirmer la dernière étape par e-mail. Comptez environ 20 à 30 minutes."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Comment ça marche"
    title: "Comment fonctionne le transfert de votre compte"
    lead: "Votre compte passe sur un autre serveur en une demi-heure environ. Vos publications, vos abonnements et votre identité vous suivent, et les personnes qui vous suivent continuent de vous suivre."
    before:
      title: "Avant de commencer"
      credentials: "Votre handle actuel et le mot de passe de votre compte. Les mots de passe d'application ne fonctionnent pas. Si vous utilisez l'authentification à deux facteurs, il vous faudra aussi le code de connexion que nous vous demandons."
      email: "Un accès à l'adresse e-mail de votre compte. Nous vous y envoyons un code, puis votre serveur actuel vous en envoie un aussi."
      time: "Environ une demi-heure pendant laquelle vous n'utilisez pas votre compte."
      invite: "Pour certains serveurs, un code d'invitation. L'assistant vous indique si le serveur choisi en exige un."
    moves:
      title: "Ce qui vous suit"
      everything: "Tout le contenu de votre compte : vos publications et réponses, vos j'aime et republications, vos abonnements, listes et blocages, votre profil, vos images et vidéos, ainsi que les réglages de vos applications, comme les fils enregistrés et les mots masqués. Votre identité vous suit aussi, donc les personnes qui vous suivent continuent de vous suivre."
      handle: "Votre handle peut vous suivre s'il est sur votre propre domaine. Un handle sur le domaine de votre serveur actuel, comme nom.bsky.social, reste sur place : vous en choisissez un nouveau sur le nouveau serveur."
    steps:
      title: "Étape par étape"
      sign_in:
        title: "Connectez-vous"
        text: "Connectez-vous avec votre handle et votre mot de passe actuels. Nous les utilisons pour lancer le transfert et ne conservons jamais votre mot de passe."
      choose:
        title: "Choisissez votre destination"
        text: "Choisissez un serveur, acceptez ses conditions s'il en a, et choisissez votre handle sur ce serveur. Vous pouvez aussi demander une sauvegarde de tout votre compte."
      verify:
        title: "Confirmez votre e-mail"
        text: "Nous vous envoyons un code par e-mail. Le transfert commence dès que vous le saisissez sur la page d'état de votre migration."
      copy:
        title: "Nous copions votre compte"
        text: "Nous créons votre compte sur le nouveau serveur et y copions tout ; la page d'état affiche la progression. Entre-temps, ne publiez pas, n'aimez rien et ne suivez personne : ces changements ne seraient pas transférés."
      confirm:
        title: "Confirmez le transfert"
        text: "Votre serveur actuel vous envoie un code de confirmation par e-mail. Saisissez-le sur la page d'état dans l'heure, ou demandez-en un nouveau. Cette étape fait pointer votre identité vers le nouveau serveur."
      done:
        title: "Terminé"
        text: "Votre compte sur le nouveau serveur est activé et l'ancien est désactivé. Nous vous envoyons par e-mail les instructions de connexion, avec le mot de passe de votre nouveau compte."
    know:
      title: "Bon à savoir"
      duration: "La plupart des transferts prennent 20 à 30 minutes. Les comptes avec beaucoup d'images et de vidéos prennent plus de temps."
      cancel: "Tant que vous n'avez pas saisi le code de confirmation à l'étape 5, vous pouvez annuler le transfert, et votre compte reste où il est."
      recovery: "Le fait de pointer votre identité vers le nouveau serveur ne peut pas être annulé ici. Nous vous donnons une clé de récupération qui permet de l'annuler : conservez-la en lieu sûr."
      old_account: "Votre ancien compte est désactivé, pas supprimé. Vous pourrez revenir plus tard sur son serveur avec cet outil."
      backup: "Si vous avez demandé une sauvegarde, vous pouvez la télécharger pendant 24 heures."
      deletion: "Nous supprimons l'enregistrement de votre transfert, et tout ce que nous avons conservé pour celui-ci, 2 jours après la fin du transfert."
      sign_in: "Pour vous connecter ensuite, utilisez votre nouveau handle et choisissez votre nouveau serveur comme fournisseur d'hébergement dans votre application."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
