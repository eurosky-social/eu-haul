      page_title: "Démarrer la migration de compte"
      errors_heading: "Veuillez corriger les erreurs suivantes :"
      card_label: "Démarrer la migration de compte"
      step_of: "Étape %{current} sur %{total}"
      steps_label: "Étapes de la migration"

      # Progress bar labels
      progress:
        account: "Compte"
        email: "E-mail"
        destination: "Destination"
        handle: "Handle"
        review: "Vérification"

      # Step 1: Account Credentials
      step1:
        title: "Identifiants du compte"
        subtitle: "Connectez-vous au compte que vous souhaitez transférer. Nous ne conservons jamais votre mot de passe."
        handle_label: "Votre handle"
        handle_placeholder: "votrehandle.bsky.social"
        handle_help: "Saisissez votre handle AT Protocol actuel"
        password_label: "Mot de passe du compte"
        password_help: "Votre mot de passe de compte actuel (les mots de passe d'application ne fonctionneront pas)"
        two_factor_title: "Authentification à deux facteurs"
        two_factor_help: "Un code de connexion a été envoyé à votre adresse e-mail. Saisissez-le ci-dessous."
        two_factor_placeholder: "Saisissez votre code de connexion"
        legal_consent_html: "J'ai lu et j'accepte les <a href=\"%{tos_url}\" target=\"_blank\" rel=\"noopener\">Conditions d'utilisation</a> et je reconnais la <a href=\"%{privacy_url}\" target=\"_blank\" rel=\"noopener\">Politique de confidentialité</a>"
        continue: "Continuer"

      # Step 2: Email
      step2:
        title: "Adresse e-mail"
        subtitle: "Nous enverrons les mises à jour de l'état de la migration à cette adresse e-mail."
        email_label: "Adresse e-mail"
        email_help: "Nous enverrons les mises à jour de l'état de la migration à cette adresse e-mail"
        email_readonly_help: "Adresse e-mail récupérée depuis votre compte"
        email_manual_help: "Nous n'avons pas pu récupérer votre adresse e-mail. Veuillez la saisir manuellement."
        confirm_access: "J'ai accès à cette adresse e-mail et je peux récupérer un code de confirmation qui y serait envoyé."
        back: "Retour"
        continue: "Continuer"

      # Step 3: Destination Server
      step3:
        title: "Serveur de destination"
        subtitle: "Choisissez où vous souhaitez migrer votre compte."
        server_label: "Serveur de destination"
        server_placeholder: "Sélectionnez un serveur…"
        server_custom: "Serveur personnalisé…"
        server_help: "Choisissez où vous souhaitez migrer votre compte"
        custom_url_label: "URL du serveur personnalisé"
        custom_url_placeholder: "https://pds.exemple.com"
        custom_url_help: "Saisissez l'URL complète de votre serveur personnalisé"
        invite_code_label: "Code d'invitation"
        invite_code_placeholder: "Saisissez votre code d'invitation"
        invite_code_help: "Ce serveur nécessite un code d'invitation"
        existing_account_title: "Compte existant trouvé"
        existing_account_help: "Votre compte existe déjà sur le serveur de destination. Veuillez vérifier votre mot de passe pour continuer la migration."
        target_password_label: "Votre mot de passe sur le serveur de destination"
        target_password_placeholder: "Saisissez votre mot de passe pour le compte existant"
        target_2fa_label: "Code de connexion (2FA)"
        target_2fa_help: "Consultez votre e-mail pour obtenir le code d'authentification à deux facteurs"
        deactivated_notice: "Ce compte semble être désactivé"
        deactivated_reason: "(possiblement suite à une tentative de migration précédente)."
        deactivated_help: "Si vous ne vous souvenez pas de votre mot de passe, vous pouvez essayer :"
        deactivated_reset: "Réinitialiser votre mot de passe :"
        deactivated_contact: "Contacter l'administrateur du PDS à l'adresse %{email} pour supprimer ce compte inactif et relancer la migration. Incluez votre DID :"
        pds_consent_title: "Conditions légales du serveur de destination"
        back: "Retour"
        continue: "Continuer"

      # Step 4: New Handle
      step4:
        title: "Nouveau handle"
        custom_domain_title: "Domaine personnalisé détecté"
        custom_domain_help: "Votre handle %{handle} est un domaine personnalisé. Vous pouvez continuer à l'utiliser sur le nouveau serveur."
        keep_handle: "Conserver mon handle actuel"
        new_handle_label: "Votre nouveau handle"
        new_handle_placeholder: "nomdutilisateur"
        domain_label: "Domaine du handle"
        new_handle_help: "Choisissez votre nouveau handle (peut être l'ancien) sur le serveur de destination."
        back: "Retour"
        continue: "Continuer"

      # Step 5: Review & Confirm
      step5:
        title: "Vérification et confirmation"
        subtitle: "Vérifiez les informations ci-dessous avant que nous envoyions l'e-mail de confirmation."
        current_handle: "Handle actuel"
        email: "E-mail"
        destination_server: "Serveur de destination"
        new_handle: "Nouveau handle"
        invite_code: "Code d'invitation"
        create_backup: "Créer une sauvegarde avant la migration"
        backup_help: "Télécharge une copie complète des données de votre compte. Disponible pendant 24 heures."
        confirm_email_html: "En cliquant sur <strong>Continuer</strong>, nous enverrons un e-mail de confirmation à <strong>%{email}</strong>. La migration ne commencera qu'après votre confirmation par e-mail."
        no_usage_title: "N'utilisez pas votre compte pendant la migration"
        no_usage_help: "Une fois la migration lancée, fermez toutes les applications et onglets de navigateur liés à votre compte. Les publications, mentions j'aime ou abonnements effectués pendant la migration ne seront pas transférés. Vous recevrez un e-mail une fois la migration terminée (~20-30 minutes)."
        acknowledge: "Je comprends que je ne dois pas utiliser mon compte pendant la migration"
        back: "Retour"
        continue: "Continuer"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Quitter la migration ?"
        body: "Vos saisies seront perdues. Rien n'a encore été modifié sur votre compte."
        stay: "Rester ici"
        leave: "Quitter"

