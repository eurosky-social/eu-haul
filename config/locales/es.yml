  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Traslade su cuenta"
    title: "Traslade su cuenta a Europa"
    title_named: "Traslade su cuenta a %{name}"
    lead: "Lleve sus publicaciones, seguimientos e identidad a un servidor europeo. Su handle puede acompañarle y sus seguidores no notarán nada."
    start: "Iniciar migración"
    how_it_works: "Cómo funciona"
    steps_label: "Cómo funciona el traslado"
    steps:
      sign_in:
        label: "Iniciar sesión"
        text: "Inicie sesión con su handle y contraseña actuales. La usamos una sola vez y nunca la guardamos."
      server:
        label: "Elegir un servidor"
        text: "Elija Eurosky o cualquier otro servidor, y elija su nuevo handle."
      confirm:
        label: "Confirmar por correo electrónico"
        text: "Transferimos sus datos y le pedimos que confirme el último paso por correo electrónico. Tarda unos 20–30 minutos."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Cómo funciona"
    title: "Cómo funciona el traslado de su cuenta"
    lead: "Su cuenta se traslada a otro servidor en aproximadamente media hora. Sus publicaciones, sus seguimientos y su identidad se van con usted, y las personas que le siguen continúan siguiéndole."
    before:
      title: "Antes de empezar"
      credentials: "Su handle actual y la contraseña de su cuenta. Las contraseñas de aplicación no sirven. Si usa la autenticación de dos factores, también necesitará el código de inicio de sesión que le pediremos."
      email: "Acceso a la dirección de correo electrónico de su cuenta. Allí le enviamos un código, y más adelante su servidor actual también le enviará uno."
      time: "Aproximadamente media hora durante la cual no use su cuenta."
      invite: "Para algunos servidores, un código de invitación. El asistente le indica si el servidor que elija lo necesita."
    moves:
      title: "Qué se traslada con usted"
      everything: "Todo lo que hay en su cuenta: sus publicaciones y respuestas, los me gusta y las republicaciones, los seguimientos, las listas y los bloqueos, su perfil, sus imágenes y vídeos, y la configuración de sus aplicaciones, como los feeds guardados y las palabras silenciadas. Su identidad también se traslada, así que las personas que le siguen continúan siguiéndole."
      handle: "Su handle puede acompañarle si está en su propio dominio. Un handle en el dominio de su servidor actual, como nombre.bsky.social, se queda atrás: elegirá uno nuevo en el nuevo servidor."
    steps:
      title: "Paso a paso"
      sign_in:
        title: "Iniciar sesión"
        text: "Inicie sesión con su handle y contraseña actuales. Los usamos para iniciar el traslado y nunca guardamos su contraseña."
      choose:
        title: "Elegir el destino"
        text: "Elija un servidor, acepte sus condiciones si las tiene y elija allí su handle. También puede solicitar una copia de seguridad de toda su cuenta."
      verify:
        title: "Confirmar su correo electrónico"
        text: "Le enviamos un código por correo electrónico. El traslado comienza en cuanto lo introduzca en la página de estado de su migración."
      copy:
        title: "Copiamos su cuenta"
        text: "Creamos su cuenta en el nuevo servidor y copiamos todo en ella; la página de estado muestra el progreso. Mientras tanto, no publique, no dé me gusta ni siga a nadie: esos cambios no se trasladarían."
      confirm:
        title: "Confirmar el traslado"
        text: "Su servidor actual le envía un código de confirmación por correo electrónico. Introdúzcalo en la página de estado en el plazo de una hora, o solicite uno nuevo. Este paso hace que su identidad apunte al nuevo servidor."
      done:
        title: "Listo"
        text: "Su cuenta en el nuevo servidor se activa y la antigua se desactiva. Le enviamos por correo electrónico cómo iniciar sesión, junto con la contraseña de su nueva cuenta."
    know:
      title: "Conviene saber"
      duration: "La mayoría de los traslados tardan 20–30 minutos. Las cuentas con muchas imágenes y vídeos tardan más."
      cancel: "Hasta que introduzca el código de confirmación en el paso 5, puede cancelar el traslado y su cuenta se queda donde está."
      recovery: "Que su identidad apunte al nuevo servidor no se puede deshacer desde aquí. Le damos una clave de recuperación que sí puede deshacerlo, así que guárdela en un lugar seguro."
      old_account: "Su antigua cuenta se desactiva, no se elimina. Más adelante puede volver a su servidor con esta herramienta."
      backup: "Si solicitó una copia de seguridad, puede descargarla durante 24 horas."
      deletion: "Eliminamos el registro de su traslado, y todo lo que guardamos para él, 2 días después de que se complete."
      sign_in: "Para iniciar sesión después, use su nuevo handle y elija su nuevo servidor como proveedor de alojamiento en su aplicación."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Iniciar migración de cuenta"
      errors_heading: "Por favor, corrija los siguientes errores:"
      card_label: "Iniciar migración de cuenta"
      step_of: "Paso %{current} de %{total}"
      steps_label: "Pasos de la migración"

      # Progress bar labels
      progress:
        account: "Cuenta"
        email: "Correo electrónico"
        destination: "Destino"
        handle: "Handle"
        review: "Revisión"

      # Step 1: Account Credentials
      step1:
        title: "Credenciales de la cuenta"
        subtitle: "Inicie sesión en la cuenta que desea trasladar. Nunca guardamos su contraseña."
        handle_label: "Su handle"
        handle_placeholder: "suhandle.bsky.social"
        handle_help: "Introduzca su handle actual de AT Protocol"
        password_label: "Contraseña de la cuenta"
        password_help: "Tu contraseña actual de cuenta (las contraseñas de aplicación no funcionarán)"
        two_factor_title: "Autenticación de dos factores"
        two_factor_help: "Se ha enviado un código de inicio de sesión a su correo electrónico. Introdúzcalo a continuación."
        two_factor_placeholder: "Introduzca su código de inicio de sesión"
        legal_consent_html: 'He leído y acepto los <a href="%{tos_url}" target="_blank" rel="noopener">Términos de Servicio</a> y reconozco la <a href="%{privacy_url}" target="_blank" rel="noopener">Política de Privacidad</a>'
        continue: "Continuar"

      # Step 2: Email
      step2:
        title: "Dirección de correo electrónico"
        subtitle: "Le enviaremos actualizaciones del estado de la migración a este correo electrónico."
        email_label: "Dirección de correo electrónico"
        email_help: "Le enviaremos actualizaciones del estado de la migración a este correo electrónico"
        email_readonly_help: "Correo electrónico obtenido de su cuenta"
        email_manual_help: "No pudimos obtener su correo electrónico. Por favor, introdúzcalo manualmente."
        confirm_access: "Tengo acceso a esta dirección de correo electrónico y puedo recuperar un código de confirmación enviado a ella."
        one_account_per_email: "Esta dirección también será el correo electrónico de su cuenta en el nuevo servidor, y un servidor solo permite una cuenta por dirección. Si ya se registró allí con ella, elimine esa cuenta o cambie primero su correo electrónico — de lo contrario, la migración se detendrá."
        back: "Atrás"
        continue: "Continuar"

      # Step 3: Destination Server
      step3:
        title: "Servidor de destino"
        subtitle: "Elija a dónde desea migrar su cuenta."
        server_label: "Servidor de destino"
        server_placeholder: "Seleccione un servidor…"
        server_custom: "Servidor personalizado…"
        server_help: "Elija a dónde desea migrar su cuenta"
        custom_url_label: "URL del servidor personalizado"
        custom_url_placeholder: "https://pds.ejemplo.com"
        custom_url_help: "Introduzca la URL completa de su servidor personalizado"
        invite_code_label: "Código de invitación"
        invite_code_placeholder: "Introduzca su código de invitación"
        invite_code_help: "Este servidor requiere un código de invitación"
        existing_account_title: "Cuenta existente encontrada"
        existing_account_help: "Su cuenta ya existe en el servidor de destino. Por favor, verifique su contraseña para continuar con la migración."
        target_password_label: "Su contraseña en el servidor de destino"
        target_password_placeholder: "Introduzca su contraseña para la cuenta existente"
        target_2fa_label: "Código de inicio de sesión (2FA)"
        target_2fa_help: "Revise su correo electrónico para obtener el código de autenticación de dos factores"
        deactivated_notice: "Esta cuenta parece estar desactivada"
        deactivated_reason: "(posiblemente por un intento de migración anterior)."
        deactivated_help: "Si no recuerda su contraseña, puede intentar:"
        deactivated_reset: "Restablecer su contraseña:"
        deactivated_contact: "Contactar al administrador del PDS en %{email} para eliminar esta cuenta inactiva y reiniciar la migración. Incluya su DID:"
        pds_consent_title: "Términos legales del servidor de destino"
        back: "Atrás"
        continue: "Continuar"

      # Step 4: New Handle
      step4:
        title: "Nuevo handle"
        custom_domain_title: "Dominio personalizado detectado"
        custom_domain_help: "Su handle %{handle} es un dominio personalizado. Puede seguir usándolo en el nuevo servidor."
        keep_handle: "Mantener mi handle actual"
        new_handle_label: "Su nuevo handle"
        new_handle_placeholder: "nombreusuario"
        domain_label: "Dominio del handle"
        new_handle_help: "Elija su nuevo handle (puede ser el anterior) en el servidor de destino."
        back: "Atrás"
        continue: "Continuar"

      # Step 5: Review & Confirm
      step5:
        title: "Revisión y confirmación"
        subtitle: "Revise los datos a continuación antes de que le enviemos el correo electrónico de confirmación."
        current_handle: "Handle actual"
        email: "Correo electrónico"
        destination_server: "Servidor de destino"
        new_handle: "Nuevo handle"
        invite_code: "Código de invitación"
        create_backup: "Crear una copia de seguridad antes de la migración"
        backup_help: "Descarga una copia completa de los datos de su cuenta. Disponible durante 24 horas."
        confirm_email_html: "Al hacer clic en <strong>Continuar</strong>, enviaremos un correo electrónico de confirmación a <strong>%{email}</strong>. La migración solo comenzará una vez que confirme a través de ese correo electrónico."
        no_usage_title: "No utilice su cuenta durante la migración"
        no_usage_help: "Una vez iniciada la migración, cierre todas las aplicaciones y pestañas del navegador con su cuenta. Las publicaciones, los me gusta o los seguimientos realizados durante la migración no se transferirán. Recibirá un correo electrónico cuando se complete (~20-30 minutos)."
        acknowledge: "Entiendo que no debo utilizar mi cuenta durante la migración"
        back: "Atrás"
        continue: "Continuar"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "¿Salir de la migración?"
        body: "Se perderán los datos introducidos. Todavía no se ha cambiado nada en su cuenta."
        stay: "Quedarme aquí"
        leave: "Salir"

