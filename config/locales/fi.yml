  # ──────────────────────────────────────────
  landing:
    page_title: "Siirrä tilisi"
    title: "Siirrä tilisi Eurooppaan"
    title_named: "Siirrä tilisi palvelimelle %{name}"
    lead: "Tuo julkaisusi, seurattavasi ja identiteettisi eurooppalaiselle palvelimelle. Handlesi voi tulla mukana, eivätkä seuraajasi huomaa mitään."
    start: "Aloita siirto"
    how_it_works: "Näin se toimii"
    steps_label: "Näin siirto etenee"
    steps:
      sign_in:
        label: "Kirjaudu sisään"
        text: "Kirjaudu sisään nykyisellä handlellasi ja salasanallasi. Käytämme salasanaa vain kerran emmekä koskaan tallenna sitä."
      server:
        label: "Valitse palvelin"
        text: "Valitse Eurosky tai mikä tahansa muu palvelin ja valitse uusi handlesi."
      confirm:
        label: "Vahvista sähköpostilla"
        text: "Siirrämme tietosi ja pyydämme sinua vahvistamaan viimeisen vaiheen sähköpostilla. Kestää noin 20–30 minuuttia."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Näin se toimii"
    title: "Näin tilin siirto toimii"
    lead: "Tilisi siirtyy toiselle palvelimelle noin puolessa tunnissa. Julkaisusi, seurattavasi ja identiteettisi tulevat mukanasi, ja seuraajasi seuraavat sinua edelleen."
    before:
      title: "Ennen kuin aloitat"
      credentials: "Nykyinen handlesi ja tilisi salasana. Sovellussalasanat eivät toimi. Jos käytät kaksivaiheista tunnistautumista, tarvitset myös kirjautumiskoodin, jota pyydämme."
      email: "Pääsy tilisi sähköpostiosoitteeseen. Lähetämme sinne koodin, ja myöhemmin myös nykyinen palvelimesi lähettää sinulle sellaisen."
      time: "Noin puoli tuntia, jonka aikana et käytä tiliäsi."
      invite: "Joillekin palvelimille kutsukoodi. Ohjattu toiminto kertoo, jos valitsemasi palvelin vaatii sellaisen."
    moves:
      title: "Mitä siirtyy mukanasi"
      everything: "Kaikki tililläsi oleva: julkaisusi ja vastauksesi, tykkäyksesi ja uudelleenjulkaisusi, seurattavasi, listasi ja estosi, profiilisi, kuvasi ja videosi sekä sovellusasetuksesi, kuten tallennetut syötteet ja mykistetyt sanat. Myös identiteettisi siirtyy, joten seuraajasi seuraavat sinua edelleen."
      handle: "Handlesi voi siirtyä mukanasi, jos se on omalla verkkotunnuksellasi. Nykyisen palvelimesi verkkotunnuksella oleva handle, kuten name.bsky.social, ei siirry mukana: valitset uudella palvelimella uuden."
    steps:
      title: "Vaihe vaiheelta"
      sign_in:
        title: "Kirjaudu sisään"
        text: "Kirjaudu sisään nykyisellä handlellasi ja salasanallasi. Käytämme niitä siirron aloittamiseen emmekä koskaan tallenna salasanaasi."
      choose:
        title: "Valitse, minne siirryt"
        text: "Valitse palvelin, hyväksy sen ehdot, jos sillä on sellaiset, ja valitse handlesi siellä. Voit myös pyytää varmuuskopion koko tilistäsi."
      verify:
        title: "Vahvista sähköpostisi"
        text: "Lähetämme sinulle koodin sähköpostitse. Siirto alkaa, kun syötät sen siirtosi tilasivulla."
      copy:
        title: "Kopioimme tilisi"
        text: "Luomme tilisi uudelle palvelimelle ja kopioimme sinne kaiken; tilasivulla näet edistymisen. Älä julkaise, tykkää tai seuraa sillä välin: nämä muutokset eivät siirtyisi mukana."
      confirm:
        title: "Vahvista siirto"
        text: "Nykyinen palvelimesi lähettää sinulle vahvistuskoodin sähköpostitse. Syötä se tilasivulla tunnin kuluessa tai pyydä uusi. Tämä vaihe ohjaa identiteettisi uudelle palvelimelle."
      done:
        title: "Valmis"
        text: "Tilisi otetaan käyttöön uudella palvelimella ja vanha tili deaktivoidaan. Lähetämme sinulle sähköpostitse kirjautumisohjeet ja uuden tilisi salasanan."
    know:
      title: "Hyvä tietää"
      duration: "Useimmat siirrot kestävät 20–30 minuuttia. Tilit, joilla on paljon kuvia ja videoita, vievät kauemmin."
      cancel: "Siihen asti, kunnes syötät vahvistuskoodin vaiheessa 5, voit peruuttaa siirron, ja tilisi pysyy siellä, missä se on nyt."
      recovery: "Identiteettisi ohjaamista uudelle palvelimelle ei voi perua täällä. Annamme sinulle palautusavaimen, jolla sen voi perua, joten säilytä se turvallisessa paikassa."
      old_account: "Vanha tilisi deaktivoidaan, ei poisteta. Voit myöhemmin siirtyä takaisin sen palvelimelle tällä työkalulla."
      backup: "Jos pyysit varmuuskopion, voit ladata sen 24 tunnin ajan."
      deletion: "Poistamme siirtotietueesi ja kaiken, mitä säilytimme sitä varten, 2 päivän kuluttua siirron valmistumisesta."
      sign_in: "Kun kirjaudut jatkossa sisään, käytä uutta handleasi ja valitse sovelluksessasi palveluntarjoajaksi uusi palvelimesi."


