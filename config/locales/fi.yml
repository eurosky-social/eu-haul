        pds_consent_title: "Kohdepalvelimen oikeudelliset ehdot"
        back: "Takaisin"
        continue: "Jatka"

      # Step 4: New Handle
      step4:
        title: "Uusi handle"
        custom_domain_title: "Mukautettu verkkotunnus havaittu"
        custom_domain_help: "Handle %{handle} on mukautettu verkkotunnus. Voit jatkaa sen käyttöä uudella palvelimella."
