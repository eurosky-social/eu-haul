        email: "Sähköposti"
        destination_server: "Kohdepalvelin"
        new_handle: "Uusi handle"
        invite_code: "Kutsukoodi"
        create_backup: "Luo varmuuskopio ennen siirtoa"
        backup_help: "Lataa täydellisen kopion tilisi tiedoista. Saatavilla 24 tuntia."
        confirm_email_html: "Kun napsautat <strong>Jatka</strong>, lähetämme vahvistussähköpostin osoitteeseen <strong>%{email}</strong>. Siirto alkaa vasta, kun vahvistat sähköpostin kautta."
        no_usage_title: "Älä käytä tiliäsi siirron aikana"
