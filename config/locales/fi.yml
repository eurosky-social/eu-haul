        invite_code_help: "Tämä palvelin vaatii kutsukoodin"
        existing_account_title: "Olemassa oleva tili löydetty"
        existing_account_help: "Tilisi on jo olemassa kohdepalvelimella. Vahvista salasanasi jatkaaksesi siirtoa."
        target_password_label: "Salasanasi kohdepalvelimella"
        target_password_placeholder: "Syötä olemassa olevan tilisi salasana"
        target_2fa_label: "Kirjautumiskoodi (2FA)"
        target_2fa_help: "Tarkista sähköpostistasi kaksivaiheisen tunnistautumisen koodi"
