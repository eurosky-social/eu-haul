        handle_placeholder: "handle.bsky.social"
        handle_help: "Syötä nykyinen AT Protocol -handle"
        password_label: "Tilin salasana"
        password_help: "Nykyinen tilisi salasana (sovellussalasanat eivät toimi)"
        two_factor_title: "Kaksivaiheinen tunnistautuminen"
        two_factor_help: "Kirjautumiskoodi on lähetetty sähköpostiisi. Syötä se alle."
        two_factor_placeholder: "Syötä kirjautumiskoodi"
        legal_consent_html: 'Olen lukenut ja hyväksyn <a href="%{tos_url}" target="_blank" rel="noopener">Käyttöehdot</a> ja otan huomioon <a href="%{privacy_url}" target="_blank" rel="noopener">Tietosuojakäytännön</a>'
        continue: "Jatka"

      # Step 2: Email
      step2:
        title: "Sähköpostiosoite"
        subtitle: "Lähetämme siirron tilannepäivitykset tähän sähköpostiosoitteeseen."
        email_label: "Sähköpostiosoite"
        email_help: "Lähetämme siirron tilannepäivitykset tähän sähköpostiosoitteeseen"
        email_readonly_help: "Sähköpostiosoite haettu tililtäsi"
        email_manual_help: "Emme pystyneet hakemaan sähköpostiosoitettasi. Syötä se manuaalisesti."
        confirm_access: "Minulla on pääsy tähän sähköpostiosoitteeseen ja voin noutaa siihen lähetetyn vahvistuskoodin."
        one_account_per_email: "Tästä osoitteesta tulee myös tilisi sähköpostiosoite uudella palvelimella, ja palvelin sallii vain yhden tilin osoitetta kohden. Jos olet jo rekisteröitynyt sinne tällä osoitteella, poista se tili tai vaihda sen sähköpostiosoite ensin — muuten siirto pysähtyy."
        back: "Takaisin"
        continue: "Jatka"

      # Step 3: Destination Server
