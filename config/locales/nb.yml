        handle_placeholder: "dinhandle.bsky.social"
        handle_help: "Skriv inn din nåværende AT Protocol-handle"
        password_label: "Kontopassord"
        password_help: "Ditt nåværende kontopassord (app-passord fungerer ikke)"
        two_factor_title: "Tofaktorautentisering"
        two_factor_help: "En innloggingskode er sendt til e-posten din. Skriv den inn nedenfor."
        two_factor_placeholder: "Skriv inn innloggingskoden din"
