  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Flytt kontoen din"
    title: "Flytt kontoen din til Europa"
    title_named: "Flytt kontoen din til %{name}"
    lead: "Ta med innleggene dine, hvem du følger og identiteten din til en europeisk server. Handlen din kan bli med deg, og følgerne dine vil ikke merke noe."
    start: "Start migrering"
    how_it_works: "Slik fungerer det"
    steps_label: "Slik fungerer flyttingen"
    steps:
      sign_in:
        label: "Logg inn"
        text: "Logg inn med din nåværende handle og passord. Vi bruker passordet én gang og lagrer det aldri."
      server:
        label: "Velg en server"
        text: "Velg Eurosky eller en annen server, og velg din nye handle."
      confirm:
        label: "Bekreft via e-post"
        text: "Vi overfører dataene dine og ber deg bekrefte det siste steget via e-post. Det tar omtrent 20–30 minutter."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Slik fungerer det"
    title: "Slik flytter du kontoen din"
    lead: "Kontoen din flyttes til en annen server på omtrent en halvtime. Innleggene dine, hvem du følger og identiteten din blir med deg, og de som følger deg, fortsetter å følge deg."
    before:
      title: "Før du begynner"
      credentials: "Din nåværende handle og passordet til kontoen din. App-passord fungerer ikke. Hvis du bruker tofaktorautentisering, trenger du også innloggingskoden vi ber om."
      email: "Tilgang til e-postadressen til kontoen din. Vi sender deg en kode dit, og senere sender også din nåværende server deg en."
      time: "Omtrent en halvtime der du ikke bruker kontoen din."
      invite: "For noen servere en invitasjonskode. Veiviseren forteller deg om serveren du velger, krever det."
    moves:
      title: "Dette blir med deg"
      everything: "Alt på kontoen din: innleggene og svarene dine, likerklikk og reposter, hvem du følger, lister og blokkeringer, profilen din, bildene og videoene dine og appinnstillingene dine, som lagrede feeder og dempede ord. Identiteten din blir også med, så de som følger deg, fortsetter å følge deg."
      handle: "Handlen din kan bli med hvis den er på ditt eget domene. En handle på domenet til din nåværende server, som navn.bsky.social, blir igjen: du velger en ny på den nye serveren."
    steps:
      title: "Steg for steg"
      sign_in:
        title: "Logg inn"
        text: "Logg inn med din nåværende handle og passord. Vi bruker dem til å starte flyttingen og lagrer aldri passordet ditt."
      choose:
        title: "Velg hvor du skal"
        text: "Velg en server, godta vilkårene dens hvis den har noen, og velg handlen din der. Du kan også be om en sikkerhetskopi av hele kontoen din."
      verify:
        title: "Bekreft e-posten din"
        text: "Vi sender deg en kode på e-post. Flyttingen starter når du skriver den inn på statussiden for migreringen din."
      copy:
        title: "Vi kopierer kontoen din"
        text: "Vi oppretter kontoen din på den nye serveren og kopierer alt dit; statussiden viser fremdriften. Ikke legg ut, lik eller følg noe i mellomtiden: de endringene ville ikke blitt med."
      confirm:
        title: "Bekreft flyttingen"
        text: "Din nåværende server sender deg en bekreftelseskode på e-post. Skriv den inn på statussiden innen en time, eller be om en ny. Dette steget peker identiteten din til den nye serveren."
      done:
        title: "Ferdig"
        text: "Kontoen din på den nye serveren slås på, og den gamle deaktiveres. Vi sender deg en e-post om hvordan du logger inn, sammen med passordet til den nye kontoen din."
    know:
      title: "Greit å vite"
      duration: "De fleste flyttinger tar 20–30 minutter. Kontoer med mange bilder og videoer tar lengre tid."
      cancel: "Frem til du skriver inn bekreftelseskoden i steg 5, kan du avbryte flyttingen, og kontoen din blir der den er."
      recovery: "Å peke identiteten din til den nye serveren kan ikke angres her. Vi gir deg en gjenopprettingsnøkkel som kan angre det, så oppbevar den et trygt sted."
      old_account: "Den gamle kontoen din deaktiveres, ikke slettes. Du kan flytte tilbake til serveren dens senere med dette verktøyet."
      backup: "Hvis du ba om en sikkerhetskopi, kan du laste den ned i 24 timer."
      deletion: "Vi sletter registreringen av flyttingen din, og alt vi har tatt vare på for den, 2 dager etter at flyttingen er fullført."
      sign_in: "For å logge inn etterpå bruker du den nye handlen din og velger den nye serveren som hostingleverandør i appen din."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
