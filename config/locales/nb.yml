        confirm_access: "Jeg har tilgang til denne e-postadressen og kan hente en bekreftelseskode sendt dit."
        back: "Tilbake"
        continue: "Fortsett"

      # Step 3: Destination Server
      step3:
        title: "Destinasjonsserver"
        subtitle: "Velg hvor du vil migrere kontoen din."
        server_label: "Destinasjonsserver"
        server_placeholder: "Velg en server…"
        server_custom: "Egendefinert server…"
        server_help: "Velg hvor du vil migrere kontoen din"
        custom_url_label: "Egendefinert server-URL"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Skriv inn den fullstendige URL-en til den egendefinerte serveren"
        invite_code_label: "Invitasjonskode"
        invite_code_placeholder: "Skriv inn invitasjonskoden din"
        invite_code_help: "Denne serveren krever en invitasjonskode"
        existing_account_title: "Eksisterende konto funnet"
        existing_account_help: "Kontoen din finnes allerede på destinasjonsserveren. Vennligst bekreft passordet ditt for å fortsette med migreringen."
        target_password_label: "Ditt passord på målserveren"
        target_password_placeholder: "Skriv inn passordet ditt for den eksisterende kontoen"
        target_2fa_label: "Innloggingskode (2FA)"
        target_2fa_help: "Sjekk e-posten din for tofaktorautentiseringskoden"
        deactivated_notice: "Denne kontoen ser ut til å være deaktivert"
        deactivated_reason: "(muligens fra et tidligere migreringsforsøk)."
        deactivated_help: "Hvis du ikke husker passordet ditt, kan du prøve:"
        deactivated_reset: "Tilbakestill passordet ditt:"
        deactivated_contact: "Kontakt PDS-administratoren på %{email} for å fjerne denne inaktive kontoen og starte migreringen på nytt. Inkluder din DID:"
        pds_consent_title: "Juridiske vilkår for destinasjonsserveren"
        back: "Tilbake"
        continue: "Fortsett"

      # Step 4: New Handle
      step4:
        title: "Ny handle"
        custom_domain_title: "Egendefinert domene oppdaget"
        custom_domain_help: "Din handle %{handle} er et egendefinert domene. Du kan fortsette å bruke det på den nye serveren."
        keep_handle: "Behold min nåværende handle"
        new_handle_label: "Din nye handle"
        new_handle_placeholder: "brukernavn"
        domain_label: "Handle-domene"
        new_handle_help: "Velg din nye handle (kan være den gamle) på destinasjonsserveren."
        back: "Tilbake"
        continue: "Fortsett"

      # Step 5: Review & Confirm
      step5:
        title: "Gjennomgang og bekreftelse"
        subtitle: "Sjekk opplysningene nedenfor før vi sender bekreftelses-e-posten."
        current_handle: "Nåværende handle"
        email: "E-post"
        destination_server: "Destinasjonsserver"
        new_handle: "Ny handle"
        invite_code: "Invitasjonskode"
        create_backup: "Opprett en sikkerhetskopi før migrering"
        backup_help: "Laster ned en komplett kopi av kontodataene dine. Tilgjengelig i 24 timer."
        confirm_email_html: "Når du klikker <strong>Fortsett</strong>, sender vi en bekreftelses-e-post til <strong>%{email}</strong>. Migreringen starter først når du bekrefter via den e-posten."
        no_usage_title: "Ikke bruk kontoen din under migrering"
        no_usage_help: "Når migreringen starter, lukk alle apper og nettleserfaner med kontoen din. Innlegg, likerklikk eller følginger gjort under migreringen vil ikke bli overført. Du mottar en e-post når den er fullført (~20-30 minutter)."
        acknowledge: "Jeg forstår at jeg ikke bør bruke kontoen min under migrering"
        back: "Tilbake"
        continue: "Fortsett"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Forlate migreringen?"
        body: "Det du har fylt inn, går tapt. Ingenting er endret på kontoen din ennå."
        stay: "Bli her"
        leave: "Forlat"

