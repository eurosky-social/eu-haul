        email: "E-pošta"
        destination: "Cilj"
        handle: "Handle"
        review: "Pregled"

      # Step 1: Account Credentials
      step1:
        title: "Poverilnice računa"
        subtitle: "Prijavite se v račun, ki ga želite preseliti. Vašega gesla nikoli ne shranimo."
