  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Preselite svoj račun"
    title: "Preselite svoj račun v Evropo"
    title_named: "Preselite svoj račun na %{name}"
    lead: "Prenesite svoje objave, sledenja in identiteto na evropski strežnik. Vaš handle lahko gre z vami, vaši sledilci pa ne bodo opazili ničesar."
    start: "Začni selitev"
    how_it_works: "Kako deluje"
    steps_label: "Kako poteka selitev"
    steps:
      sign_in:
        label: "Prijava"
        text: "Prijavite se s trenutnim handle in geslom. Uporabimo ju samo enkrat in ju nikoli ne shranimo."
      server:
        label: "Izbira strežnika"
        text: "Izberite Eurosky ali kateri koli drug strežnik in določite svoj novi handle."
      confirm:
        label: "Potrditev po e-pošti"
        text: "Prenesemo vaše podatke in vas prosimo, da zadnji korak potrdite po e-pošti. Traja približno 20–30 minut."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Kako deluje"
    title: "Kako poteka selitev računa"
    lead: "Vaš račun se v približno pol ure preseli na drug strežnik. Vaše objave, sledenja in identiteta gredo z vami, ljudje, ki vam sledijo, pa vam bodo še naprej sledili."
    before:
      title: "Preden začnete"
      credentials: "Vaš trenutni handle in geslo računa. Gesla za aplikacije ne delujejo. Če uporabljate dvostopenjsko avtentikacijo, boste potrebovali tudi prijavno kodo, ki jo zahtevamo."
      email: "Dostop do e-poštnega naslova vašega računa. Tja vam pošljemo kodo, pozneje pa vam jo pošlje tudi vaš trenutni strežnik."
      time: "Približno pol ure, v kateri računa ne uporabljate."
      invite: "Za nekatere strežnike koda za povabilo. Čarovnik vam pove, ali jo izbrani strežnik potrebuje."
    moves:
      title: "Kaj se preseli z vami"
      everything: "Vse v vašem računu: vaše objave in odgovori, všečki in ponovne objave, sledenja, seznami in blokade, vaš profil, slike in videoposnetki ter nastavitve aplikacije, kot so shranjeni viri in utišane besede. Preseli se tudi vaša identiteta, zato vam bodo ljudje, ki vam sledijo, še naprej sledili."
      handle: "Vaš handle lahko gre z vami, če je na vaši lastni domeni. Handle na domeni vašega trenutnega strežnika, kot je ime.bsky.social, ostane za vami: na novem strežniku izberete novega."
    steps:
      title: "Korak za korakom"
      sign_in:
        title: "Prijava"
        text: "Prijavite se s trenutnim handle in geslom. Uporabimo ju za začetek selitve in vašega gesla nikoli ne shranimo."
      choose:
        title: "Izbira cilja"
        text: "Izberite strežnik, sprejmite njegove pogoje, če jih ima, in tam izberite svoj handle. Zahtevate lahko tudi varnostno kopijo celotnega računa."
      verify:
        title: "Potrditev e-pošte"
        text: "Po e-pošti vam pošljemo kodo. Selitev se začne, ko jo vnesete na strani s stanjem selitve."
      copy:
        title: "Kopiramo vaš račun"
        text: "Na novem strežniku ustvarimo vaš račun in nanj kopiramo vse; napredek je prikazan na strani s stanjem. Medtem ne objavljajte, ne všečkajte in ne sledite nikomur: te spremembe se ne bi prenesle."
      confirm:
        title: "Potrditev selitve"
        text: "Vaš trenutni strežnik vam po e-pošti pošlje potrditveno kodo. Vnesite jo na strani s stanjem v eni uri ali zahtevajte novo. S tem korakom vaša identiteta začne kazati na novi strežnik."
      done:
        title: "Končano"
        text: "Vaš račun na novem strežniku se vklopi, stari pa se deaktivira. Po e-pošti vam pošljemo navodila za prijavo skupaj z geslom za vaš novi račun."
    know:
      title: "Dobro je vedeti"
      duration: "Večina selitev traja 20–30 minut. Računi z veliko slikami in videoposnetki potrebujejo več časa."
      cancel: "Dokler v 5. koraku ne vnesete potrditvene kode, lahko selitev prekličete in vaš račun ostane, kjer je."
      recovery: "Preusmeritve identitete na novi strežnik tukaj ni mogoče razveljaviti. Damo vam ključ za obnovitev, s katerim jo je mogoče razveljaviti, zato ga shranite na varno mesto."
      old_account: "Vaš stari račun se deaktivira, ne izbriše. Pozneje se lahko s tem orodjem preselite nazaj na njegov strežnik."
      backup: "Če ste zahtevali varnostno kopijo, jo lahko prenašate 24 ur."
      deletion: "Zapis o vaši selitvi in vse, kar smo hranili zanjo, izbrišemo 2 dni po dokončani selitvi."
      sign_in: "Za poznejšo prijavo uporabite novi handle in v aplikaciji kot ponudnika gostovanja izberite novi strežnik."


