        handle_placeholder: "vashandle.bsky.social"
        handle_help: "Vnesite svoj trenutni handle AT Protocol"
        password_label: "Geslo računa"
        password_help: "Vaše trenutno geslo računa (gesla za aplikacije ne bodo delovala)"
        two_factor_title: "Dvostopenjska avtentikacija"
        two_factor_help: "Prijavna koda je bila poslana na vaš e-poštni naslov. Vnesite jo spodaj."
        two_factor_placeholder: "Vnesite prijavno kodo"
        legal_consent_html: 'Prebral/a sem in se strinjam s <a href="%{tos_url}" target="_blank" rel="noopener">Pogoji uporabe</a> ter potrjujem <a href="%{privacy_url}" target="_blank" rel="noopener">Pravilnik o zasebnosti</a>'
        continue: "Naprej"

      # Step 2: Email
      step2:
        title: "E-poštni naslov"
        subtitle: "Na ta e-poštni naslov bomo pošiljali posodobitve o stanju selitve."
