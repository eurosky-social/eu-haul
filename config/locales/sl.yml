        email_help: "Na ta e-poštni naslov bomo pošiljali posodobitve o stanju selitve"
        email_readonly_help: "E-poštni naslov pridobljen iz vašega računa"
        email_manual_help: "Vašega e-poštnega naslova nismo uspeli pridobiti. Prosimo, vnesite ga ročno."
        confirm_access: "Imam dostop do tega e-poštnega naslova in lahko prevzamem potrditveno kodo, poslano nanj."
        back: "Nazaj"
        continue: "Naprej"

      # Step 3: Destination Server
      step3:
        title: "Ciljni strežnik"
