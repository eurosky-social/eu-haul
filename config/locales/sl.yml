        custom_url_help: "Vnesite celoten URL svojega strežnika po meri"
        invite_code_label: "Koda za povabilo"
        invite_code_placeholder: "Vnesite kodo za povabilo"
        invite_code_help: "Ta strežnik zahteva kodo za povabilo"
        existing_account_title: "Najden obstoječi račun"
        existing_account_help: "Vaš račun že obstaja na ciljnem strežniku. Prosimo, potrdite geslo za nadaljevanje selitve."
        target_password_label: "Vaše geslo na ciljnem strežniku"
        target_password_placeholder: "Vnesite geslo za obstoječi račun"
        target_2fa_label: "Prijavna koda (2FA)"
        target_2fa_help: "Preverite e-pošto za kodo dvostopenjske avtentikacije"
        deactivated_notice: "Ta račun je očitno deaktiviran"
        deactivated_reason: "(verjetno zaradi prejšnjega poskusa selitve)."
        deactivated_help: "Če se ne spomnite gesla, lahko poskusite:"
        deactivated_reset: "Ponastavite geslo:"
        deactivated_contact: "Kontaktirajte administratorja PDS na %{email} za odstranitev tega neaktivnega računa in ponovni zagon selitve. Vključite svoj DID:"
        pds_consent_title: "Pravni pogoji ciljnega strežnika"
        back: "Nazaj"
        continue: "Naprej"

      # Step 4: New Handle
      step4:
        title: "Nov handle"
        custom_domain_title: "Zaznana domena po meri"
        custom_domain_help: "Vaš handle %{handle} je domena po meri. Lahko jo še naprej uporabljate na novem strežniku."
        keep_handle: "Obdrži trenutni handle"
        new_handle_label: "Vaš novi handle"
        new_handle_placeholder: "uporabnik"
        domain_label: "Domena handla"
        new_handle_help: "Izberite svoj novi handle (lahko je enak staremu) na ciljnem strežniku."
        back: "Nazaj"
        continue: "Naprej"

      # Step 5: Review & Confirm
      step5:
        title: "Pregled in potrditev"
        subtitle: "Preden pošljemo potrditveno e-pošto, preverite spodnje podatke."
        current_handle: "Trenutni handle"
        email: "E-pošta"
        destination_server: "Ciljni strežnik"
        new_handle: "Nov handle"
        invite_code: "Koda za povabilo"
        create_backup: "Ustvari varnostno kopijo pred selitvijo"
        backup_help: "Prenese popolno kopijo podatkov vašega računa. Na voljo 24 ur."
        confirm_email_html: "Ko kliknete <strong>Naprej</strong>, bomo poslali potrditveno e-pošto na <strong>%{email}</strong>. Selitev se bo začela šele po potrditvi prek te e-pošte."
        no_usage_title: "Med selitvijo ne uporabljajte svojega računa"
        no_usage_help: "Ko se selitev začne, zaprite vse aplikacije in zavihke brskalnika z vašim računom. Kakršne koli objave, všečki ali sledenja med selitvijo ne bodo preneseni. Ko bo končano, boste prejeli e-pošto (~20-30 minut)."
        acknowledge: "Razumem, da med selitvijo ne smem uporabljati svojega računa"
        back: "Nazaj"
        continue: "Naprej"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Zapustiti selitev?"
        body: "Vneseni podatki bodo izgubljeni. Na vašem računu še ni bilo nič spremenjeno."
        stay: "Ostani tukaj"
        leave: "Zapusti"

