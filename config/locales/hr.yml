  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Preselite svoj račun"
    title: "Preselite svoj račun u Europu"
    title_named: "Preselite svoj račun na %{name}"
    lead: "Prenesite svoje objave, praćenja i identitet na europski poslužitelj. Vaš handle može ići s vama, a vaši pratitelji neće ništa primijetiti."
    start: "Pokreni migraciju"
    how_it_works: "Kako to funkcionira"
    steps_label: "Kako funkcionira preseljenje"
    steps:
      sign_in:
        label: "Prijava"
        text: "Prijavite se svojim trenutnim handleom i lozinkom. Lozinku koristimo samo jednom i nikad je ne pohranjujemo."
      server:
        label: "Odabir poslužitelja"
        text: "Odaberite Eurosky ili bilo koji drugi poslužitelj te svoj novi handle."
      confirm:
        label: "Potvrda e-poštom"
        text: "Prenosimo vaše podatke i tražimo da posljednji korak potvrdite e-poštom. Traje oko 20–30 minuta."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Kako to funkcionira"
    title: "Kako funkcionira preseljenje računa"
    lead: "Vaš se račun za otprilike pola sata seli na drugi poslužitelj. Vaše objave, praćenja i identitet idu s vama, a ljudi koji vas prate nastavljaju vas pratiti."
    before:
      title: "Prije nego što počnete"
      credentials: "Vaš trenutni handle i lozinka računa. Lozinke za aplikacije ne rade. Ako koristite dvofaktorsku autentifikaciju, trebat će vam i kod za prijavu koji ćemo zatražiti."
      email: "Pristup adresi e-pošte vašeg računa. Onamo vam šaljemo kod, a kasnije vam i vaš trenutni poslužitelj šalje jedan."
      time: "Otprilike pola sata tijekom kojeg ne koristite svoj račun."
      invite: "Za neke poslužitelje pozivni kod. Čarobnjak će vam reći treba li ga poslužitelj koji odaberete."
    moves:
      title: "Što se seli s vama"
      everything: "Sve s vašeg računa: vaše objave i odgovori, sviđanja i ponovne objave, praćenja, popisi i blokiranja, vaš profil, vaše slike i videozapisi te postavke aplikacija, poput spremljenih feedova i utišanih riječi. Seli se i vaš identitet, pa vas ljudi koji vas prate nastavljaju pratiti."
      handle: "Vaš handle može ići s vama ako je na vašoj vlastitoj domeni. Handle na domeni vašeg trenutnog poslužitelja, poput ime.bsky.social, ostaje ondje: na novom poslužitelju birate novi."
    steps:
      title: "Korak po korak"
      sign_in:
        title: "Prijavite se"
        text: "Prijavite se svojim trenutnim handleom i lozinkom. Koristimo ih za pokretanje preseljenja i nikad ne pohranjujemo vašu lozinku."
      choose:
        title: "Odaberite odredište"
        text: "Odaberite poslužitelj, prihvatite njegove uvjete ako ih ima i odaberite svoj handle na njemu. Možete zatražiti i sigurnosnu kopiju cijelog računa."
      verify:
        title: "Potvrdite e-poštu"
        text: "Šaljemo vam kod e-poštom. Preseljenje počinje čim ga unesete na stranici statusa svoje migracije."
      copy:
        title: "Kopiramo vaš račun"
        text: "Stvaramo vaš račun na novom poslužitelju i kopiramo sve na njega; stranica statusa prikazuje napredak. U međuvremenu ne objavljujte, ne označavajte sviđanja i ne pratite nikoga: te promjene ne bi bile prenesene."
      confirm:
        title: "Potvrdite preseljenje"
        text: "Vaš trenutni poslužitelj šalje vam potvrdni kod e-poštom. Unesite ga na stranici statusa u roku od sat vremena ili zatražite novi. Ovaj korak usmjerava vaš identitet na novi poslužitelj."
      done:
        title: "Gotovo"
        text: "Vaš račun na novom poslužitelju je uključen, a stari je deaktiviran. E-poštom vam šaljemo upute za prijavu zajedno s lozinkom vašeg novog računa."
    know:
      title: "Dobro je znati"
      duration: "Većina preseljenja traje 20–30 minuta. Računi s mnogo slika i videozapisa traju dulje."
      cancel: "Dok ne unesete potvrdni kod u 5. koraku, možete otkazati preseljenje i vaš račun ostaje gdje jest."
      recovery: "Usmjeravanje identiteta na novi poslužitelj ovdje se ne može poništiti. Dajemo vam ključ za oporavak kojim se to može poništiti, pa ga čuvajte na sigurnom mjestu."
      old_account: "Vaš stari račun je deaktiviran, a ne izbrisan. Kasnije se ovim alatom možete vratiti na njegov poslužitelj."
      backup: "Ako ste zatražili sigurnosnu kopiju, možete je preuzeti u roku od 24 sata."
      deletion: "Zapis o vašem preseljenju i sve što smo za njega čuvali brišemo 2 dana nakon što preseljenje završi."
      sign_in: "Za kasniju prijavu koristite svoj novi handle i u aplikaciji odaberite novi poslužitelj kao pružatelja hostinga."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Pokretanje migracije računa"
      errors_heading: "Ispravite sljedeće pogreške:"
      card_label: "Pokretanje migracije računa"
      step_of: "Korak %{current} od %{total}"
      steps_label: "Koraci migracije"

      # Progress bar labels
      progress:
        account: "Račun"
        email: "E-pošta"
        destination: "Odredište"
        handle: "Handle"
        review: "Pregled"

      # Step 1: Account Credentials
      step1:
        title: "Podaci za prijavu"
        subtitle: "Prijavite se na račun koji želite preseliti. Vašu lozinku nikad ne pohranjujemo."
        handle_label: "Vaš handle"
        handle_placeholder: "vashandle.bsky.social"
        handle_help: "Unesite svoj trenutni AT Protocol handle"
        password_label: "Lozinka računa"
        password_help: "Vaša trenutna lozinka računa (lozinke za aplikacije neće raditi)"
        two_factor_title: "Dvofaktorska autentifikacija"
        two_factor_help: "Kod za prijavu poslan je na vašu e-poštu. Unesite ga ispod."
        two_factor_placeholder: "Unesite kod za prijavu"
        legal_consent_html: 'Pročitao/la sam i prihvaćam <a href="%{tos_url}" target="_blank" rel="noopener">Uvjete korištenja</a> i potvrđujem <a href="%{privacy_url}" target="_blank" rel="noopener">Politiku privatnosti</a>'
        continue: "Nastavi"

      # Step 2: Email
      step2:
        title: "Adresa e-pošte"
        subtitle: "Na ovu adresu slat ćemo obavijesti o statusu migracije."
        email_label: "Adresa e-pošte"
        email_help: "Na ovu adresu slat ćemo obavijesti o statusu migracije"
        email_readonly_help: "E-pošta preuzeta s vašeg računa"
        email_manual_help: "Nismo mogli dohvatiti vašu e-poštu. Unesite je ručno."
        confirm_access: "Imam pristup ovoj adresi e-pošte i mogu preuzeti potvrdni kod poslan na nju."
        one_account_per_email: "Ova adresa postat će i adresa e-pošte vašeg računa na novom poslužitelju, a poslužitelj dopušta samo jedan račun po adresi. Ako ste se ondje već registrirali s njom, najprije izbrišite taj račun ili promijenite njegovu adresu e-pošte — inače će se migracija zaustaviti."
        back: "Natrag"
        continue: "Nastavi"

      # Step 3: Destination Server
      step3:
        title: "Odredišni poslužitelj"
        subtitle: "Odaberite gdje želite migrirati svoj račun."
        server_label: "Odredišni poslužitelj"
        server_placeholder: "Odaberite poslužitelj…"
        server_custom: "Prilagođeni poslužitelj…"
        server_help: "Odaberite gdje želite migrirati svoj račun"
        custom_url_label: "URL prilagođenog poslužitelja"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Unesite potpuni URL vašeg prilagođenog poslužitelja"
        invite_code_label: "Pozivni kod"
        invite_code_placeholder: "Unesite pozivni kod"
        invite_code_help: "Ovaj poslužitelj zahtijeva pozivni kod"
        existing_account_title: "Pronađen postojeći račun"
        existing_account_help: "Vaš račun već postoji na odredišnom poslužitelju. Potvrdite svoju lozinku za nastavak migracije."
        target_password_label: "Vaša lozinka na odredišnom poslužitelju"
        target_password_placeholder: "Unesite lozinku za postojeći račun"
        target_2fa_label: "Kod za prijavu (2FA)"
        target_2fa_help: "Provjerite e-poštu za kod dvofaktorske autentifikacije"
        deactivated_notice: "Ovaj račun je deaktiviran"
        deactivated_reason: "(moguće zbog prethodnog pokušaja migracije)."
        deactivated_help: "Ako se ne sjećate lozinke, možete pokušati:"
        deactivated_reset: "Resetiranje lozinke:"
        deactivated_contact: "Kontaktirajte administratora PDS-a na %{email} za uklanjanje ovog neaktivnog računa i ponovno pokretanje migracije. Uključite svoj DID:"
        pds_consent_title: "Pravni uvjeti odredišnog poslužitelja"
        back: "Natrag"
        continue: "Nastavi"

      # Step 4: New Handle
      step4:
        title: "Novi handle"
        custom_domain_title: "Otkrivena prilagođena domena"
        custom_domain_help: "Vaš handle %{handle} je prilagođena domena. Možete ga nastaviti koristiti na novom poslužitelju."
        keep_handle: "Zadrži trenutni handle"
        new_handle_label: "Vaš novi handle"
        new_handle_placeholder: "korisnickoime"
        domain_label: "Domena handlea"
        new_handle_help: "Odaberite svoj novi handle (može biti stari) na odredišnom poslužitelju."
        back: "Natrag"
        continue: "Nastavi"

      # Step 5: Review & Confirm
      step5:
        title: "Pregled i potvrda"
        subtitle: "Provjerite podatke u nastavku prije nego što pošaljemo potvrdnu e-poruku."
        current_handle: "Trenutni handle"
        email: "E-pošta"
        destination_server: "Odredišni poslužitelj"
        new_handle: "Novi handle"
        invite_code: "Pozivni kod"
        create_backup: "Stvori sigurnosnu kopiju prije migracije"
        backup_help: "Preuzima potpunu kopiju podataka vašeg računa. Dostupno 24 sata."
        confirm_email_html: "Kada kliknete <strong>Nastavi</strong>, poslat ćemo potvrdnu e-poruku na <strong>%{email}</strong>. Migracija će započeti tek nakon što potvrdite putem te e-poruke."
        no_usage_title: "Ne koristite svoj račun tijekom migracije"
        no_usage_help: "Nakon što migracija započne, zatvorite sve aplikacije i kartice preglednika s vašim računom. Sve objave, oznake sviđanja i praćenja napravljeni tijekom migracije neće biti preneseni. Primit ćete e-poruku kada završi (~20-30 minuta)."
        acknowledge: "Razumijem da ne smijem koristiti svoj račun tijekom migracije"
        back: "Natrag"
        continue: "Nastavi"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Napustiti migraciju?"
        body: "Uneseni podaci bit će izgubljeni. Na vašem računu još ništa nije promijenjeno."
        stay: "Ostani ovdje"
        leave: "Napusti"

