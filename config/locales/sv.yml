  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Flytta ditt konto"
    title: "Flytta ditt konto till Europa"
    title_named: "Flytta ditt konto till %{name}"
    lead: "Ta med dina inlägg, följningar och din identitet till en europeisk server. Ditt handle kan följa med, och dina följare märker ingenting."
    start: "Starta flytt"
    how_it_works: "Så fungerar det"
    steps_label: "Så går flytten till"
    steps:
      sign_in:
        label: "Logga in"
        text: "Logga in med ditt nuvarande handle och lösenord. Vi använder dem en gång och sparar dem aldrig."
      server:
        label: "Välj en server"
        text: "Välj Eurosky eller någon annan server och bestäm ditt nya handle."
      confirm:
        label: "Bekräfta via e-post"
        text: "Vi överför dina data och ber dig bekräfta det sista steget via e-post. Det tar cirka 20–30 minuter."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Så fungerar det"
    title: "Så går det till att flytta ditt konto"
    lead: "Ditt konto flyttar till en annan server på ungefär en halvtimme. Dina inlägg, följningar och din identitet följer med, och de som följer dig fortsätter att följa dig."
    before:
      title: "Innan du börjar"
      credentials: "Ditt nuvarande handle och lösenordet till ditt konto. Applösenord fungerar inte. Om du använder tvåfaktorsautentisering behöver du också inloggningskoden som vi ber om."
      email: "Tillgång till e-postadressen för ditt konto. Vi skickar en kod dit, och senare skickar din nuvarande server också en."
      time: "Ungefär en halvtimme då du inte använder ditt konto."
      invite: "För vissa servrar en inbjudningskod. Guiden talar om ifall servern du väljer behöver en."
    moves:
      title: "Det här följer med"
      everything: "Allt i ditt konto: dina inlägg och svar, gillningar och reposts, följningar, listor och blockeringar, din profil, dina bilder och videor och dina appinställningar, som sparade flöden och dolda ord. Din identitet flyttar också, så de som följer dig fortsätter att följa dig."
      handle: "Ditt handle kan följa med om det ligger på din egen domän. Ett handle på din nuvarande servers domän, som namn.bsky.social, blir kvar: du väljer ett nytt på den nya servern."
    steps:
      title: "Steg för steg"
      sign_in:
        title: "Logga in"
        text: "Logga in med ditt nuvarande handle och lösenord. Vi använder dem för att starta flytten och sparar aldrig ditt lösenord."
      choose:
        title: "Välj vart du ska"
        text: "Välj en server, godkänn dess villkor om den har några och välj ditt handle där. Du kan också be om en säkerhetskopia av hela ditt konto."
      verify:
        title: "Bekräfta din e-post"
        text: "Vi mejlar dig en kod. Flytten startar när du anger den på statussidan för din flytt."
      copy:
        title: "Vi kopierar ditt konto"
        text: "Vi skapar ditt konto på den nya servern och kopierar allt dit; statussidan visar förloppet. Publicera, gilla och följ ingenting under tiden: de ändringarna skulle inte följa med."
      confirm:
        title: "Bekräfta flytten"
        text: "Din nuvarande server mejlar dig en bekräftelsekod. Ange den på statussidan inom en timme, eller begär en ny. Det här steget pekar om din identitet till den nya servern."
      done:
        title: "Klart"
        text: "Ditt konto på den nya servern aktiveras och det gamla inaktiveras. Vi mejlar dig hur du loggar in, tillsammans med lösenordet till ditt nya konto."
    know:
      title: "Bra att veta"
      duration: "De flesta flyttar tar 20–30 minuter. Konton med många bilder och videor tar längre tid."
      cancel: "Tills du anger bekräftelsekoden i steg 5 kan du avbryta flytten, och ditt konto stannar där det är."
      recovery: "Att peka om din identitet till den nya servern kan inte ångras här. Vi ger dig en återställningsnyckel som kan ångra det, så förvara den på ett säkert ställe."
      old_account: "Ditt gamla konto inaktiveras, det raderas inte. Du kan senare flytta tillbaka till dess server med det här verktyget."
      backup: "Om du bad om en säkerhetskopia kan du ladda ner den i 24 timmar."
      deletion: "Vi raderar posten om din flytt, och allt vi sparat för den, 2 dagar efter att flytten är klar."
      sign_in: "För att logga in efteråt använder du ditt nya handle och väljer din nya server som värdleverantör i din app."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Starta kontoflyttning"
      errors_heading: "Vänligen rätta följande fel:"
      card_label: "Starta kontoflyttning"
      step_of: "Steg %{current} av %{total}"
      steps_label: "Flyttsteg"

      # Progress bar labels
      progress:
        account: "Konto"
        email: "E-post"
        destination: "Destination"
        handle: "Handle"
        review: "Granska"

      # Step 1: Account Credentials
      step1:
        title: "Kontouppgifter"
        subtitle: "Logga in på kontot du vill flytta. Vi sparar aldrig ditt lösenord."
        handle_label: "Ditt handle"
        handle_placeholder: "ditthandle.bsky.social"
        handle_help: "Ange ditt nuvarande AT Protocol-handle"
        password_label: "Kontolösenord"
        password_help: "Ditt nuvarande kontolösenord (applösenord fungerar inte)"
        two_factor_title: "Tvåfaktorsautentisering"
        two_factor_help: "En inloggningskod har skickats till din e-post. Ange den nedan."
        two_factor_placeholder: "Ange din inloggningskod"
        legal_consent_html: 'Jag har läst och godkänner <a href="%{tos_url}" target="_blank" rel="noopener">Användarvillkoren</a> och bekräftar <a href="%{privacy_url}" target="_blank" rel="noopener">Integritetspolicyn</a>'
        continue: "Fortsätt"

      # Step 2: Email
      step2:
        title: "E-postadress"
        subtitle: "Vi skickar statusuppdateringar om flytten till denna e-postadress."
        email_label: "E-postadress"
        email_help: "Vi skickar statusuppdateringar om flytten till denna e-postadress"
        email_readonly_help: "E-postadress hämtad från ditt konto"
        email_manual_help: "Vi kunde inte hämta din e-postadress. Vänligen ange den manuellt."
        confirm_access: "Jag har tillgång till denna e-postadress och kan hämta en bekräftelsekod som skickas till den."
        one_account_per_email: "Den här adressen blir också e-postadressen för ditt konto på den nya servern, och en server tillåter bara ett konto per adress. Om du redan har registrerat dig där med den, radera det kontot eller ändra dess e-postadress först — annars stoppas flytten."
        back: "Tillbaka"
        continue: "Fortsätt"

      # Step 3: Destination Server
      step3:
        title: "Destinationsserver"
        subtitle: "Välj vart du vill flytta ditt konto."
        server_label: "Destinationsserver"
        server_placeholder: "Välj en server…"
        server_custom: "Anpassad server…"
        server_help: "Välj vart du vill flytta ditt konto"
        custom_url_label: "Anpassad server-URL"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Ange den fullständiga URL:en till din anpassade server"
        invite_code_label: "Inbjudningskod"
        invite_code_placeholder: "Ange din inbjudningskod"
        invite_code_help: "Denna server kräver en inbjudningskod"
        existing_account_title: "Befintligt konto hittat"
        existing_account_help: "Ditt konto finns redan på destinationsservern. Vänligen verifiera ditt lösenord för att fortsätta med flytten."
        target_password_label: "Ditt lösenord på destinationsservern"
        target_password_placeholder: "Ange lösenordet för det befintliga kontot"
        target_2fa_label: "Inloggningskod (2FA)"
        target_2fa_help: "Kontrollera din e-post för tvåfaktorsautentiseringskoden"
        deactivated_notice: "Detta konto verkar vara inaktiverat"
        deactivated_reason: "(troligen från ett tidigare flyttningsförsök)."
        deactivated_help: "Om du inte minns ditt lösenord kan du prova:"
        deactivated_reset: "Återställ ditt lösenord:"
        deactivated_contact: "Kontakta PDS-administratören på %{email} för att ta bort detta inaktiva konto och starta om flytten. Inkludera ditt DID:"
        pds_consent_title: "Juridiska villkor för destinationsservern"
        back: "Tillbaka"
        continue: "Fortsätt"

      # Step 4: New Handle
      step4:
        title: "Nytt handle"
        custom_domain_title: "Anpassad domän upptäckt"
        custom_domain_help: "Ditt handle %{handle} är en anpassad domän. Du kan fortsätta använda det på den nya servern."
        keep_handle: "Behåll mitt nuvarande handle"
        new_handle_label: "Ditt nya handle"
        new_handle_placeholder: "användarnamn"
        domain_label: "Handle-domän"
        new_handle_help: "Välj ditt nya handle (kan vara ditt gamla) på destinationsservern."
        back: "Tillbaka"
        continue: "Fortsätt"

      # Step 5: Review & Confirm
      step5:
        title: "Granska och bekräfta"
        subtitle: "Kontrollera uppgifterna nedan innan vi skickar bekräftelsemeddelandet."
        current_handle: "Nuvarande handle"
        email: "E-post"
        destination_server: "Destinationsserver"
        new_handle: "Nytt handle"
        invite_code: "Inbjudningskod"
        create_backup: "Skapa en säkerhetskopia före flytten"
        backup_help: "Laddar ner en komplett kopia av dina kontodata. Tillgänglig i 24 timmar."
        confirm_email_html: "När du klickar på <strong>Fortsätt</strong> skickar vi ett bekräftelsemeddelande till <strong>%{email}</strong>. Flytten startar först efter att du bekräftar via det meddelandet."
        no_usage_title: "Använd inte ditt konto under flytten"
        no_usage_help: "När flytten börjar, stäng alla appar och webbläsarflikar med ditt konto. Alla inlägg, gillanden eller följningar som görs under flytten överförs inte. Du får ett e-postmeddelande när det är klart (~20-30 minuter)."
        acknowledge: "Jag förstår att jag inte ska använda mitt konto under flytten"
        back: "Tillbaka"
        continue: "Fortsätt"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Lämna flytten?"
        body: "Det du har fyllt i går förlorat. Inget har ändrats på ditt konto än."
        stay: "Stanna kvar"
        leave: "Lämna"

