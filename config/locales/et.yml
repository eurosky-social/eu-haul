  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Viige oma konto üle"
    title: "Viige oma konto üle Euroopasse"
    title_named: "Viige oma konto üle serverisse %{name}"
    lead: "Viige oma postitused, jälgimised ja identiteet üle Euroopa serverisse. Teie handle saab kaasa tulla ja teie jälgijad ei märka midagi."
    start: "Alusta migreerimist"
    how_it_works: "Kuidas see toimib"
    steps_label: "Kuidas üleviimine toimib"
    steps:
      sign_in:
        label: "Logige sisse"
        text: "Logige sisse oma praeguse handle'i ja parooliga. Kasutame parooli ainult ühe korra ega salvesta seda kunagi."
      server:
        label: "Valige server"
        text: "Valige Eurosky või mõni muu server ja valige oma uus handle."
      confirm:
        label: "Kinnitage e-posti teel"
        text: "Kanname teie andmed üle ja palume teil viimane samm e-posti teel kinnitada. See võtab umbes 20–30 minutit."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Kuidas see toimib"
    title: "Kuidas konto üleviimine toimib"
    lead: "Teie konto viiakse umbes poole tunniga teise serverisse. Teie postitused, jälgimised ja identiteet tulevad kaasa ning inimesed, kes teid jälgivad, jälgivad teid ka edaspidi."
    before:
      title: "Enne alustamist"
      credentials: "Teie praegune handle ja konto parool. Rakenduse paroolid ei tööta. Kui kasutate kaheastmelist autentimist, vajate ka sisselogimiskoodi, mida me küsime."
      email: "Juurdepääs teie konto e-posti aadressile. Saadame teile sinna koodi ja hiljem saadab ka teie praegune server teile sinna koodi."
      time: "Umbes pool tundi, mille jooksul te oma kontot ei kasuta."
      invite: "Mõne serveri puhul kutsekood. Viisard ütleb teile, kas teie valitud server seda nõuab."
    moves:
      title: "Mis tuleb teiega kaasa"
      everything: "Kõik, mis on teie kontol: teie postitused ja vastused, meeldimised ja taaspostitused, jälgimised, loendid ja blokeeringud, teie profiil, pildid ja videod ning rakenduse seaded, näiteks salvestatud voogud ja vaigistatud sõnad. Ka teie identiteet tuleb kaasa, nii et inimesed, kes teid jälgivad, jälgivad teid ka edaspidi."
      handle: "Teie handle saab kaasa tulla, kui see on teie oma domeenil. Teie praeguse serveri domeenil olev handle, näiteks nimi.bsky.social, jääb maha: valite uues serveris endale uue."
    steps:
      title: "Samm-sammult"
      sign_in:
        title: "Logige sisse"
        text: "Logige sisse oma praeguse handle'i ja parooliga. Kasutame neid üleviimise alustamiseks ega salvesta kunagi teie parooli."
      choose:
        title: "Valige sihtkoht"
        text: "Valige server, nõustuge selle tingimustega, kui neid on, ja valige seal oma handle. Soovi korral saate tellida ka kogu oma konto varukoopia."
      verify:
        title: "Kinnitage oma e-posti aadress"
        text: "Saadame teile e-postiga koodi. Üleviimine algab, kui sisestate selle oma migreerimise olekulehel."
      copy:
        title: "Kopeerime teie konto"
        text: "Loome teie konto uues serveris ja kopeerime sinna kõik; olekulehel näete edenemist. Ärge vahepeal postitage, märkige midagi meeldivaks ega hakake kedagi jälgima: need muudatused ei tuleks kaasa."
      confirm:
        title: "Kinnitage üleviimine"
        text: "Teie praegune server saadab teile e-postiga kinnituskoodi. Sisestage see tunni jooksul olekulehel või taotlege uus. See samm suunab teie identiteedi uude serverisse."
      done:
        title: "Valmis"
        text: "Teie konto uues serveris aktiveeritakse ja vana konto deaktiveeritakse. Saadame teile e-postiga sisselogimise juhised koos teie uue konto parooliga."
    know:
      title: "Hea teada"
      duration: "Enamik üleviimisi võtab aega 20–30 minutit. Paljude piltide ja videotega kontode puhul kulub rohkem aega."
      cancel: "Kuni te pole 5. sammus kinnituskoodi sisestanud, saate üleviimise tühistada ja teie konto jääb sinna, kus see on."
      recovery: "Identiteedi uude serverisse suunamist ei saa siin tagasi võtta. Anname teile taastamisvõtme, millega saab selle tagasi võtta, seega hoidke seda kindlas kohas."
      old_account: "Teie vana konto deaktiveeritakse, mitte ei kustutata. Hiljem saate selle tööriistaga tagasi oma vanasse serverisse kolida."
      backup: "Kui tellisite varukoopia, saate selle alla laadida 24 tunni jooksul."
      deletion: "Kustutame teie üleviimise kirje ja kõik, mida selle jaoks säilitasime, 2 päeva pärast üleviimise lõppu."
      sign_in: "Hiljem sisselogimiseks kasutage oma uut handle'it ja valige rakenduses majutusteenuse pakkujaks oma uus server."


