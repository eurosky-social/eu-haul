        continue: "Jätka"

      # Step 5: Review & Confirm
      step5:
        title: "Ülevaade ja kinnitus"
        subtitle: "Kontrollige allolevad andmed üle, enne kui saadame kinnituskirja."
        current_handle: "Praegune handle"
        email: "E-post"
        destination_server: "Sihtserver"
        new_handle: "Uus handle"
        invite_code: "Kutsekood"
        create_backup: "Loo varukoopia enne migreerimist"
        backup_help: "Laadib alla teie konto andmete täieliku koopia. Saadaval 24 tundi."
        confirm_email_html: "Kui klõpsate nuppu <strong>Jätka</strong>, saadame kinnitusmeili aadressile <strong>%{email}</strong>. Migreerimine algab alles pärast selle e-kirja kinnitamist."
        no_usage_title: "Ärge kasutage oma kontot migreerimise ajal"
        no_usage_help: "Kui migreerimine algab, sulgege kõik rakendused ja brauseriaknad oma kontoga. Migreerimise ajal tehtud postitusi, meeldimisi ega jälgimisi ei kanta üle. Saate e-kirja, kui protsess on lõppenud (~20-30 minutit)."
