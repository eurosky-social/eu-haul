        email: "E-post"
        destination: "Sihtkoht"
        handle: "Handle"
        review: "Ülevaade"

      # Step 1: Account Credentials
      step1:
        title: "Konto andmed"
        subtitle: "Logige sisse kontole, mida soovite üle viia. Me ei salvesta kunagi teie parooli."
