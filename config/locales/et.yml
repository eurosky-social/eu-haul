        back: "Tagasi"
        continue: "Jätka"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Kas lahkuda migreerimisest?"
        body: "Teie sisestatud andmed lähevad kaotsi. Teie kontol pole veel midagi muudetud."
        stay: "Jää siia"
        leave: "Lahku"

