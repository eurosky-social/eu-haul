        handle_placeholder: "teiehandle.bsky.social"
        handle_help: "Sisestage oma praegune AT Protocol handle"
        password_label: "Konto parool"
        password_help: "Teie praegune konto parool (rakenduse paroolid ei tööta)"
        two_factor_title: "Kaheastmeline autentimine"
        two_factor_help: "Sisselogimiskood on saadetud teie e-postile. Sisestage see allpool."
        two_factor_placeholder: "Sisestage oma sisselogimiskood"
        legal_consent_html: 'Olen lugenud ja nõustun <a href="%{tos_url}" target="_blank" rel="noopener">Teenuse tingimustega</a> ning kinnitan <a href="%{privacy_url}" target="_blank" rel="noopener">Privaatsuspoliitika</a> teadmiseks võtmist'
        continue: "Jätka"

      # Step 2: Email
      step2:
        title: "E-posti aadress"
        subtitle: "Saadame migreerimise olekuuuendused sellele e-posti aadressile."
        email_label: "E-posti aadress"
        email_help: "Saadame migreerimise olekuuuendused sellele e-posti aadressile"
        email_readonly_help: "E-posti aadress on teie kontolt tuvastatud"
        email_manual_help: "Me ei suutnud teie e-posti aadressi tuvastada. Palun sisestage see käsitsi."
        confirm_access: "Mul on juurdepääs sellele e-posti aadressile ja saan kätte sellele saadetud kinnituskoodi."
        one_account_per_email: "Sellest aadressist saab ka teie konto e-posti aadress uues serveris, ja server lubab ühe aadressi kohta ainult ühte kontot. Kui olete seal selle aadressiga juba registreerunud, kustutage see konto või muutke kõigepealt selle e-posti aadressi — muidu migreerimine peatub."
        back: "Tagasi"
        continue: "Jätka"

      # Step 3: Destination Server
      step3:
        title: "Sihtserver"
