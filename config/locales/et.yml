        custom_url_help: "Sisestage oma kohandatud serveri täielik URL"
        invite_code_label: "Kutsekood"
        invite_code_placeholder: "Sisestage oma kutsekood"
        invite_code_help: "See server nõuab kutsekoodi"
        existing_account_title: "Olemasolev konto leitud"
        existing_account_help: "Teie konto on sihtserveris juba olemas. Palun kinnitage oma parool, et jätkata migreerimist."
        target_password_label: "Teie parool sihtserveris"
        target_password_placeholder: "Sisestage oma olemasoleva konto parool"
        target_2fa_label: "Sisselogimiskood (2FA)"
        target_2fa_help: "Kontrollige oma e-posti kaheastmelise autentimise koodi saamiseks"
        deactivated_notice: "See konto tundub olevat deaktiveeritud"
        deactivated_reason: "(võimalik, et varasema migreerimiskatse tõttu)."
