        pds_consent_title: "Sihtserveri õiguslikud tingimused"
        back: "Tagasi"
        continue: "Jätka"

      # Step 4: New Handle
      step4:
        title: "Uus handle"
        custom_domain_title: "Kohandatud domeen tuvastatud"
        custom_domain_help: "Teie handle %{handle} on kohandatud domeen. Saate seda uuel serveril edasi kasutada."
        keep_handle: "Säilita praegune handle"
        new_handle_label: "Teie uus handle"
        new_handle_placeholder: "kasutajanimi"
        domain_label: "Handle'i domeen"
        new_handle_help: "Valige oma uus handle (võib olla vana) sihtserveris."
