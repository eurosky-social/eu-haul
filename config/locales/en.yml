        email: "Email"
        destination: "Destination"
        handle: "Handle"
        review: "Review"

      # Step 1: Account Credentials
      step1:
        title: "Account credentials"
        subtitle: "Sign in to the account you want to move. We never store your password."
        handle_label: "Your handle"
        handle_placeholder: "yourhandle.bsky.social"
        handle_help: "Enter your current AT Protocol handle"
        password_label: "Account password"
        password_help: "Your current account password (app passwords will not work)"
        two_factor_title: "Two-factor authentication"
        two_factor_help: "A sign-in code has been sent to your email. Enter it below."
        two_factor_placeholder: "Enter your sign-in code"
        legal_consent_html: 'I have read and agree to the <a href="%{tos_url}" target="_blank" rel="noopener">Terms of Service</a> and acknowledge the <a href="%{privacy_url}" target="_blank" rel="noopener">Privacy Policy</a>'
        continue: "Continue"

      # Step 2: Email
      step2:
        title: "Email address"
        subtitle: "We'll send migration status updates to this email."
        email_label: "Email address"
        email_help: "We'll send migration status updates to this email"
