        subtitle: "Choose where you want to migrate your account."
        server_label: "Destination server"
        server_placeholder: "Select a server…"
        server_custom: "Custom server…"
        server_help: "Choose where you want to migrate your account"
        custom_url_label: "Custom server URL"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Enter the full URL of your custom server"
        invite_code_label: "Invite code"
        invite_code_placeholder: "Enter your invite code"
        invite_code_help: "This server requires an invite code"
        existing_account_title: "Existing account found"
        existing_account_help: "Your account already exists on the destination server. Please verify your password to continue with the migration."
        target_password_label: "Your password on the target server"
        target_password_placeholder: "Enter your password for the existing account"
        target_2fa_label: "Sign-in code (2FA)"
        target_2fa_help: "Check your email for the two-factor authentication code"
        deactivated_notice: "This account appears to be deactivated"
        deactivated_reason: "(possibly from a previous migration attempt)."
        deactivated_help: "If you don't remember your password, you can try:"
        deactivated_reset: "Reset your password:"
        deactivated_contact: "Contact the PDS admin at %{email} to remove this inactive account and restart the migration. Include your DID:"
        pds_consent_title: "Destination server legal terms"
        back: "Back"
        continue: "Continue"

