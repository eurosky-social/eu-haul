      converting_blobs_detail: "this may take a few minutes..."
      blobs_converted: "Legacy blob format converted successfully."

      # Blob progress
      blobs_uploaded: "Blobs uploaded"
      files: "files"
      data_transferred: "Data transferred"
      failed: "Failed"
      retry_failed_blobs: "Retry failed files"
