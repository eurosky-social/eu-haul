  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "How it works"
    title: "How moving your account works"
    lead: "Your account moves to another server in about half an hour. Your posts, follows and identity come with you, and the people who follow you keep following you."
    before:
      title: "Before you start"
      credentials: "Your current handle and your account password. App passwords don't work. If you use two-factor authentication, you'll also need the sign-in code we ask for."
      email: "Access to the email address of your account. We send you a code there, and later your current server sends you one too."
      time: "About half an hour in which you don't use your account."
      invite: "For some servers, an invite code. The wizard tells you if the server you pick needs one."
    moves:
      title: "What moves with you"
      everything: "Everything in your account: your posts and replies, likes and reposts, follows, lists and blocks, your profile, your images and videos, and your app settings, such as saved feeds and muted words. Your identity moves too, so the people who follow you keep following you."
      handle: "Your handle can come along if it's on your own domain. A handle on your current server's domain, such as name.bsky.social, stays behind: you choose a new one on the new server."
    steps:
      title: "Step by step"
      sign_in:
        title: "Sign in"
        text: "Sign in with your current handle and password. We use them to start the move and never store your password."
      choose:
        title: "Choose where to go"
        text: "Pick a server, accept its terms if it has any, and choose your handle there. You can also ask for a backup of your whole account."
      verify:
        title: "Confirm your email"
        text: "We email you a code. The move starts once you enter it on your migration's status page."
      copy:
        title: "We copy your account"
        text: "We create your account on the new server and copy everything to it; the status page shows the progress. Don't post, like or follow in the meantime: those changes wouldn't come along."
      confirm:
        title: "Confirm the move"
        text: "Your current server emails you a confirmation code. Enter it on the status page within an hour, or request a new one. This step points your identity at the new server."
      done:
        title: "Done"
        text: "Your account on the new server is switched on and the old one is deactivated. We email you how to sign in, together with your new account's password."
    know:
      title: "Good to know"
      duration: "Most moves take 20–30 minutes. Accounts with many images and videos take longer."
      cancel: "Until you enter the confirmation code in step 5, you can cancel the move, and your account stays where it is."
      recovery: "Pointing your identity at the new server can't be undone here. We give you a recovery key that can undo it, so keep it somewhere safe."
      old_account: "Your old account is deactivated, not deleted. You can move back to its server later with this tool."
      backup: "If you asked for a backup, you can download it for 24 hours."
      deletion: "We delete the record of your move, and everything we kept for it, 2 days after the move is complete."
      sign_in: "To sign in afterwards, use your new handle and choose your new server as the hosting provider in your app."


