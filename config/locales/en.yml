        subtitle: "Check the details below before we send the confirmation email."
        current_handle: "Current handle"
        email: "Email"
        destination_server: "Destination server"
        new_handle: "New handle"
        invite_code: "Invite code"
        create_backup: "Create a backup before migration"
        backup_help: "Downloads a complete copy of your account data. Available for 24 hours."
