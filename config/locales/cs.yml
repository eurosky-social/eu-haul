  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Přesuňte svůj účet"
    title: "Přesuňte svůj účet do Evropy"
    title_named: "Přesuňte svůj účet do %{name}"
    lead: "Přeneste své příspěvky, sledované účty a identitu na evropský server. Váš handle může jít s vámi a vaši sledující si ničeho nevšimnou."
    start: "Zahájit migraci"
    how_it_works: "Jak to funguje"
    steps_label: "Jak přesun probíhá"
    steps:
      sign_in:
        label: "Přihlaste se"
        text: "Přihlaste se svým aktuálním handlem a heslem. Heslo použijeme jen jednou a nikdy ho neukládáme."
      server:
        label: "Vyberte server"
        text: "Vyberte Eurosky nebo jakýkoli jiný server a zvolte si nový handle."
      confirm:
        label: "Potvrďte e-mailem"
        text: "Přeneseme vaše data a požádáme vás o potvrzení posledního kroku e-mailem. Trvá to asi 20–30 minut."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Jak to funguje"
    title: "Jak funguje přesun účtu"
    lead: "Váš účet se přesune na jiný server přibližně za půl hodiny. Vaše příspěvky, sledované účty i identita se přesunou s vámi a lidé, kteří vás sledují, vás budou sledovat dál."
    before:
      title: "Než začnete"
      credentials: "Váš aktuální handle a heslo k účtu. Hesla aplikací nefungují. Pokud používáte dvoufaktorové ověření, budete potřebovat také přihlašovací kód, o který vás požádáme."
      email: "Přístup k e-mailové adrese vašeho účtu. Pošleme vám na ni kód a později vám tam kód pošle i váš současný server."
      time: "Přibližně půl hodiny, během které svůj účet nebudete používat."
      invite: "U některých serverů zvací kód. Průvodce vám řekne, zda ho vámi zvolený server vyžaduje."
    moves:
      title: "Co se přesune s vámi"
      everything: "Vše, co je ve vašem účtu: vaše příspěvky a odpovědi, lajky a reposty, sledované účty, seznamy a blokování, váš profil, vaše obrázky a videa a nastavení aplikací, například uložené kanály a ztlumená slova. Přesune se i vaše identita, takže lidé, kteří vás sledují, vás budou sledovat dál."
      handle: "Váš handle se může přesunout s vámi, pokud je na vaší vlastní doméně. Handle na doméně vašeho současného serveru, například name.bsky.social, zůstane na původním serveru: na novém serveru si zvolíte nový."
    steps:
      title: "Krok za krokem"
      sign_in:
        title: "Přihlaste se"
        text: "Přihlaste se svým aktuálním handlem a heslem. Použijeme je k zahájení přesunu a vaše heslo nikdy neukládáme."
      choose:
        title: "Vyberte, kam se přesunout"
        text: "Vyberte server, přijměte jeho podmínky, pokud nějaké má, a zvolte si tam svůj handle. Můžete si také vyžádat zálohu celého účtu."
      verify:
        title: "Potvrďte svůj e-mail"
        text: "Pošleme vám e-mailem kód. Přesun začne, jakmile ho zadáte na stránce stavu migrace."
      copy:
        title: "Zkopírujeme váš účet"
        text: "Vytvoříme váš účet na novém serveru a zkopírujeme na něj vše; průběh uvidíte na stránce stavu. Mezitím nic nepublikujte, nedávejte lajky ani nikoho nesledujte: tyto změny by se nepřenesly."
      confirm:
        title: "Potvrďte přesun"
        text: "Váš současný server vám e-mailem pošle potvrzovací kód. Zadejte ho na stránce stavu do jedné hodiny, nebo si vyžádejte nový. Tímto krokem se vaše identita přesměruje na nový server."
      done:
        title: "Hotovo"
        text: "Váš účet na novém serveru se aktivuje a starý se deaktivuje. E-mailem vám pošleme pokyny k přihlášení spolu s heslem k novému účtu."
    know:
      title: "Dobré vědět"
      duration: "Většina přesunů trvá 20–30 minut. U účtů s mnoha obrázky a videi to trvá déle."
      cancel: "Dokud nezadáte potvrzovací kód v kroku 5, můžete přesun zrušit a váš účet zůstane tam, kde je."
      recovery: "Přesměrování vaší identity na nový server zde nelze vrátit zpět. Dostanete od nás klíč pro obnovu, kterým to lze vrátit, proto si ho uložte na bezpečné místo."
      old_account: "Váš starý účet bude deaktivován, ne smazán. Později se můžete pomocí tohoto nástroje přesunout zpět na jeho server."
      backup: "Pokud jste si vyžádali zálohu, můžete si ji stáhnout po dobu 24 hodin."
      deletion: "Záznam o vašem přesunu a vše, co jsme k němu uchovávali, smažeme 2 dny po dokončení přesunu."
      sign_in: "Pro pozdější přihlášení použijte svůj nový handle a ve své aplikaci zvolte jako poskytovatele hostingu svůj nový server."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Zahájení migrace účtu"
      errors_heading: "Opravte prosím následující chyby:"
      card_label: "Zahájení migrace účtu"
      step_of: "Krok %{current} z %{total}"
      steps_label: "Kroky migrace"

      # Progress bar labels
      progress:
        account: "Účet"
        email: "E-mail"
        destination: "Cíl"
        handle: "Handle"
        review: "Kontrola"

      # Step 1: Account Credentials
      step1:
        title: "Přihlašovací údaje"
        subtitle: "Přihlaste se k účtu, který chcete přesunout. Vaše heslo nikdy neukládáme."
        handle_label: "Váš handle"
        handle_placeholder: "vashandle.bsky.social"
        handle_help: "Zadejte svůj aktuální AT Protocol handle"
        password_label: "Heslo účtu"
        password_help: "Vaše aktuální heslo účtu (hesla aplikací nebudou fungovat)"
        two_factor_title: "Dvoufaktorové ověření"
        two_factor_help: "Na váš e-mail byl odeslán přihlašovací kód. Zadejte jej níže."
        two_factor_placeholder: "Zadejte přihlašovací kód"
        legal_consent_html: 'Přečetl/a jsem si a souhlasím s <a href="%{tos_url}" target="_blank" rel="noopener">Podmínkami služby</a> a beru na vědomí <a href="%{privacy_url}" target="_blank" rel="noopener">Zásady ochrany osobních údajů</a>'
        continue: "Pokračovat"

      # Step 2: Email
      step2:
        title: "E-mailová adresa"
        subtitle: "Na tento e-mail budeme zasílat aktualizace o stavu migrace."
        email_label: "E-mailová adresa"
        email_help: "Na tento e-mail budeme zasílat aktualizace o stavu migrace"
        email_readonly_help: "E-mail byl získán z vašeho účtu"
        email_manual_help: "Nepodařilo se nám získat váš e-mail. Zadejte jej prosím ručně."
        confirm_access: "Mám přístup k této e-mailové adrese a mohu získat potvrzovací kód, který na ni bude odeslán."
        back: "Zpět"
        continue: "Pokračovat"

      # Step 3: Destination Server
      step3:
        title: "Cílový server"
        subtitle: "Vyberte, kam chcete svůj účet přemigrovat."
        server_label: "Cílový server"
        server_placeholder: "Vyberte server…"
        server_custom: "Vlastní server…"
        server_help: "Vyberte, kam chcete svůj účet přemigrovat"
        custom_url_label: "URL vlastního serveru"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Zadejte úplnou URL adresu vašeho vlastního serveru"
        invite_code_label: "Zvací kód"
        invite_code_placeholder: "Zadejte zvací kód"
        invite_code_help: "Tento server vyžaduje zvací kód"
        existing_account_title: "Nalezen existující účet"
        existing_account_help: "Váš účet již na cílovém serveru existuje. Pro pokračování migrace prosím ověřte své heslo."
        target_password_label: "Vaše heslo na cílovém serveru"
        target_password_placeholder: "Zadejte heslo pro existující účet"
        target_2fa_label: "Přihlašovací kód (2FA)"
        target_2fa_help: "Zkontrolujte svůj e-mail, zda neobsahuje kód pro dvoufaktorové ověření"
        deactivated_notice: "Tento účet se zdá být deaktivován"
        deactivated_reason: "(pravděpodobně z předchozího pokusu o migraci)."
        deactivated_help: "Pokud si nepamatujete heslo, můžete zkusit:"
        deactivated_reset: "Obnovení hesla:"
        deactivated_contact: "Kontaktujte správce PDS na %{email} pro odstranění tohoto neaktivního účtu a restartování migrace. Uveďte svůj DID:"
        pds_consent_title: "Právní podmínky cílového serveru"
        back: "Zpět"
        continue: "Pokračovat"

      # Step 4: New Handle
      step4:
        title: "Nový handle"
        custom_domain_title: "Zjištěna vlastní doména"
        custom_domain_help: "Váš handle %{handle} je vlastní doména. Můžete jej nadále používat na novém serveru."
        keep_handle: "Ponechat aktuální handle"
        new_handle_label: "Váš nový handle"
        new_handle_placeholder: "uživatelskéjméno"
        domain_label: "Doména handle"
        new_handle_help: "Zvolte si nový handle (může být i stávající) na cílovém serveru."
        back: "Zpět"
        continue: "Pokračovat"

      # Step 5: Review & Confirm
      step5:
        title: "Kontrola a potvrzení"
        subtitle: "Než odešleme potvrzovací e-mail, zkontrolujte níže uvedené údaje."
        current_handle: "Aktuální handle"
        email: "E-mail"
        destination_server: "Cílový server"
        new_handle: "Nový handle"
        invite_code: "Zvací kód"
        create_backup: "Vytvořit zálohu před migrací"
        backup_help: "Stáhne kompletní kopii dat vašeho účtu. K dispozici po dobu 24 hodin."
        confirm_email_html: "Po kliknutí na <strong>Pokračovat</strong> vám pošleme potvrzovací e-mail na adresu <strong>%{email}</strong>. Migrace začne až po potvrzení prostřednictvím tohoto e-mailu."
        no_usage_title: "Během migrace nepoužívejte svůj účet"
        no_usage_help: "Jakmile migrace začne, zavřete všechny aplikace a karty prohlížeče s vaším účtem. Příspěvky, lajky ani sledování provedené během migrace nebudou přeneseny. Po dokončení obdržíte e-mail (~20–30 minut)."
        acknowledge: "Rozumím, že bych během migrace neměl/a používat svůj účet"
        back: "Zpět"
        continue: "Pokračovat"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Opustit migraci?"
        body: "Zadané údaje budou ztraceny. Na vašem účtu se zatím nic nezměnilo."
        stay: "Zůstat zde"
        leave: "Odejít"

