  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Преместете акаунта си"
    title: "Преместете акаунта си в Европа"
    title_named: "Преместете акаунта си в %{name}"
    lead: "Пренесете публикациите, последванията и самоличността си на европейски сървър. Вашият handle може да дойде с Вас, а последователите Ви няма да забележат нищо."
    start: "Стартирай миграция"
    how_it_works: "Как работи"
    steps_label: "Как протича преместването"
    steps:
      sign_in:
        label: "Влезте"
        text: "Влезте с текущия си handle и парола. Използваме паролата само веднъж и никога не я съхраняваме."
      server:
        label: "Изберете сървър"
        text: "Изберете Eurosky или друг сървър и изберете новия си handle."
      confirm:
        label: "Потвърдете по имейл"
        text: "Прехвърляме данните Ви и Ви молим да потвърдите последната стъпка по имейл. Отнема около 20–30 минути."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Как работи"
    title: "Как протича преместването на акаунта"
    lead: "Акаунтът Ви се премества на друг сървър за около половин час. Публикациите, последванията и самоличността Ви идват с Вас, а хората, които Ви следват, продължават да Ви следват."
    before:
      title: "Преди да започнете"
      credentials: "Текущият Ви handle и паролата на акаунта Ви. Паролите за приложения не работят. Ако използвате двуфакторна автентикация, ще Ви трябва и кодът за вход, който ще поискаме."
      email: "Достъп до имейл адреса на акаунта Ви. Там ще Ви изпратим код, а по-късно и текущият Ви сървър ще Ви изпрати такъв."
      time: "Около половин час, през който не използвате акаунта си."
      invite: "За някои сървъри — код за покана. Помощникът ще Ви каже, ако избраният от Вас сървър изисква такъв."
    moves:
      title: "Какво се премества с Вас"
      everything: "Всичко в акаунта Ви: публикациите и отговорите, харесванията и репостовете, последванията, списъците и блокиранията, профилът, изображенията и видеата, както и настройките на приложението, например запазените емисии и заглушените думи. Самоличността Ви също се премества, така че хората, които Ви следват, продължават да Ви следват."
      handle: "Вашият handle може да дойде с Вас, ако е на Ваш собствен домейн. Handle в домейна на текущия Ви сървър, например name.bsky.social, остава там: на новия сървър избирате нов."
    steps:
      title: "Стъпка по стъпка"
      sign_in:
        title: "Влезте"
        text: "Влезте с текущия си handle и парола. Използваме ги, за да започнем преместването, и никога не съхраняваме паролата Ви."
      choose:
        title: "Изберете накъде"
        text: "Изберете сървър, приемете условията му, ако има такива, и си изберете handle там. Можете също да поискате резервно копие на целия си акаунт."
      verify:
        title: "Потвърдете имейла си"
        text: "Изпращаме Ви код по имейл. Преместването започва, щом го въведете на страницата за статус на миграцията Ви."
      copy:
        title: "Копираме акаунта Ви"
        text: "Създаваме акаунта Ви на новия сървър и копираме всичко в него; страницата за статус показва напредъка. Междувременно не публикувайте, не харесвайте и не следвайте никого: тези промени няма да бъдат пренесени."
      confirm:
        title: "Потвърдете преместването"
        text: "Текущият Ви сървър Ви изпраща код за потвърждение по имейл. Въведете го на страницата за статус в рамките на един час или поискайте нов. Тази стъпка пренасочва самоличността Ви към новия сървър."
      done:
        title: "Готово"
        text: "Акаунтът Ви на новия сървър се активира, а старият се деактивира. Изпращаме Ви по имейл указания как да влезете, заедно с паролата на новия Ви акаунт."
    know:
      title: "Добре е да знаете"
      duration: "Повечето премествания отнемат 20–30 минути. Акаунтите с много изображения и видеа отнемат повече време."
      cancel: "Докато не въведете кода за потвърждение в стъпка 5, можете да отмените преместването и акаунтът Ви остава там, където е."
      recovery: "Пренасочването на самоличността Ви към новия сървър не може да бъде отменено оттук. Даваме Ви ключ за възстановяване, с който то може да бъде отменено, затова го пазете на сигурно място."
      old_account: "Старият Ви акаунт се деактивира, а не се изтрива. По-късно можете да се върнете на неговия сървър с този инструмент."
      backup: "Ако сте поискали резервно копие, можете да го изтеглите в продължение на 24 часа."
      deletion: "Изтриваме записа за преместването Ви и всичко, което сме пазили за него, 2 дни след като преместването завърши."
      sign_in: "За да влезете след това, използвайте новия си handle и изберете новия си сървър като хостинг доставчик в приложението си."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
  migrations:
    new:
      page_title: "Стартиране на миграция на акаунт"
      errors_heading: "Моля, коригирайте следните грешки:"
      card_label: "Стартиране на миграция на акаунт"
      step_of: "Стъпка %{current} от %{total}"
      steps_label: "Стъпки на миграцията"

      # Progress bar labels
      progress:
        account: "Акаунт"
        email: "Имейл"
        destination: "Дестинация"
        handle: "Handle"
        review: "Преглед"

      # Step 1: Account Credentials
      step1:
        title: "Данни за акаунта"
        subtitle: "Влезте в акаунта, който искате да преместите. Никога не съхраняваме паролата Ви."
        handle_label: "Вашият handle"
        handle_placeholder: "вашиятhandle.bsky.social"
        handle_help: "Въведете текущия си AT Protocol handle"
        password_label: "Парола на акаунта"
        password_help: "Текущата парола на вашия акаунт (паролите за приложения няма да работят)"
        two_factor_title: "Двуфакторна автентикация"
        two_factor_help: "На имейла Ви беше изпратен код за вход. Въведете го по-долу."
        two_factor_placeholder: "Въведете кода за вход"
        legal_consent_html: 'Прочетох и приемам <a href="%{tos_url}" target="_blank" rel="noopener">Условията за ползване</a> и потвърждавам <a href="%{privacy_url}" target="_blank" rel="noopener">Политиката за поверителност</a>'
        continue: "Продължи"

      # Step 2: Email
      step2:
        title: "Имейл адрес"
        subtitle: "Ще изпращаме актуализации за статуса на миграцията на този имейл."
        email_label: "Имейл адрес"
        email_help: "Ще изпращаме актуализации за статуса на миграцията на този имейл"
        email_readonly_help: "Имейлът е извлечен от Вашия акаунт"
        email_manual_help: "Не успяхме да извлечем имейла Ви. Моля, въведете го ръчно."
        confirm_access: "Имам достъп до този имейл адрес и мога да получа изпратен до него код за потвърждение."
        back: "Назад"
        continue: "Продължи"

      # Step 3: Destination Server
      step3:
        title: "Целеви сървър"
        subtitle: "Изберете къде искате да мигрирате акаунта си."
        server_label: "Целеви сървър"
        server_placeholder: "Изберете сървър…"
        server_custom: "Друг сървър…"
        server_help: "Изберете къде искате да мигрирате акаунта си"
        custom_url_label: "URL на друг сървър"
        custom_url_placeholder: "https://pds.example.com"
        custom_url_help: "Въведете пълния URL на Вашия сървър"
        invite_code_label: "Код за покана"
        invite_code_placeholder: "Въведете кода за покана"
        invite_code_help: "Този сървър изисква код за покана"
        existing_account_title: "Намерен е съществуващ акаунт"
        existing_account_help: "Вашият акаунт вече съществува на целевия сървър. Моля, потвърдете паролата си, за да продължите с миграцията."
        target_password_label: "Паролата Ви на целевия сървър"
        target_password_placeholder: "Въведете паролата за съществуващия акаунт"
        target_2fa_label: "Код за вход (2FA)"
        target_2fa_help: "Проверете имейла си за кода за двуфакторна автентикация"
        deactivated_notice: "Този акаунт изглежда е деактивиран"
        deactivated_reason: "(вероятно от предишен опит за миграция)."
        deactivated_help: "Ако не помните паролата си, можете да опитате:"
        deactivated_reset: "Нулиране на паролата:"
        deactivated_contact: "Свържете се с администратора на PDS на %{email}, за да премахне този неактивен акаунт и да рестартирате миграцията. Включете своя DID:"
        pds_consent_title: "Правни условия на целевия сървър"
        back: "Назад"
        continue: "Продължи"

      # Step 4: New Handle
      step4:
        title: "Нов handle"
        custom_domain_title: "Открит е потребителски домейн"
        custom_domain_help: "Вашият handle %{handle} е потребителски домейн. Можете да продължите да го използвате на новия сървър."
        keep_handle: "Запази текущия ми handle"
        new_handle_label: "Вашият нов handle"
        new_handle_placeholder: "потребителско_име"
        domain_label: "Домейн на handle"
        new_handle_help: "Изберете нов handle (може да бъде старият) на целевия сървър."
        back: "Назад"
        continue: "Продължи"

      # Step 5: Review & Confirm
      step5:
        title: "Преглед и потвърждение"
        subtitle: "Проверете данните по-долу, преди да изпратим имейла за потвърждение."
        current_handle: "Текущ handle"
        email: "Имейл"
        destination_server: "Целеви сървър"
        new_handle: "Нов handle"
        invite_code: "Код за покана"
        create_backup: "Създай резервно копие преди миграцията"
        backup_help: "Изтегля пълно копие на данните на акаунта Ви. Налично за 24 часа."
        confirm_email_html: "Когато щракнете <strong>Продължи</strong>, ще изпратим имейл за потвърждение на <strong>%{email}</strong>. Миграцията ще започне едва след като потвърдите чрез този имейл."
        no_usage_title: "Не използвайте акаунта си по време на миграция"
        no_usage_help: "След като миграцията започне, затворете всички приложения и раздели в браузъра с Вашия акаунт. Публикации, харесвания или последвания, направени по време на миграцията, няма да бъдат прехвърлени. Ще получите имейл, когато процесът приключи (~20-30 минути)."
        acknowledge: "Разбирам, че не трябва да използвам акаунта си по време на миграцията"
        back: "Назад"
        continue: "Продължи"

      # Dialog when leaving the wizard through the logo
      leave:
        title: "Да напуснете ли миграцията?"
        body: "Въведените данни ще бъдат загубени. В акаунта Ви все още нищо не е променено."
        stay: "Остани тук"
        leave: "Напусни"

