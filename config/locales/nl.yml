        new_handle_label: "Uw nieuwe handle"
        new_handle_placeholder: "gebruikersnaam"
        domain_label: "Handle-domein"
        new_handle_help: "Kies uw nieuwe handle (kan uw oude zijn) op de doelserver."
        back: "Terug"
        continue: "Doorgaan"

      # Step 5: Review & Confirm
      step5:
        title: "Controle en bevestiging"
        subtitle: "Controleer de gegevens hieronder voordat we de bevestigingsmail sturen."
        current_handle: "Huidige handle"
        email: "E-mail"
        destination_server: "Doelserver"
        new_handle: "Nieuwe handle"
        invite_code: "Uitnodigingscode"
        create_backup: "Maak een back-up voordat u migreert"
        backup_help: "Downloadt een volledige kopie van uw accountgegevens. 24 uur beschikbaar."
        confirm_email_html: "Wanneer u op <strong>Doorgaan</strong> klikt, sturen we een bevestigingsmail naar <strong>%{email}</strong>. De migratie start pas nadat u via die e-mail bevestigt."
        no_usage_title: "Gebruik uw account niet tijdens de migratie"
        no_usage_help: "Zodra de migratie begint, sluit u alle apps en browsertabbladen met uw account. Berichten, likes of volgers die tijdens de migratie worden gemaakt, worden niet overgedragen. U ontvangt een e-mail wanneer het klaar is (~20-30 minuten)."
