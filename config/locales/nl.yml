        pds_consent_title: "Juridische voorwaarden van de doelserver"
        back: "Terug"
        continue: "Doorgaan"

      # Step 4: New Handle
      step4:
        title: "Nieuwe handle"
        custom_domain_title: "Aangepast domein gedetecteerd"
        custom_domain_help: "Uw handle %{handle} is een aangepast domein. U kunt het blijven gebruiken op de nieuwe server."
