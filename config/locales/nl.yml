  # ──────────────────────────────────────────
  # Landing page (/)
  # ──────────────────────────────────────────
  landing:
    page_title: "Verhuis uw account"
    title: "Verhuis uw account naar Europa"
    title_named: "Verhuis uw account naar %{name}"
    lead: "Breng uw berichten, de accounts die u volgt en uw identiteit naar een Europese server. Uw handle kan mee, en uw volgers merken er niets van."
    start: "Migratie starten"
    how_it_works: "Zo werkt het"
    steps_label: "Zo werkt de verhuizing"
    steps:
      sign_in:
        label: "Inloggen"
        text: "Log in met uw huidige handle en wachtwoord. We gebruiken ze één keer en slaan ze nooit op."
      server:
        label: "Server kiezen"
        text: "Kies Eurosky of een andere server en bepaal uw nieuwe handle."
      confirm:
        label: "Per e-mail bevestigen"
        text: "We zetten uw gegevens over en vragen u de laatste stap per e-mail te bevestigen. Dit duurt ongeveer 20–30 minuten."

  # ──────────────────────────────────────────
  # How it works (/how-it-works)
  # ──────────────────────────────────────────
  how_it_works:
    page_title: "Zo werkt het"
    title: "Zo werkt het verhuizen van uw account"
    lead: "Uw account verhuist in ongeveer een half uur naar een andere server. Uw berichten, de accounts die u volgt en uw identiteit gaan mee, en de mensen die u volgen, blijven u volgen."
    before:
      title: "Voordat u begint"
      credentials: "Uw huidige handle en uw accountwachtwoord. App-wachtwoorden werken niet. Als u tweefactorauthenticatie gebruikt, hebt u ook de aanmeldcode nodig waar we om vragen."
      email: "Toegang tot het e-mailadres van uw account. We sturen u daar een code, en later stuurt uw huidige server u er ook een."
      time: "Ongeveer een half uur waarin u uw account niet gebruikt."
      invite: "Voor sommige servers een uitnodigingscode. De wizard laat u weten of de server die u kiest er een nodig heeft."
    moves:
      title: "Wat er meeverhuist"
      everything: "Alles in uw account: uw berichten en antwoorden, likes en reposts, de accounts die u volgt, lijsten en blokkeringen, uw profiel, uw afbeeldingen en video's, en uw app-instellingen, zoals opgeslagen feeds en gedempte woorden. Ook uw identiteit verhuist mee, zodat de mensen die u volgen, u blijven volgen."
      handle: "Uw handle kan mee als die op uw eigen domein staat. Een handle op het domein van uw huidige server, zoals naam.bsky.social, blijft achter: u kiest een nieuwe op de nieuwe server."
    steps:
      title: "Stap voor stap"
      sign_in:
        title: "Inloggen"
        text: "Log in met uw huidige handle en wachtwoord. We gebruiken ze om de verhuizing te starten en slaan uw wachtwoord nooit op."
      choose:
        title: "Kies waar u naartoe gaat"
        text: "Kies een server, accepteer de voorwaarden als die er zijn, en kies daar uw handle. U kunt ook een back-up van uw hele account aanvragen."
      verify:
        title: "Bevestig uw e-mailadres"
        text: "We mailen u een code. De verhuizing begint zodra u die invoert op de statuspagina van uw migratie."
      copy:
        title: "Wij kopiëren uw account"
        text: "We maken uw account aan op de nieuwe server en kopiëren alles daarheen; de statuspagina toont de voortgang. Plaats intussen geen berichten, likes of follows: die wijzigingen gaan niet mee."
      confirm:
        title: "Bevestig de verhuizing"
        text: "Uw huidige server mailt u een bevestigingscode. Voer die binnen een uur in op de statuspagina, of vraag een nieuwe aan. Met deze stap gaat uw identiteit naar de nieuwe server verwijzen."
      done:
        title: "Klaar"
        text: "Uw account op de nieuwe server wordt ingeschakeld en het oude wordt gedeactiveerd. We mailen u hoe u inlogt, samen met het wachtwoord van uw nieuwe account."
    know:
      title: "Goed om te weten"
      duration: "De meeste verhuizingen duren 20–30 minuten. Accounts met veel afbeeldingen en video's duren langer."
      cancel: "Tot u in stap 5 de bevestigingscode invoert, kunt u de verhuizing annuleren en blijft uw account waar het is."
      recovery: "Het doorverwijzen van uw identiteit naar de nieuwe server kan hier niet ongedaan worden gemaakt. We geven u een herstelsleutel waarmee dat wel kan, dus bewaar die op een veilige plek."
      old_account: "Uw oude account wordt gedeactiveerd, niet verwijderd. U kunt later met deze tool terugverhuizen naar de server ervan."
      backup: "Als u een back-up hebt aangevraagd, kunt u die 24 uur lang downloaden."
      deletion: "We verwijderen het record van uw verhuizing, en alles wat we ervoor hebben bewaard, 2 dagen nadat de verhuizing is voltooid."
      sign_in: "Log daarna in met uw nieuwe handle en kies in uw app uw nieuwe server als hostingprovider."


  # ──────────────────────────────────────────
  # Wizard form (migrations/new)
  # ──────────────────────────────────────────
