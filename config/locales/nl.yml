        handle_help: "Voer uw huidige AT Protocol-handle in"
        password_label: "Accountwachtwoord"
        password_help: "Uw huidige accountwachtwoord (app-wachtwoorden werken niet)"
        two_factor_title: "Tweefactorauthenticatie"
        two_factor_help: "Er is een aanmeldcode naar uw e-mailadres gestuurd. Voer deze hieronder in."
        two_factor_placeholder: "Voer uw aanmeldcode in"
        legal_consent_html: 'Ik heb de <a href="%{tos_url}" target="_blank" rel="noopener">Servicevoorwaarden</a> gelezen en ga ermee akkoord en neem kennis van het <a href="%{privacy_url}" target="_blank" rel="noopener">Privacybeleid</a>'
        continue: "Doorgaan"

      # Step 2: Email
      step2:
        title: "E-mailadres"
        subtitle: "We sturen migratiestatusupdates naar dit e-mailadres."
        email_label: "E-mailadres"
        email_help: "We sturen migratiestatusupdates naar dit e-mailadres"
        email_readonly_help: "E-mailadres opgehaald uit uw account"
        email_manual_help: "We konden uw e-mailadres niet ophalen. Voer het handmatig in."
        confirm_access: "Ik heb toegang tot dit e-mailadres en kan een bevestigingscode ontvangen die ernaar wordt gestuurd."
        one_account_per_email: "Dit adres wordt ook het e-mailadres van uw account op de nieuwe server, en een server staat maar één account per adres toe. Hebt u zich daar al met dit adres aangemeld, verwijder dat account dan of wijzig eerst het e-mailadres — anders stopt de migratie."
